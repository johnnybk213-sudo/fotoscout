// --- Haversine ---
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(km) {
  if (km === null) return '';
  return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Geolocation ---
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocation ikke tilgængelig'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(err),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 300000 }
    );
  });
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=da`);
    const d = await res.json();
    const addr = d.address;
    return addr.city || addr.town || addr.village || addr.municipality || addr.county || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
  } catch {
    return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
  }
}

// --- Load data ---
async function loadData() {
  try {
    const res = await fetch('./data.json?' + Date.now());
    if (res.ok) {
      state.data = await res.json();
    }
  } catch {}

  // Check localStorage for newer data
  const saved = localStorage.getItem('fotoscout-data');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed._modified && parsed.locations) {
        state.data = parsed;
      }
    } catch {}
  }

  // Sikr at begge arrays altid findes
  if (!Array.isArray(state.data.locations)) state.data.locations = [];
  if (!Array.isArray(state.data.inspirations)) state.data.inspirations = [];
}

// --- Indlæs by-liste (vestkyst-byer) ---
async function loadTowns() {
  try {
    const res = await fetch('./config/vestkyst-byer.json?' + Date.now());
    if (res.ok) {
      const d = await res.json();
      state.towns = d.towns || [];
    }
  } catch {}
}

// --- Find nærmeste by inden for grænsen ---
function findNearestTown(lat, lon) {
  let best = null;
  for (const t of state.towns) {
    const d = haversine(lat, lon, t.lat, t.lon);
    if (best === null || d < best.dist) best = { town: t, dist: d };
  }
  return (best && best.dist <= NEAR_THRESHOLD_KM) ? best : null;
}

// --- Hent Flickr-billeder for en by (med 24t cache) ---
async function fetchFlickrPhotos(town) {
  const cacheKey = `flickr-cache-${town.name}-r${FLICKR_RADIUS_KM}-n${FLICKR_POOL}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < FLICKR_CACHE_HOURS * 3600 * 1000) {
      return cached.photos;
    }
  } catch {}

  const params = new URLSearchParams({
    method: 'flickr.photos.search',
    api_key: FLICKR_KEY,
    lat: town.lat, lon: town.lon,
    radius: FLICKR_RADIUS_KM, radius_units: 'km',
    has_geo: 1,
    sort: 'interestingness-desc',
    per_page: FLICKR_POOL,
    extras: 'owner_name,geo,url_q,url_m,url_c,url_l,tags',
    content_type: 1, media: 'photos', safe_search: 1,
    format: 'json', nojsoncallback: 1
  });
  const url = 'https://api.flickr.com/services/rest/?' + params.toString();

  let photos = [];
  try {
    const res = await fetch(url);
    const d = await res.json();
    if (d.stat === 'ok' && d.photos && d.photos.photo) {
      photos = d.photos.photo.map(p => ({
        id: 'flickr-' + p.id,
        title: (p.title || '').trim() || 'Flickr-foto',
        ownername: p.ownername || '',
        owner: p.owner,
        thumb: p.url_c || p.url_m || p.url_q || '',
        large: p.url_l || p.url_c || p.url_m || '',
        lat: p.latitude ? parseFloat(p.latitude) : null,
        lon: p.longitude ? parseFloat(p.longitude) : null,
        page: `https://www.flickr.com/photos/${p.owner}/${p.id}`,
        town: town.name,
        tags: (p.tags || '').split(' ').filter(Boolean).slice(0, 12)
      })).filter(p => p.thumb);
    }
  } catch (e) {
    return [];
  }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), photos })); } catch {}
  return photos;
}

// --- Lag 1: hent landmark-billeder via kategori-søgninger (geo + text=) ---
// Kører én søgning pr. kategori, mærker hvert billede med sin kategori, og fletter
// resultaterne (dedup på id — første/stærkeste kategori vinder). 24t cache.
async function fetchFlickrLandmarks(town) {
  const cacheKey = `flickr-lm-${town.name}-r${FLICKR_RADIUS_KM}-n${FLICKR_CAT_PER}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < FLICKR_CACHE_HOURS * 3600 * 1000) return cached.photos;
  } catch {}

  const fetchCat = async (cat) => {
    const params = new URLSearchParams({
      method: 'flickr.photos.search', api_key: FLICKR_KEY,
      lat: town.lat, lon: town.lon, radius: FLICKR_RADIUS_KM, radius_units: 'km',
      has_geo: 1, text: cat.terms[0], sort: 'interestingness-desc', per_page: FLICKR_CAT_PER,
      extras: 'owner_name,geo,url_q,url_m,url_c,url_l,tags',
      content_type: 1, media: 'photos', safe_search: 1, format: 'json', nojsoncallback: 1
    });
    try {
      const res = await fetch('https://api.flickr.com/services/rest/?' + params.toString());
      const d = await res.json();
      if (d.stat === 'ok' && d.photos && d.photos.photo) {
        return d.photos.photo.map(p => ({
          id: 'flickr-' + p.id,
          title: (p.title || '').trim() || 'Flickr-foto',
          ownername: p.ownername || '', owner: p.owner,
          thumb: p.url_c || p.url_m || p.url_q || '',
          large: p.url_l || p.url_c || p.url_m || '',
          lat: p.latitude ? parseFloat(p.latitude) : null,
          lon: p.longitude ? parseFloat(p.longitude) : null,
          page: `https://www.flickr.com/photos/${p.owner}/${p.id}`,
          town: town.name,
          tags: (p.tags || '').split(' ').filter(Boolean).slice(0, 12),
          cat: cat.key, catLabel: cat.label
        })).filter(p => p.thumb);
      }
    } catch (e) {}
    return [];
  };

  let photos = [];
  try {
    const results = await Promise.all(FLICKR_CATEGORIES.map(fetchCat));
    const seen = new Set();
    for (const arr of results) for (const p of arr) {
      if (seen.has(p.id)) continue;   // dedup på tværs af kategorier
      seen.add(p.id); photos.push(p);
    }
  } catch (e) { return []; }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), photos })); } catch {}
  return photos;
}

// --- Lag 3: kategorisér et OSM-element ud fra dets tags ---
function osmCat(t) {
  if (t.man_made === 'lighthouse') return 'fyr';
  if (t.military === 'bunker' || t.historic === 'bunker') return 'bunker';
  if (t.amenity === 'place_of_worship' || ['church', 'cathedral', 'chapel'].includes(t.building)) return 'kirke';
  if (t.tourism === 'museum') return 'museum';
  if (t.historic === 'castle' || t.historic === 'fort') return 'slot';
  if (t.leisure === 'marina' || t.harbour) return 'havn';
  if (t.tourism === 'theme_park') return 'forlystelse';
  if (t.historic === 'memorial' || t.historic === 'monument') return 'mindesmaerke';
  if (t.tourism === 'attraction') return 'attraktion';
  return 'andet';
}

// --- Lag 3: hent navngivne landmarks fra OpenStreetMap (Overpass), 30 dages cache ---
async function fetchOsmLandmarks(town) {
  const cacheKey = `osm-lm-${town.name}-r${FLICKR_RADIUS_KM}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < OSM_CACHE_HOURS * 3600 * 1000) return cached.landmarks;
  } catch {}

  const r = FLICKR_RADIUS_KM * 1000, lat = town.lat, lon = town.lon;
  const filters = ['[man_made=lighthouse]', '[military=bunker]', '[historic=bunker]',
    '[amenity=place_of_worship]', '[tourism=museum]', '[historic~"castle|fort|memorial|monument"]',
    '[tourism=attraction]', '[tourism=theme_park]', '[leisure=marina]'];
  const q = `[out:json][timeout:25];(${filters.map(f => `nwr(around:${r},${lat},${lon})${f};`).join('')});out center tags;`;

  let landmarks = [];
  try {
    const res = await fetch(OSM_ENDPOINT + '?data=' + encodeURIComponent(q));
    const d = await res.json();
    const seen = new Set();
    for (const el of (d.elements || [])) {
      const t = el.tags || {};
      const name = t.name || t['name:da'] || t['name:en'];
      if (!name || seen.has(name)) continue;
      const la = el.lat != null ? el.lat : (el.center && el.center.lat);
      const lo = el.lon != null ? el.lon : (el.center && el.center.lon);
      if (la == null || lo == null) continue;
      seen.add(name);
      landmarks.push({ name, lat: la, lon: lo, cat: osmCat(t), notable: !!(t.wikidata || t.wikipedia) });
    }
  } catch (e) { return []; }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), landmarks })); } catch {}
  return landmarks;
}

// --- Lag 3+: søg Flickr direkte på de "notable" OSM-landmark-navne (specifik pulje) ---
// Fanger navngivne attraktioner der IKKE passer i en generisk kategori (fx Legoland inde i landet).
async function fetchFlickrByLandmarks(town, landmarks) {
  const notable = landmarks.filter(l => l.notable).slice(0, NAMED_MAX);
  if (!notable.length) return [];
  const cacheKey = `flickr-named-${town.name}-n${notable.length}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < FLICKR_CACHE_HOURS * 3600 * 1000) return cached.photos;
  } catch {}

  const fetchOne = async (lm) => {
    const params = new URLSearchParams({
      method: 'flickr.photos.search', api_key: FLICKR_KEY,
      lat: town.lat, lon: town.lon, radius: FLICKR_RADIUS_KM, radius_units: 'km',
      has_geo: 1, text: lm.name, sort: 'interestingness-desc', per_page: NAMED_PER,
      extras: 'owner_name,geo,url_q,url_m,url_c,url_l,tags',
      content_type: 1, media: 'photos', safe_search: 1, format: 'json', nojsoncallback: 1
    });
    try {
      const res = await fetch('https://api.flickr.com/services/rest/?' + params.toString());
      const d = await res.json();
      if (d.stat === 'ok' && d.photos && d.photos.photo) {
        const total = parseInt(d.photos.total) || 0;   // hvor mange geotaggede fotos findes for dette landmark (ikonisk-proxy)
        return d.photos.photo.map(p => ({
          id: 'flickr-' + p.id,
          title: (p.title || '').trim() || 'Flickr-foto',
          ownername: p.ownername || '', owner: p.owner,
          thumb: p.url_c || p.url_m || p.url_q || '',
          large: p.url_l || p.url_c || p.url_m || '',
          lat: p.latitude ? parseFloat(p.latitude) : null,
          lon: p.longitude ? parseFloat(p.longitude) : null,
          page: `https://www.flickr.com/photos/${p.owner}/${p.id}`,
          town: town.name,
          tags: (p.tags || '').split(' ').filter(Boolean).slice(0, 12),
          cat: lm.cat, catLabel: CAT_LABELS[lm.cat] || null, landmark: lm.name, pop: total
        })).filter(p => p.thumb);
      }
    } catch (e) {}
    return [];
  };

  let photos = [];
  try {
    const results = await Promise.all(notable.map(fetchOne));
    const seen = new Set();
    for (const arr of results) for (const p of arr) {
      if (seen.has(p.id)) continue;   // dedup på tværs af landmark-søgninger
      seen.add(p.id); photos.push(p);
    }
  } catch (e) { return []; }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), photos })); } catch {}
  return photos;
}

// --- Lag 3: knyt nærmeste navngivne landmark til hvert foto (inden for OSM_SNAP_M) ---
function snapToLandmarks(photos, landmarks) {
  if (!landmarks.length) return photos;
  const maxKm = OSM_SNAP_M / 1000;
  for (const p of photos) {
    if (p.landmark) continue;              // allerede navngivet via navne-søgning — overskriv ikke
    if (p.lat == null || p.lon == null) continue;
    let best = null, bestD = maxKm;
    for (const lm of landmarks) {
      const d = haversine(p.lat, p.lon, lm.lat, lm.lon);
      if (d < bestD) { bestD = d; best = lm; }
    }
    if (best) {
      p.landmark = best.name;
      p.cat = best.cat;                 // OSM-kategorien er mere præcis end tekst-søgningens
      p.catLabel = CAT_LABELS[best.cat] || p.catLabel;
    }
  }
  return photos;
}

// --- Indlæs Flickr for nuværende position ---
async function loadFlickr() {
  state.flickr = [];
  if (!state.flickrEnabled || state.lat === null) return;
  const near = findNearestTown(state.lat, state.lon);
  if (!near) return;  // ikke i nærheden af en vestkyst-by
  const statusEl = document.getElementById('status');
  if (statusEl) statusEl.innerHTML += ` &middot; <span style="color:#ff7fb0">henter Flickr…</span>`;
  if (state.flickrLandmarkMode) {
    const landmarks = await fetchOsmLandmarks(near.town);
    const [generic, named] = await Promise.all([
      fetchFlickrLandmarks(near.town),
      fetchFlickrByLandmarks(near.town, landmarks)
    ]);
    const seen = new Set();
    const merged = [];
    for (const p of named.concat(generic)) {   // navne-søgte (specifikke) først → vinder ved dubletter
      if (seen.has(p.id)) continue;
      seen.add(p.id); merged.push(p);
    }
    state.flickr = snapToLandmarks(merged, landmarks);
  } else {
    state.flickr = await fetchFlickrPhotos(near.town);
  }
}

// --- Smags-profil (huskes i localStorage) ---
function saveTaste() {
  localStorage.setItem('fotoscout-taste', JSON.stringify(state.taste));
  localStorage.setItem('fotoscout-liked', JSON.stringify([...state.liked]));
}
function tasteScore(meta) {
  let s = 0;
  if (meta.owner && state.taste.owners[meta.owner]) s += state.taste.owners[meta.owner];
  for (const t of (meta.tags || [])) if (state.taste.tags[t]) s += state.taste.tags[t];
  return s;
}
function applyTaste(meta, ownerDelta, tagDelta) {
  if (!meta) return;
  if (meta.owner && ownerDelta) {
    state.taste.owners[meta.owner] = (state.taste.owners[meta.owner] || 0) + ownerDelta;
    if (state.taste.owners[meta.owner] === 0) delete state.taste.owners[meta.owner];
  }
  if (tagDelta) for (const t of (meta.tags || [])) {
    state.taste.tags[t] = (state.taste.tags[t] || 0) + tagDelta;
    if (state.taste.tags[t] === 0) delete state.taste.tags[t];
  }
}
function hasTaste() {
  return Object.keys(state.taste.owners).length > 0 || Object.keys(state.taste.tags).length > 0;
}
function flickrToItem(f) {
  let dist = null;
  if (state.lat !== null && f.lat && f.lon) dist = haversine(state.lat, state.lon, f.lat, f.lon);
  return {
    type: 'flickr', id: f.id, name: f.title, subtitle: f.town,
    notes: f.ownername ? 'Foto: ' + f.ownername : '',
    photo: f.thumb, photos: [f.large || f.thumb],
    tags: [], flickrTags: f.tags || [], owner: f.owner, ownername: f.ownername,
    cat: f.cat || null, catLabel: f.catLabel || null, landmark: f.landmark || null, pop: f.pop || 0,
    lat: f.lat, lon: f.lon, dist,
    navTarget: f.landmark ? `${f.landmark}, ${f.town}`
      : ((f.lat && f.lon) ? `${f.lat},${f.lon}` : f.town + ', Danmark'),
    flickrPage: f.page,
    _taste: tasteScore({ owner: f.owner, tags: f.tags || [] }) + (f.landmark ? OSM_LANDMARK_BOOST : 0)
  };
}
function getItemById(id) {
  const it = state.items.find(i => i.id === id);
  if (it) return it;
  const f = state.flickr.find(p => p.id === id);
  return f ? flickrToItem(f) : null;
}
function metaOf(id) {
  const it = getItemById(id);
  return it ? { owner: it.owner, tags: it.flickrTags || it.tags || [] } : null;
}

// --- Build items list ---
function buildItems() {
  const items = [];
  const locations = state.data.locations || [];
  const inspirations = state.data.inspirations || [];

  for (const loc of locations) {
    let dist = null;
    if (state.lat !== null && loc.lat && loc.lon) {
      dist = haversine(state.lat, state.lon, loc.lat, loc.lon);
    }
    items.push({
      type: 'location',
      id: loc.id,
      name: loc.name,
      subtitle: loc.address,
      notes: loc.notes,
      photos: loc.photos || [],
      photo: (loc.photos && loc.photos.length > 0) ? loc.photos[0] : '',
      tags: loc.tags || [],
      lat: loc.lat,
      lon: loc.lon,
      dist,
      navTarget: loc.address
    });
  }

  for (const insp of inspirations) {
    let dist = null;
    if (state.lat !== null && insp.lat && insp.lon) {
      dist = haversine(state.lat, state.lon, insp.lat, insp.lon);
    }
    items.push({
      type: 'inspiration',
      id: insp.id,
      name: insp.title,
      subtitle: insp.area,
      notes: insp.notes,
      photo: insp.photo || '',
      photos: insp.photo ? [insp.photo] : [],
      tags: insp.tags || [],
      lat: insp.lat,
      lon: insp.lon,
      dist,
      navTarget: (insp.lat && insp.lon) ? `${insp.lat},${insp.lon}` : insp.area + ', Danmark'
    });
  }

  // Flickr: byg kandidater, udeluk fravalgte fotografer, vælg de bedste efter smags-profil
  let flickrCands = state.flickr
    .map(flickrToItem)
    .filter(it => (state.taste.owners[it.owner] || 0) > -OWNER_AUTOHIDE)
    .filter(it => !state.hidden.has(it.id));   // skjulte fjernes FOER udvaelgelsen -> naeste fra puljen rykker ind
  flickrCands.sort((a, b) => b._taste - a._taste);
  for (const it of flickrCands.slice(0, FLICKR_COUNT)) items.push(it);

  // Sort: items with distance first (by distance), then items without
  items.sort((a, b) => {
    if (a.dist !== null && b.dist !== null) return a.dist - b.dist;
    if (a.dist !== null) return -1;
    if (b.dist !== null) return 1;
    return 0;
  });

  state.items = items;
}

// --- Skjul / synes om / gendan (huskes i localStorage) ---
function saveHidden() {
  localStorage.setItem('fotoscout-hidden', JSON.stringify([...state.hidden]));
}
function hideItem(id, reason) {
  reason = HIDE_REASONS[reason] ? reason : 'thisonly';
  const meta = metaOf(id);
  if (state.liked.has(id)) { state.liked.delete(id); applyTaste(meta, -LIKE_OWNER, -LIKE_TAG); }  // fjern tidligere like
  if (!state.hidden.has(id)) {
    state.hidden.set(id, reason);
    const r = HIDE_REASONS[reason];
    applyTaste(meta, r.owner, r.tag);            // negativt signal afhængig af begrundelse
  }
  saveHidden(); saveTaste(); closeDetail(); render();
}
function unhideItem(id) {
  if (state.hidden.has(id)) {
    const r = HIDE_REASONS[state.hidden.get(id)] || HIDE_REASONS.thisonly;
    applyTaste(metaOf(id), -r.owner, -r.tag);    // ophæv præcis det der blev trukket fra
    state.hidden.delete(id);
  }
  saveHidden(); saveTaste();
  if (state.filter === 'hidden' && getFilteredItems().length === 0) state.filter = 'all';
  render();
  if (state.openDetailId === id) openDetail(id);
}
function likeItem(id) {
  const meta = metaOf(id);
  if (state.liked.has(id)) {
    state.liked.delete(id); applyTaste(meta, -LIKE_OWNER, -LIKE_TAG);   // slå like fra
  } else {
    if (state.hidden.has(id)) {                                          // ophæv et evt. skjul først
      const r = HIDE_REASONS[state.hidden.get(id)] || HIDE_REASONS.thisonly;
      applyTaste(meta, -r.owner, -r.tag);
      state.hidden.delete(id);
    }
    state.liked.add(id); applyTaste(meta, LIKE_OWNER, LIKE_TAG);         // positivt signal (vægter mere)
  }
  saveHidden(); saveTaste();
  if (state.filter === 'liked' && state.liked.size === 0) state.filter = 'all';
  render();
  if (state.openDetailId === id) openDetail(id);
}
// --- Begrundelses-ark ved skjul (kun Flickr; egne spots skjules direkte) ---
let pendingHideId = null;
function askHide(id) {
  const it = getItemById(id);
  if (!it || it.type !== 'flickr') { hideItem(id, 'thisonly'); return; }
  pendingHideId = id;
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
  pendingHideId = null;
}
function confirmHide(reason) {
  const id = pendingHideId;
  closeSheet();
  if (id) hideItem(id, reason);
}

// --- Filter ---
function specialViewItems(predicate) {
  const out = [], seen = new Set();
  for (const it of state.items) if (predicate(it.id)) { out.push(it); seen.add(it.id); }
  for (const f of state.flickr) if (!seen.has(f.id) && predicate(f.id)) out.push(flickrToItem(f));
  return out;
}
function getFilteredItems() {
  if (state.filter === 'hidden') return specialViewItems(id => state.hidden.has(id));
  if (state.filter === 'liked')  return specialViewItems(id => state.liked.has(id));
  if (state.filter.startsWith('lm:')) {                 // alle billeder for ét landmark (ikke begrænset af FLICKR_COUNT)
    const name = state.filter.slice(3);
    return state.flickr.map(flickrToItem)
      .filter(it => it.landmark === name && !state.hidden.has(it.id))
      .sort((a, b) => b._taste - a._taste);
  }
  let list;
  if (state.filter === 'all') list = state.items;
  else if (state.filter === 'locations') list = state.items.filter(i => i.type === 'location');
  else if (state.filter === 'inspirations') list = state.items.filter(i => i.type === 'inspiration');
  else if (state.filter === 'flickr') list = state.items.filter(i => i.type === 'flickr');
  else list = state.items.filter(i => i.tags.includes(state.filter));  // tag-filter
  return list.filter(i => !state.hidden.has(i.id));
}

// --- Fase 1: gruppér Flickr-billeder pr. navngivet landmark og rangordn efter "fotogen-score" ---
function buildLandmarkGroups() {
  const cands = state.flickr
    .map(flickrToItem)
    .filter(it => (state.taste.owners[it.owner] || 0) > -OWNER_AUTOHIDE)
    .filter(it => !state.hidden.has(it.id))
    .filter(it => it.landmark);            // kun navngivne landmarks hører til i overblikket
  const map = new Map();
  for (const it of cands) {
    let g = map.get(it.landmark);
    if (!g) { g = { name: it.landmark, cat: it.cat, catLabel: it.catLabel, town: it.subtitle, photos: [], pop: 0, dist: null }; map.set(it.landmark, g); }
    g.photos.push(it);
    if (it.pop) g.pop = Math.max(g.pop, it.pop);
    if (it.dist != null) g.dist = (g.dist == null) ? it.dist : Math.min(g.dist, it.dist);
  }
  const groups = [...map.values()];
  for (const g of groups) {
    g.photos.sort((a, b) => b._taste - a._taste);
    g.notable = g.pop > 0;                 // navne-søgte (wikidata-landmarks) har en rigtig foto-total
    g.score = g.notable ? g.pop : g.photos.length;
  }
  // notable først (ikoniske), så efter popularitet, så efter nærhed
  groups.sort((a, b) => {
    if (a.notable !== b.notable) return a.notable ? -1 : 1;
    if (b.score !== a.score) return b.score - a.score;
    return (a.dist == null ? 1e9 : a.dist) - (b.dist == null ? 1e9 : b.dist);
  });
  return groups;
}

function renderOverview(content, statusEl, groups) {
  state._groups = groups;
  const tasteTag = hasTaste() ? ` &middot; <span style="color:#ff7fb0">✨ tilpasset til dig</span>` : '';
  statusEl.innerHTML = `<span class="count">${groups.length}</span> landmarks i nærheden${tasteTag}`;
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = '🧭 Overblik';

  content.innerHTML = '<div class="overview">' + groups.map((g, gi) => {
    const thumbs = g.photos.slice(0, 6).map(p =>
      `<img src="${p.photo}" loading="lazy" alt="${esc(g.name)}" onclick="openDetail('${p.id}')">`).join('');
    const dist = g.dist != null ? formatDist(g.dist) : '';
    const popTxt = g.notable ? `${g.pop.toLocaleString('da-DK')} fotos` : `${g.photos.length} fotos`;
    const meta = [esc(g.catLabel || '📍 Landmark'), popTxt, dist].filter(Boolean).join(' · ');
    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(g.name + ', ' + (g.town || 'Danmark'))}`;
    const imgUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(g.name + ' ' + (g.town || ''))}`;
    return `
      <div class="lm-card">
        <div class="lm-head">
          <span class="lm-rank">${gi + 1}</span>
          <div class="lm-titles">
            <div class="lm-name">${esc(g.name)}</div>
            <div class="lm-meta">${meta}</div>
          </div>
        </div>
        <div class="lm-strip">${thumbs}</div>
        <div class="lm-actions">
          <button class="lm-btn" onclick="showLandmarkIdx(${gi})">Se alle ${g.photos.length}</button>
          <a class="lm-btn" href="${imgUrl}" target="fsimg" rel="noopener">🔍 Google</a>
          <a class="lm-btn nav" href="${navUrl}" target="_blank" rel="noopener">📍 Navigér</a>
        </div>
      </div>`;
  }).join('') + '</div>';
}

function showLandmarkIdx(i) {
  const g = (state._groups || [])[i];
  if (!g) return;
  state.view = 'feed';
  state.filter = 'lm:' + g.name;
  document.getElementById('filtersPanel').classList.remove('open');
  render();
}

function backToOverview() {
  state.view = 'overblik';
  state.filter = 'all';
  render();
}

// --- Vælg by fra listen (scout hjemmefra), eller tilbage til GPS ---
async function selectTown(name) {
  const locEl = document.getElementById('locationName');
  const statusEl = document.getElementById('status');
  if (!name) {                                   // tilbage til "Min position"
    state.manualTown = null;
    if (state.gpsLat != null) {
      state.lat = state.gpsLat; state.lon = state.gpsLon;
      if (locEl) locEl.textContent = state.gpsName || 'Min position';
    } else {
      try {                                       // ingen gemt GPS endnu -> prøv at finde den
        const pos = await getPosition();
        state.lat = pos.lat; state.lon = pos.lon;
        state.gpsLat = pos.lat; state.gpsLon = pos.lon;
        state.gpsName = await reverseGeocode(pos.lat, pos.lon);
        if (locEl) locEl.textContent = state.gpsName;
      } catch { if (locEl) locEl.textContent = 'Ingen GPS'; state.lat = null; }
    }
  } else {                                        // valgt by fra listen
    const t = state.towns.find(x => x.name === name);
    if (!t) return;
    state.manualTown = name;
    state.lat = t.lat; state.lon = t.lon;
    if (locEl) locEl.textContent = name + ' · valgt 🔭';
  }
  document.getElementById('filtersPanel').classList.remove('open');
  state.view = 'overblik'; state.filter = 'all';
  if (statusEl) statusEl.innerHTML = `<span style="color:#ff7fb0">henter…</span>`;
  await loadFlickr();
  buildItems();
  render();
}

// --- Render ---
// ============================================================
// Sol & Måne-planlægger (Lag: astronomi)
// Beregner sol/måne-position (azimut + højde) offline via SunCalc-
// algoritmen (V. Agafonkin, MIT). Finder hvornår sol/måne står bag
// et objekt set fra fotografen, og foreslår standpunkter + brændvidde.
// ============================================================
const SOL = {
  D2R: Math.PI / 180,
  R2D: 180 / Math.PI,
  E: 23.4397 * Math.PI / 180,           // jordaksens hældning
  SENSOR_W: 17.3, SENSOR_H: 13.0,       // M4/3-sensor (mm)
  LENS_MIN: 150, LENS_MAX: 400,         // din 150-400 mm

  cfg: {
    objIdx: 1,          // default: Blåvandshuk (populær til solnedgang)
    lat: null, lon: null, height: 30, name: '',
    date: null,         // 'YYYY-MM-DD'
    body: 'sun',        // 'sun' | 'moon'
    side: 'set',        // 'set' (nedgang) | 'rise' (opgang)
    anchor: 'top',      // 'base' | 'mid' | 'top' — hvor forskydningens nulpunkt sidder
    fill: 0.60,         // objektets andel af billedhøjden
    offX: 0, offY: 0,   // forskydning i andel af billedet (−0.4..0.4); + = højre / op
  },
  BASE_MARGIN: 0.05,    // objektets fod sidder 5 % oppe fra billedets bund
  DISTS: [200, 400, 700, 1000, 1500, 2500, 4000],

  // --- kerneastronomi ---
  _days(date) { return date.valueOf() / 86400000 - 0.5 + 2440588 - 2451545; },
  _ra(l, b) { return Math.atan2(Math.sin(l) * Math.cos(this.E) - Math.tan(b) * Math.sin(this.E), Math.cos(l)); },
  _dec(l, b) { return Math.asin(Math.sin(b) * Math.cos(this.E) + Math.cos(b) * Math.sin(this.E) * Math.sin(l)); },
  _sidereal(d, lw) { return this.D2R * (280.16 + 360.9856235 * d) - lw; },
  _az(H, phi, dec) { return Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)); },
  _alt(H, phi, dec) { return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)); },
  _refract(h) { if (h < 0) h = 0; return 0.0002967 / Math.tan(h + 0.00312536 / (h + 0.08901179)); },

  _sunCoords(d) {
    const M = this.D2R * (357.5291 + 0.98560028 * d);
    const C = this.D2R * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const L = M + C + this.D2R * 102.9372 + Math.PI;
    return { dec: this._dec(L, 0), ra: this._ra(L, 0) };
  },
  _moonCoords(d) {
    const L = this.D2R * (218.316 + 13.176396 * d),
          M = this.D2R * (134.963 + 13.064993 * d),
          F = this.D2R * (93.272 + 13.229350 * d),
          l = L + this.D2R * 6.289 * Math.sin(M),
          b = this.D2R * 5.128 * Math.sin(F),
          dt = 385001 - 20905 * Math.cos(M);        // afstand (km)
    return { ra: this._ra(l, b), dec: this._dec(l, b), dist: dt };
  },

  // Returnér {az, alt} i grader (az: kompas, 0=N, 90=Ø, 180=S, 270=V) + evt. vinkeldiameter
  position(date, lat, lon, body) {
    const lw = this.D2R * -lon, phi = this.D2R * lat, d = this._days(date);
    const c = body === 'moon' ? this._moonCoords(d) : this._sunCoords(d);
    const H = this._sidereal(d, lw) - c.ra;
    let alt = this._alt(H, phi, c.dec);
    alt += this._refract(alt);
    let az = this._az(H, phi, c.dec) + Math.PI;      // fra syd → kompas fra nord
    az = ((az * this.R2D) % 360 + 360) % 360;
    const out = { az, alt: alt * this.R2D };
    out.diam = body === 'moon' ? 2 * Math.atan(1737.4 / c.dist) * this.R2D : 0.533;
    return out;
  },

  moonIllum(date) {
    const d = this._days(date), s = this._sunCoords(d), m = this._moonCoords(d), sd = 149598000;
    const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
    const inc = Math.atan2(sd * Math.sin(phi), m.dist - sd * Math.cos(phi));
    const angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra),
      Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
    return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI };
  },
  phaseLabel(ph) {
    const p = ((ph % 1) + 1) % 1;
    const t = [[0.02, '🌑', 'Nymåne'], [0.24, '🌒', 'Tiltagende måne'], [0.26, '🌓', 'Første kvarter'],
      [0.49, '🌔', 'Tiltagende (gibbous)'], [0.51, '🌕', 'Fuldmåne'], [0.74, '🌖', 'Aftagende (gibbous)'],
      [0.76, '🌗', 'Sidste kvarter'], [0.99, '🌘', 'Aftagende måne'], [1.01, '🌑', 'Nymåne']];
    for (const [lim, emo, name] of t) if (p <= lim) return { emoji: emo, name };
    return { emoji: '🌑', name: 'Nymåne' };
  },

  // Projicér et punkt: fra (lat,lon) i retning brng° over distance d (m) → nyt punkt
  dest(lat, lon, brng, d) {
    const R = 6371000, a = brng * this.D2R, p1 = lat * this.D2R, l1 = lon * this.D2R, dr = d / R;
    const p2 = Math.asin(Math.sin(p1) * Math.cos(dr) + Math.cos(p1) * Math.sin(dr) * Math.cos(a));
    const l2 = l1 + Math.atan2(Math.sin(a) * Math.sin(dr) * Math.cos(p1), Math.cos(dr) - Math.sin(p1) * Math.sin(p2));
    return { lat: p2 * this.R2D, lon: l2 * this.R2D };
  },
  compassName(deg) {
    return ['N', 'NØ', 'Ø', 'SØ', 'S', 'SV', 'V', 'NV'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];
  },

  // Scan et lokalt døgn og find op-/nedgang + kulmination for body
  dayEvents(dateStr, lat, lon, body) {
    const [y, mo, da] = dateStr.split('-').map(Number);
    const thr = body === 'moon' ? 0.125 : -0.833;       // horisont-tærskel (grader)
    let prev = null, events = [], peak = { alt: -99, t: null, az: 0 };
    for (let min = 0; min <= 1440; min++) {
      const t = new Date(y, mo - 1, da, 0, min, 0);
      const p = this.position(t, lat, lon, body);
      if (p.alt > peak.alt) peak = { alt: p.alt, t, az: p.az };
      if (prev) {
        if (prev.alt < thr && p.alt >= thr) events.push({ type: 'rise', t, az: p.az, alt: p.alt });
        if (prev.alt >= thr && p.alt < thr) events.push({ type: 'set', t: prev.t, az: prev.az, alt: prev.alt });
      }
      prev = { alt: p.alt, t, az: p.az };
    }
    return { events, peak };
  },

  // Højde+azimut for hele døgnet (1-min opløsning) — genbruges på tværs af afstande
  daySeries(dateStr, lat, lon, body) {
    const [y, mo, da] = dateStr.split('-').map(Number);
    const s = [];
    for (let m = 0; m <= 1440; m++) {
      const t = new Date(y, mo - 1, da, 0, m, 0);
      const p = this.position(t, lat, lon, body);
      s.push({ t, alt: p.alt, az: p.az });
    }
    return s;
  },
  // Find tidspunkt hvor højden krydser target-højden på ønsket side
  // ('rise' = på vej op, 'set' = på vej ned). Falder tilbage til modsat side.
  findCrossing(series, target, side) {
    let fallback = null;
    for (let i = 1; i < series.length; i++) {
      const a = series[i - 1].alt, b = series[i].alt;
      const up = a < target && b >= target, down = a >= target && b < target;
      if (!up && !down) continue;
      const f = (target - a) / (b - a);
      const hit = {
        t: new Date(series[i - 1].t.getTime() + f * (series[i].t - series[i - 1].t)),
        az: series[i].az, side: up ? 'rise' : 'set',
      };
      if ((side === 'rise' && up) || (side === 'set' && down)) return hit;
      if (!fallback) fallback = hit;
    }
    return fallback;
  },

  // Beregn ét standpunkt for en given afstand + ønsket komposition
  plan(obj, series, D, c) {
    const objAngV = 2 * Math.atan(obj.height / (2 * D)) * this.R2D;   // objektets vinkelhøjde (grader)
    const fovV = objAngV / c.fill;                                     // lodret synsfelt for ønsket objektstørrelse
    const focal = this.SENSOR_H / (2 * Math.tan(fovV / 2 * this.D2R)); // nødvendig brændvidde (mm)
    const fovH = 2 * Math.atan(this.SENSOR_W / (2 * focal)) * this.R2D;
    const inRange = focal >= this.LENS_MIN && focal <= this.LENS_MAX;
    // ankerpunktets placering i billedet (andel fra bunden) + forskydning
    const anchorFY = c.anchor === 'base' ? this.BASE_MARGIN
      : c.anchor === 'mid' ? this.BASE_MARGIN + c.fill / 2
      : this.BASE_MARGIN + c.fill;
    const bodyFY = anchorFY + c.offY, bodyFX = 0.5 + c.offX;
    const targetAlt = fovV * (bodyFY - this.BASE_MARGIN);              // objektets fod = 0° (havhorisont)
    const r = { D, focal, inRange, objAngV, fovV, note: '', ok: false };
    if (targetAlt < -0.2) { r.note = 'under horisont'; return r; }
    const cross = this.findCrossing(series, targetAlt, c.side);
    if (!cross) { r.note = 'når ikke højden'; return r; }
    const p = this.position(cross.t, obj.lat, obj.lon, c.body);
    const dAz = (c.offX * fovH) / Math.max(0.3, Math.cos(targetAlt * this.D2R));
    const aObj = ((cross.az - dAz) % 360 + 360) % 360;                // objektets retning fra fotograf
    r.back = (aObj + 180) % 360;                                      // fotografens retning fra objekt
    r.gp = this.dest(obj.lat, obj.lon, r.back, D);
    r.time = cross.t;
    r.bodyVsObj = p.diam / objAngV;
    r.bodyFrame = p.diam / fovV;
    const rY = p.diam / fovV / 2, rX = p.diam / fovH / 2;
    r.fits = bodyFY - rY >= 0 && bodyFY + rY <= 1 && bodyFX - rX >= 0 && bodyFX + rX <= 1;
    if (cross.side !== c.side) r.note = cross.side === 'rise' ? 'kun v. opgang' : 'kun v. nedgang';
    if (!r.fits) r.note = r.note ? r.note + ' · uden for ramme' : 'uden for ramme';
    r.ok = inRange && r.fits;
    return r;
  },
};

// Visuelt preview: 4:3-ramme (sensor-proportion) med horisont, objekt-silhuet
// og sol/måne-prik i korrekt position + relativ størrelse for ét standpunkt.
function solPreview(c, plan) {
  const W = 400, H = 300, m = SOL.BASE_MARGIN, fill = c.fill;
  const anchorFY = c.anchor === 'base' ? m : c.anchor === 'mid' ? m + fill / 2 : m + fill;
  const bodyFY = anchorFY + c.offY, bodyFX = 0.5 + c.offX;
  const bx = bodyFX * W, by = (1 - bodyFY) * H;
  const br = Math.max(2, plan.bodyFrame / 2 * H);        // px/grad er ens i begge akser (4:3-ramme) → rund
  const horizonY = (1 - m) * H, topY = (1 - (m + fill)) * H;
  const cx = W / 2, baseHalf = 15, topHalf = 8;
  const isMoon = c.body === 'moon';
  const gid = 'solsky' + (isMoon ? 'm' : 's');
  // fyr-silhuet: tårn (trapez) + lanterne-hoved
  const tower = `${cx - baseHalf},${horizonY} ${cx - topHalf},${topY + 10} ${cx + topHalf},${topY + 10} ${cx + baseHalf},${horizonY}`;
  const lantern = `<rect x="${cx - topHalf - 2}" y="${topY + 3}" width="${(topHalf + 2) * 2}" height="8" fill="#0c1118"/>
    <rect x="${cx - topHalf + 2}" y="${topY - 3}" width="${(topHalf - 2) * 2}" height="7" fill="#0c1118"/>`;
  const sky = isMoon
    ? `<stop offset="0" stop-color="#16223b"/><stop offset="1" stop-color="#2c3e63"/>`
    : `<stop offset="0" stop-color="#2a3a5e"/><stop offset="0.6" stop-color="#e8894a"/><stop offset="1" stop-color="#ffd089"/>`;
  const bodyFill = isMoon ? '#eef2fb' : '#fff2c4';
  const bodyGlow = isMoon ? 'rgba(200,215,255,0.35)' : 'rgba(255,200,110,0.55)';
  // Sol: fyldt skive. Måne: mørk skive + oplyst del tegnet efter fase (terminator-ellipse).
  let bodyShape;
  if (!isMoon) {
    bodyShape = `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}" fill="${bodyFill}"/>`;
  } else {
    const il = SOL.moonIllum(plan.time);
    const f = Math.max(0, Math.min(1, il.fraction));
    const waxing = ((il.phase % 1) + 1) % 1 < 0.5;       // tiltagende = oplyst på højre side (nordlig halvkugle)
    const rx = (br * Math.abs(1 - 2 * f)).toFixed(1);
    const top = `${bx.toFixed(1)},${(by - br).toFixed(1)}`, bot = `${bx.toFixed(1)},${(by + br).toFixed(1)}`;
    const limbSweep = waxing ? 1 : 0;                    // oplyst limbus: højre (tiltagende) / venstre (aftagende)
    const termSweep = waxing ? (f > 0.5 ? 1 : 0) : (f > 0.5 ? 0 : 1);
    const lit = `<path d="M ${top} A ${br.toFixed(1)} ${br.toFixed(1)} 0 0 ${limbSweep} ${bot} A ${rx} ${br.toFixed(1)} 0 0 ${termSweep} ${top} Z" fill="${bodyFill}"/>`;
    bodyShape = `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}" fill="#1c2740"/>${lit}`;
  }
  return `<svg class="sol-preview" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Forhåndsvisning af komposition">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">${sky}</linearGradient></defs>
    <rect x="0" y="0" width="${W}" height="${horizonY}" fill="url(#${gid})"/>
    <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${(br + 6).toFixed(1)}" fill="${bodyGlow}"/>
    ${bodyShape}
    <rect x="0" y="${horizonY}" width="${W}" height="${H - horizonY}" fill="${isMoon ? '#0a1220' : '#243247'}"/>
    <line x1="0" y1="${horizonY}" x2="${W}" y2="${horizonY}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <polygon points="${tower}" fill="#0c1118"/>${lantern}
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" fill="none" stroke="var(--border)" stroke-width="2" rx="6"/>
  </svg>`;
}

function renderSol(content, statusEl) {
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = 'Sol & Måne';
  const c = SOL.cfg;

  // Objektkatalog: alle fyr fra ruterne (dedup på navn) + "Andet objekt"
  const stops = [];
  const seen = new Set();
  for (const r of ROUTES) for (const s of (r.stops || [])) {
    if (seen.has(s.name)) continue; seen.add(s.name);
    stops.push({ name: s.name, lat: s.lat, lon: s.lon });
  }
  if (c.date == null) { const n = new Date(); c.date = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; }

  // Afled objekt-position
  let obj;
  if (c.objIdx === 'custom') {
    obj = { name: c.name || 'Eget objekt', lat: c.lat, lon: c.lon, height: +c.height || 30 };
  } else {
    const s = stops[c.objIdx] || stops[0];
    obj = { name: s.name, lat: s.lat, lon: s.lon, height: +c.height || 30 };
  }

  const objOpts = stops.map((s, i) => `<option value="${i}" ${c.objIdx === i ? 'selected' : ''}>${esc(s.name)}</option>`).join('')
    + `<option value="custom" ${c.objIdx === 'custom' ? 'selected' : ''}>➕ Andet objekt…</option>`;

  const customFields = c.objIdx === 'custom' ? `
    <div class="sol-row">
      <label>Objekt-navn<input type="text" id="sol-name" value="${esc(c.name || '')}" onchange="SOL.on('name',this.value)" placeholder="fx Rubjerg Knude"></label>
    </div>
    <div class="sol-row two">
      <label>Bredde (lat)<input type="text" inputmode="decimal" id="sol-lat" value="${c.lat ?? ''}" onchange="SOL.on('lat',this.value)" placeholder="56.xxxxx (komma el. punktum)"></label>
      <label>Længde (lon)<input type="text" inputmode="decimal" id="sol-lon" value="${c.lon ?? ''}" onchange="SOL.on('lon',this.value)" placeholder="8.xxxxx (komma el. punktum)"></label>
    </div>` : '';

  const anchorName = { base: 'foden', mid: 'midten', top: 'toppen' }[c.anchor];
  const ohX = c.offX / c.fill, ohY = c.offY / c.fill;   // forskydning i objekt-højder
  const readX = c.offX === 0 ? 'centreret' : `${ohX > 0 ? '+' : ''}${ohX.toFixed(2)} obj.-højder mod ${c.offX > 0 ? 'højre' : 'venstre'}`;
  const readY = c.offY === 0 ? `ved ${anchorName}` : `${ohY > 0 ? '+' : ''}${ohY.toFixed(2)} obj.-højder ${c.offY > 0 ? 'over' : 'under'} ${anchorName}`;

  let inputsHtml = `
    <div class="sol-card">
      <div class="sol-row"><label>Objekt
        <select id="sol-obj" onchange="SOL.on('objIdx',this.value)">${objOpts}</select></label></div>
      ${customFields}
      <div class="sol-row two">
        <label>Objektets højde (m)<input type="number" step="1" min="1" id="sol-h" value="${c.height}" onchange="SOL.on('height',this.value)"></label>
        <label>Dato<input type="date" id="sol-date" value="${c.date}" onchange="SOL.on('date',this.value)"></label>
      </div>
      <div class="sol-row two">
        <div class="sol-toggle">
          <button class="${c.body === 'sun' ? 'on' : ''}" onclick="SOL.on('body','sun')">☀️ Sol</button>
          <button class="${c.body === 'moon' ? 'on' : ''}" onclick="SOL.on('body','moon')">🌙 Måne</button>
        </div>
        <div class="sol-toggle">
          <button class="${c.side === 'rise' ? 'on' : ''}" onclick="SOL.on('side','rise')">↗ Opgang</button>
          <button class="${c.side === 'set' ? 'on' : ''}" onclick="SOL.on('side','set')">↘ Nedgang</button>
        </div>
      </div>
      <div class="sol-row">
        <label>Objektets størrelse i billedet: <b>${Math.round(c.fill * 100)}%</b> <span class="sol-dim">af højden</span>
          <input type="range" min="25" max="85" step="5" value="${Math.round(c.fill * 100)}" oninput="SOL.on('fill',this.value)"></label>
      </div>
      <div class="sol-row">
        <label>Forskydningens nulpunkt
          <div class="sol-toggle">
            <button class="${c.anchor === 'base' ? 'on' : ''}" onclick="SOL.on('anchor','base')">Fod</button>
            <button class="${c.anchor === 'mid' ? 'on' : ''}" onclick="SOL.on('anchor','mid')">Midte</button>
            <button class="${c.anchor === 'top' ? 'on' : ''}" onclick="SOL.on('anchor','top')">Top</button>
          </div>
        </label>
      </div>
      <div class="sol-row">
        <label>↔ Vandret forskydning: <b>${c.offX > 0 ? '+' : ''}${Math.round(c.offX * 100)}%</b> <span class="sol-dim">(${readX})</span>
          <input type="range" min="-40" max="40" step="5" value="${Math.round(c.offX * 100)}" oninput="SOL.on('offX',this.value)"></label>
      </div>
      <div class="sol-row">
        <label>↕ Lodret forskydning: <b>${c.offY > 0 ? '+' : ''}${Math.round(c.offY * 100)}%</b> <span class="sol-dim">(${readY})</span>
          <input type="range" min="-40" max="40" step="5" value="${Math.round(c.offY * 100)}" oninput="SOL.on('offY',this.value)"></label>
      </div>
    </div>`;

  // Validér position
  if (obj.lat == null || obj.lon == null || isNaN(obj.lat) || isNaN(obj.lon)) {
    statusEl.innerHTML = 'Sol & Måne';
    content.innerHTML = `<div class="sol-wrap">${inputsHtml}
      <div class="sol-note">Indtast objektets koordinater for at beregne.</div></div>`;
    return;
  }

  // Beregn
  const { events, peak } = SOL.dayEvents(c.date, obj.lat, obj.lon, c.body);
  const fmt = t => `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
  const bodyLabel = c.body === 'moon' ? 'Månen' : 'Solen';

  let moonHtml = '';
  if (c.body === 'moon') {
    const noon = new Date(...c.date.split('-').map((v, i) => i === 1 ? v - 1 : +v), 12, 0);
    const il = SOL.moonIllum(noon), ph = SOL.phaseLabel(il.phase);
    moonHtml = `<div class="sol-phase">${ph.emoji} <b>${ph.name}</b> · ${Math.round(il.fraction * 100)}% belyst</div>`;
  }

  // Op-/nedgang + kulmination
  const evName = { rise: c.body === 'moon' ? 'Måneopgang' : 'Solopgang', set: c.body === 'moon' ? 'Månenedgang' : 'Solnedgang' };
  let evHtml = events.length
    ? events.map(e => `<tr><td>${evName[e.type]}</td><td>${fmt(e.t)}</td><td>${Math.round(e.az)}° ${SOL.compassName(e.az)}</td><td>${e.alt.toFixed(1)}°</td></tr>`).join('')
    : `<tr><td colspan="4">${bodyLabel} står ikke op/ned dette døgn.</td></tr>`;
  if (peak.t) evHtml += `<tr><td>Kulmination</td><td>${fmt(peak.t)}</td><td>${Math.round(peak.az)}° ${SOL.compassName(peak.az)}</td><td>${peak.alt.toFixed(1)}°</td></tr>`;

  // Alignment: ét standpunkt pr. afstand, der giver den ønskede komposition
  const dispD = D => D >= 1000 ? (D / 1000).toFixed(1) + ' km' : D + ' m';
  const series = SOL.daySeries(c.date, obj.lat, obj.lon, c.body);
  const plans = SOL.DISTS.map(D => SOL.plan(obj, series, D, c));

  const rows = plans.map(r => {
    if (!r.time) return `<tr class="no"><td>${dispD(r.D)}</td><td colspan="4">${r.note || '—'}</td></tr>`;
    const cls = r.ok ? 'ok' : 'no';
    return `<tr class="${cls}">
      <td>${dispD(r.D)}</td>
      <td>${fmt(r.time)}</td>
      <td>${Math.round(r.focal)} mm${r.inRange ? '' : ' ✗'}</td>
      <td>${Math.round(r.bodyFrame * 100)}%</td>
      <td>${Math.round(r.bodyVsObj * 100)}%${r.note ? ' · ' + r.note : ''}</td></tr>`;
  }).join('');

  // bedste standpunkt: gyldigt (i ramme + i linse-interval), tættest på 400 mm = mest komprimering
  const feas = plans.filter(r => r.ok);
  const bandDist = f => f < SOL.LENS_MIN ? SOL.LENS_MIN - f : f > SOL.LENS_MAX ? f - SOL.LENS_MAX : 0;
  // hvilket standpunkt skal previewes: bedste gyldige, ellers det tættest på linse-intervallet
  const previewPlan = feas.length
    ? feas.reduce((a, b) => Math.abs(b.focal - 400) < Math.abs(a.focal - 400) ? b : a)
    : plans.filter(r => r.time).sort((a, b) => bandDist(a.focal) - bandDist(b.focal))[0];
  const previewHtml = previewPlan ? `<div class="sol-preview-wrap">
      ${solPreview(c, previewPlan)}
      <div class="sol-dim" style="text-align:center;margin-top:6px">Ved ${dispD(previewPlan.D)} · ${Math.round(previewPlan.focal)} mm · kl. ${fmt(previewPlan.time)}${feas.length ? '' : ' · (nærmeste — ikke helt i 150–400 mm/ramme)'}</div>
    </div>` : '';
  let mapBtn;
  if (feas.length) {
    const best = previewPlan;
    mapBtn = `<div class="sol-dim" style="margin:10px 0 4px">Bedste: stå <b>${dispD(best.D)}</b> mod <b>${SOL.compassName(best.back)}</b> (${Math.round(best.back)}°) for objektet, kl. <b>${fmt(best.time)}</b>, brændvidde <b>${Math.round(best.focal)} mm</b>.</div>
      <a class="route-map-btn" target="_blank" rel="noopener"
        href="https://www.google.com/maps/dir/?api=1&destination=${best.gp.lat.toFixed(5)},${best.gp.lon.toFixed(5)}&travelmode=driving">
        🚗 Kør til foreslået standpunkt</a>`;
  } else {
    mapBtn = `<div class="sol-note" style="margin-top:8px">Ingen afstand giver en komposition der passer i både billedrammen og 150–400 mm. Prøv mindre objektstørrelse, mindre forskydning, eller en anden dato/side.</div>`;
  }

  statusEl.innerHTML = `Sol & Måne · ${esc(obj.name)}`;
  content.innerHTML = `<div class="sol-wrap">
    ${inputsHtml}
    ${moonHtml}
    <table class="sol-table sol-events"><thead><tr><th>Hændelse</th><th>Tid</th><th>Retning</th><th>Højde</th></tr></thead><tbody>${evHtml}</tbody></table>
    <h3 class="sol-h3">📐 Hvor skal du stå?</h3>
    ${previewHtml}
    <table class="sol-table"><thead><tr><th>Afstand</th><th>Tid</th><th>Brændvidde</th><th>${bodyLabel} i billedet</th><th>${bodyLabel} vs. objekt</th></tr></thead><tbody>${rows}</tbody></table>
    ${mapBtn}
    <div class="sol-note">Hver række er ét standpunkt langs "stå-her-linjen". <b>Grøn</b> = passer i både rammen og din 150–400 mm. Tiden er hvornår ${bodyLabel.toLowerCase()} rammer den valgte position (${c.side === 'set' ? 'på vej ned' : 'på vej op'}). Jo længere væk, jo større virker ${bodyLabel.toLowerCase()} (komprimering). Horisont antaget ved havoverfladen (0°) — terræn foran indgår ikke endnu.</div>
  </div>`;
}

SOL.on = function (field, val) {
  if (field === 'objIdx') { this.cfg.objIdx = val === 'custom' ? 'custom' : +val; }
  else if (field === 'height') { this.cfg.height = +val; }
  else if (field === 'fill' || field === 'offX' || field === 'offY') { this.cfg[field] = +val / 100; }
  else if (field === 'lat' || field === 'lon') {
    // Normalisér: dansk komma → punktum, fjern mellemrum. type="text" giver os den rå
    // streng (type="number" ville have strippet kommaet som tusind-separator → skrald-værdi).
    const s = String(val).trim().replace(/\s+/g, '').replace(',', '.');
    const n = parseFloat(s);
    const limit = field === 'lat' ? 90 : 180;   // afvis værdier uden for gyldigt interval
    this.cfg[field] = (s === '' || !isFinite(n) || Math.abs(n) > limit) ? null : n;
  }
  else { this.cfg[field] = val; }   // objIdx=custom, body, side, anchor, date, name
  render();
};

function render() {
  const statusEl = document.getElementById('status');
  const content = document.getElementById('content');
  renderTagFilters();

  // Ruteforslag-view (uafhængigt af items/flickr)
  if (state.view === 'ruter') { renderRuter(content, statusEl); return; }

  // Sol & Måne-planlægger (uafhængigt af items/flickr)
  if (state.view === 'sol') { renderSol(content, statusEl); return; }

  // Fase 1: landmark-overblik som standard-view (falder tilbage til feed hvis ingen grupper)
  if (state.view === 'overblik' && state.flickrLandmarkMode && state.flickr.length) {
    const groups = buildLandmarkGroups();
    if (groups.length) { renderOverview(content, statusEl, groups); return; }
  }

  const filtered = getFilteredItems();
  const tasteTag = hasTaste() ? ` &middot; <span style="color:#ff7fb0">✨ tilpasset til dig</span>` : '';
  statusEl.innerHTML = `<span class="count">${filtered.length}</span> af ${state.items.length} steder${tasteTag}`;
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = filterLabel();

  if (filtered.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <div class="icon">📷</div>
        <p>Ingen fotospots${state.filter !== 'all' ? ' i dette filter' : ''}</p>
        <p class="sub">Tilføj lokationer og inspiration via Admin (tandhjulet)</p>
      </div>`;
    return;
  }

  const backBar = state.filter.startsWith('lm:')
    ? `<button class="back-bar" onclick="backToOverview()">← Overblik</button>` : '';
  content.innerHTML = backBar + '<div class="cards">' + filtered.map(item => {
    const isLoc = item.type === 'location';
    const isFlickr = item.type === 'flickr';
    const icon = isLoc ? '📍' : isFlickr ? '📷' : '📸';
    const badge = isLoc ? '<span class="card-badge loc">📍 Lokation</span>'
      : isFlickr ? `<span class="card-badge flickr">${item.catLabel ? esc(item.catLabel) : '📷 Flickr'}</span>`
      : '<span class="card-badge insp">📸 Inspiration</span>';
    const distHtml = item.dist !== null ? `<span class="card-distance">${formatDist(item.dist)}</span>` : '';
    const imgHtml = item.photo
      ? `<img src="${item.photo}" alt="${esc(item.name)}" loading="lazy">`
      : `<div class="placeholder">${icon}</div>`;
    const tagCls = isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp';

    const photoCount = item.photos.length;
    const countBadge = photoCount > 1 ? `<span style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:12px;font-size:11px;color:#fff;">${photoCount} billeder</span>` : '';
    const inHiddenView = state.filter === 'hidden';
    const liked = state.liked.has(item.id);
    const likeBtn = `<button class="act-btn like ${liked ? 'on' : ''}" onclick="event.stopPropagation();likeItem('${item.id}')">${liked ? '❤️' : '🤍'} Synes om</button>`;
    const hideBtn = inHiddenView
      ? `<button class="act-btn restore" onclick="event.stopPropagation();unhideItem('${item.id}')">↩ Vis igen</button>`
      : `<button class="act-btn" onclick="event.stopPropagation();askHide('${item.id}')">✕ Skjul</button>`;
    const shownTags = isFlickr ? (item.flickrTags || []) : item.tags;

    return `
      <div class="card" onclick="openDetail('${item.id}')" style="cursor:pointer">
        <div class="card-img">
          ${imgHtml}
          ${badge}
          ${distHtml}
          ${countBadge}
        </div>
        <div class="card-body">
          <div class="card-name">${esc(item.name)}</div>
          ${item.landmark ? `<div class="card-landmark">📍 ${esc(item.landmark)}</div>` : ''}
          <div class="card-location">${icon} ${esc(item.subtitle)}</div>
          ${item.notes ? `<div class="card-notes">${esc(item.notes)}</div>` : ''}
          ${shownTags.length ? `<div class="card-tags">${shownTags.slice(0, 6).map(t => `<span class="card-tag ${tagCls}">${esc(t)}</span>`).join('')}${shownTags.length > 6 ? `<span class="card-tag ${tagCls}">+${shownTags.length - 6}</span>` : ''}</div>` : ''}
          <div class="card-actions">${likeBtn}${hideBtn}</div>
        </div>
      </div>`;
  }).join('') + '</div>';
}

function renderTagFilters() {
  const allTags = new Set();
  state.items.forEach(i => i.tags.forEach(t => allTags.add(t)));

  const filtersEl = document.getElementById('filters');
  const flickrFilterPill = state.flickr.length
    ? `<button class="pill ${state.filter === 'flickr' ? 'flickr-on' : ''}" data-filter="flickr">📷 Flickr</button>`
    : '';
  const basePills = `
    <button class="pill ${state.filter === 'all' ? 'active' : ''}" data-filter="all">Alle</button>
    <button class="pill ${state.filter === 'locations' ? 'active-loc' : ''}" data-filter="locations">📍 Lokationer</button>
    <button class="pill ${state.filter === 'inspirations' ? 'active-insp' : ''}" data-filter="inspirations">📸 Inspiration</button>
    ${flickrFilterPill}
  `;

  const tagPills = [...allTags].sort().map(t =>
    `<button class="pill ${state.filter === t ? 'active' : ''}" data-filter="${esc(t)}">${esc(t)}</button>`
  ).join('');

  const likedCount = state.liked.size;
  const likedPill = likedCount
    ? `<button class="pill ${state.filter === 'liked' ? 'active' : ''}" data-filter="liked">❤️ Favoritter (${likedCount})</button>`
    : '';
  const hiddenCount = specialViewItems(id => state.hidden.has(id)).length;
  const hiddenPill = hiddenCount
    ? `<button class="pill ${state.filter === 'hidden' ? 'active' : ''}" data-filter="hidden">🚫 Skjulte (${hiddenCount})</button>`
    : '';
  const togglePill = `<button class="pill ${state.flickrEnabled ? 'flickr-on' : ''}" data-action="toggle-flickr">📷 Flickr ${state.flickrEnabled ? 'til' : 'fra'}</button>`;
  const landmarkPill = state.flickrEnabled
    ? `<button class="pill ${state.flickrLandmarkMode ? 'flickr-on' : ''}" data-action="toggle-landmark">🏛️ Landmarks ${state.flickrLandmarkMode ? 'til' : 'fra'}</button>`
    : '';
  const viewToggle = (state.flickrEnabled && state.flickrLandmarkMode && state.flickr.length)
    ? `<button class="pill ${state.view === 'overblik' ? 'active' : ''}" data-action="view-overblik">🧭 Overblik</button>
       <button class="pill ${state.view === 'feed' ? 'active' : ''}" data-action="view-feed">🖼 Billeder</button>`
    : '';

  const townOpts = ['<option value="">📍 Min position (GPS)</option>'].concat(
    [...state.towns].sort((a, b) => a.name.localeCompare(b.name, 'da')).map(t =>
      `<option value="${esc(t.name)}" ${state.manualTown === t.name ? 'selected' : ''}>${esc(t.name)}</option>`)
  ).join('');
  const townPicker = state.towns.length
    ? `<div class="town-picker-wrap"><label class="town-picker-lbl">🔭 Scout en by</label><select class="town-picker" onchange="selectTown(this.value)">${townOpts}</select></div>`
    : '';

  const routePill = `<button class="pill ${state.view === 'ruter' ? 'active' : ''}" data-action="view-ruter">🗺️ Ruter</button>`;
  const solPill = `<button class="pill ${state.view === 'sol' ? 'active' : ''}" data-action="view-sol">🌅 Sol & Måne</button>`;

  filtersEl.innerHTML = townPicker + routePill + solPill + viewToggle + basePills + likedPill + hiddenPill + togglePill + landmarkPill + tagPills;
}

// --- Filter click ---
document.getElementById('filters').addEventListener('click', async e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  if (pill.dataset.action === 'toggle-flickr') {
    state.flickrEnabled = !state.flickrEnabled;
    localStorage.setItem('fotoscout-flickr', state.flickrEnabled ? 'on' : 'off');
    if (state.flickrEnabled) {
      await loadFlickr();
    } else {
      state.flickr = [];
      if (state.filter === 'flickr') state.filter = 'all';
    }
    buildItems();
    render();
    return;
  }
  if (pill.dataset.action === 'toggle-landmark') {
    state.flickrLandmarkMode = !state.flickrLandmarkMode;
    localStorage.setItem('fotoscout-flickr-lm', state.flickrLandmarkMode ? 'on' : 'off');
    await loadFlickr();   // genhent med den nye søgemetode
    buildItems();
    render();
    return;
  }
  if (pill.dataset.action === 'view-ruter') {
    state.view = 'ruter'; state.routeId = null;
    document.getElementById('filtersPanel').classList.remove('open');
    window.scrollTo(0, 0);
    render(); return;
  }
  if (pill.dataset.action === 'view-sol') {
    state.view = 'sol';
    document.getElementById('filtersPanel').classList.remove('open');
    window.scrollTo(0, 0);
    render(); return;
  }
  if (pill.dataset.action === 'view-overblik') {
    state.view = 'overblik'; state.filter = 'all';
    document.getElementById('filtersPanel').classList.remove('open');
    render(); return;
  }
  if (pill.dataset.action === 'view-feed') {
    state.view = 'feed';
    document.getElementById('filtersPanel').classList.remove('open');
    render(); return;
  }
  state.filter = pill.dataset.filter;
  state.view = 'feed';     // ethvert filter-valg vises i feed'et
  document.getElementById('filtersPanel').classList.remove('open');
  render();
});

// Burger-menu: åbn/luk filter-panelet
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('filtersPanel').classList.toggle('open');
});
// Luk panelet ved klik udenfor
document.addEventListener('click', (e) => {
  const panel = document.getElementById('filtersPanel');
  const btn = document.getElementById('menuBtn');
  if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
    panel.classList.remove('open');
  }
});

function filterLabel() {
  if (state.filter.startsWith('lm:')) return '📍 ' + state.filter.slice(3);
  const map = { all: 'Alle', locations: '📍 Lokationer', inspirations: '📸 Inspiration', flickr: '📷 Flickr', hidden: '🚫 Skjulte', liked: '❤️ Favoritter' };
  return map[state.filter] || ('🏷️ ' + state.filter);
}

// --- Ruteforslag-view ---
function effectivePos() {
  if (state.lat != null && state.lon != null) return { lat: state.lat, lon: state.lon };
  if (state.gpsLat != null && state.gpsLon != null) return { lat: state.gpsLat, lon: state.gpsLon };
  return null;
}

// Google Maps-link til hele ruten (op til 9 mellem-waypoints understøttes).
function buildFullRouteUrl(route) {
  const s = route.stops;
  if (s.length < 2) return `https://www.google.com/maps/dir/?api=1&destination=${s[0].lat},${s[0].lon}&travelmode=driving`;
  const origin = `${s[0].lat},${s[0].lon}`;
  const dest = `${s[s.length - 1].lat},${s[s.length - 1].lon}`;
  let mids = s.slice(1, -1);
  if (mids.length > 9) {  // udtynd jævnt men bevar rækkefølgen
    const step = mids.length / 9, picked = [];
    for (let i = 0; i < 9; i++) picked.push(mids[Math.floor(i * step)]);
    mids = picked;
  }
  const wp = mids.map(p => `${p.lat},${p.lon}`).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving` +
    (wp ? `&waypoints=${encodeURIComponent(wp)}` : '');
}

function renderRuter(content, statusEl) {
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = 'Ruter';
  const pos = effectivePos();

  // Rute-liste
  if (!state.routeId) {
    statusEl.innerHTML = `<span class="count">${ROUTES.length}</span> ruteforslag`;
    content.innerHTML = `<div class="route-wrap">
      <div class="route-intro">Vælg en rute nedenfor. Tryk på en attraktion for info, og tryk <b>Kør hertil</b> for at sende ruten til Google Maps — den vises på bilens skærm via Android Auto.</div>
      ${ROUTES.map(r => {
        let nearest = null;
        if (pos) nearest = Math.min(...r.stops.map(s => haversine(pos.lat, pos.lon, s.lat, s.lon)));
        return `<div class="route-card" onclick="openRoute('${r.id}')">
          <h3>${esc(r.name)}</h3>
          <p>${esc(r.description)}</p>
          <div class="route-meta">
            <span>🗼 ${r.stops.length} stop</span>
            <span>🧭 ${esc(r.direction)}</span>
            ${nearest != null ? `<span>📏 nærmeste ${formatDist(nearest)}</span>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  // Rute-detalje (tidslinje af stop)
  const route = ROUTES.find(r => r.id === state.routeId);
  if (!route) { state.routeId = null; return renderRuter(content, statusEl); }
  statusEl.innerHTML = `<span class="count">${route.stops.length}</span> stop · ${esc(route.direction)}`;

  const stopsHtml = route.stops.map((s, i) => {
    const dist = pos ? haversine(pos.lat, pos.lon, s.lat, s.lon) : null;
    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving`;
    return `<div class="rt-stop" onclick="openRouteStop('${route.id}',${i})">
      <div class="rt-rail"><div class="rt-num">${i + 1}</div><div class="rt-line"></div></div>
      <div class="rt-info">
        <div class="rt-name">${esc(s.name)}</div>
        <div class="rt-sub">${esc(s.town || s.address || '')}${dist != null ? ` · <span class="rt-dist">📏 ${formatDist(dist)}</span>` : ''}</div>
        <div class="rt-row">
          <a class="rt-go" href="${navUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🚗 Kør hertil</a>
          ${s.badge ? `<span class="rt-badge">${esc(s.badge)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `<div class="route-wrap">
    <button class="route-back" onclick="backToRuteList()">← Alle ruter</button>
    <div class="route-head">
      <h2>${esc(route.name)}</h2>
      <p>${esc(route.description)}</p>
    </div>
    <a class="route-map-btn" href="${buildFullRouteUrl(route)}" target="_blank" rel="noopener">🗺️ Åbn hele ruten i Google Maps</a>
    <div class="route-map-note">Viser alle stop på kortet. Til navigation undervejs: vælg ét fyrtårn og tryk “Kør hertil”.</div>
    <div class="route-ends"><span>▲ Syd (start)</span><span>Nord (slut) ▼</span></div>
    <div class="rt-timeline">${stopsHtml}</div>
  </div>`;
}

function openRoute(id) {
  state.routeId = id;
  window.scrollTo(0, 0);
  render();
}
function backToRuteList() {
  state.routeId = null;
  window.scrollTo(0, 0);
  render();
}

// Åbn en attraktion fra en rute i detalje-overlayet (genbruger detail-view).
function openRouteStop(routeId, idx) {
  const route = ROUTES.find(r => r.id === routeId);
  if (!route) return;
  const stop = route.stops[idx];
  if (!stop) return;

  const overlay = document.getElementById('detailOverlay');
  document.getElementById('detailTitle').textContent = stop.name;
  const badgeEl = document.getElementById('detailBadge');
  badgeEl.textContent = '🗼 Fyrtårn';
  badgeEl.className = 'detail-badge loc';

  const pos = effectivePos();
  const dist = pos ? haversine(pos.lat, pos.lon, stop.lat, stop.lon) : null;
  const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lon}&travelmode=driving`;
  const imgUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(stop.name + ' fyr')}`;
  const tags = stop.tags || [];

  document.getElementById('detailContent').innerHTML = `
    <div class="gallery-img"><div class="gallery-placeholder">🗼</div></div>
    <div class="detail-body">
      <div class="detail-location">📍 ${esc(stop.address || stop.town || '')}
        ${dist != null ? `<span class="detail-dist">📏 ${formatDist(dist)}</span>` : ''}
      </div>
      ${stop.info ? `<div class="detail-notes">${esc(stop.info)}</div>` : ''}
      ${tags.length ? `<div class="detail-tags">${tags.map(t => `<span class="detail-tag loc">${esc(t)}</span>`).join('')}</div>` : ''}
      <a href="${navUrl}" target="_blank" rel="noopener" class="detail-nav-btn loc">🚗 Kør hertil</a>
      <a href="${imgUrl}" target="_blank" rel="noopener" class="detail-nav-btn secondary">🔍 Se fotos af stedet</a>
    </div>`;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

// --- Detail view ---
function openDetail(id) {
  const item = getItemById(id);
  if (!item) return;
  state.openDetailId = id;

  const isLoc = item.type === 'location';
  const isFlickr = item.type === 'flickr';
  const overlay = document.getElementById('detailOverlay');
  const titleEl = document.getElementById('detailTitle');
  const badgeEl = document.getElementById('detailBadge');
  const contentEl = document.getElementById('detailContent');

  titleEl.textContent = item.name;
  badgeEl.textContent = isLoc ? '📍 Lokation' : isFlickr ? (item.catLabel || '📷 Flickr') : '📸 Inspiration';
  badgeEl.className = `detail-badge ${isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp'}`;

  // Gallery
  const photos = item.photos.filter(p => p);
  let galleryHtml = '';
  if (photos.length > 0) {
    galleryHtml = `
      <div class="gallery" id="gallery" onscroll="updateGalleryDots()">
        ${photos.map(p => `<div class="gallery-img"><img src="${p}" alt="${esc(item.name)}"></div>`).join('')}
      </div>
      ${photos.length > 1 ? `
        <div class="gallery-dots" id="galleryDots">
          ${photos.map((_, i) => `<div class="gallery-dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
        </div>
      ` : ''}
    `;
  } else {
    galleryHtml = `<div class="gallery-img"><div class="gallery-placeholder">${isLoc ? '📍' : isFlickr ? '📷' : '📸'}</div></div>`;
  }

  const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.navTarget)}`;
  const icon = isLoc ? '📍' : isFlickr ? '📷' : '📸';
  const tagCls = isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp';
  const btnCls = isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp';
  const detailTags = isFlickr ? (item.flickrTags || []) : item.tags;
  const flickrCredit = (isFlickr && item.flickrPage)
    ? `<div class="flickr-credit">📷 ${esc(item.ownername || 'Ukendt fotograf')} · <a href="${item.flickrPage}" target="_blank" rel="noopener">Se på Flickr ↗</a></div>`
    : '';

  contentEl.innerHTML = `
    ${galleryHtml}
    <div class="detail-body">
      <div class="detail-location">
        ${icon} ${esc(item.subtitle)}
        ${item.dist !== null ? `<span class="detail-dist">📏 ${formatDist(item.dist)}</span>` : ''}
      </div>
      ${item.landmark ? `<div class="detail-landmark">📍 ${esc(item.landmark)}</div>` : ''}
      ${flickrCredit}
      ${item.notes ? `<div class="detail-notes">${esc(item.notes)}</div>` : ''}
      ${detailTags.length ? `<div class="detail-tags">${detailTags.map(t => `<span class="detail-tag ${tagCls}">${esc(t)}</span>`).join('')}</div>` : ''}
      <a href="${navUrl}" target="_blank" rel="noopener" class="detail-nav-btn ${btnCls}">📍 Navigér hertil</a>
      ${!isFlickr ? `<a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.name)}" target="fsimg" rel="noopener" class="detail-nav-btn ${btnCls}" style="background:none;border:1px solid var(--border,#dee2e6);color:inherit;">🔍 Se flere billeder på Google</a>` : ''}
      <div class="detail-actions">
        <button class="detail-act-btn like ${state.liked.has(item.id) ? 'on' : ''}" onclick="likeItem('${item.id}')">${state.liked.has(item.id) ? '❤️ Synes om' : '🤍 Synes om'}</button>
        ${state.hidden.has(item.id)
          ? `<button class="detail-act-btn" onclick="unhideItem('${item.id}')">↩ Vis igen</button>`
          : `<button class="detail-act-btn" onclick="askHide('${item.id}')">✕ Skjul</button>`}
      </div>
    </div>
  `;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
  state.openDetailId = null;
}

function updateGalleryDots() {
  const gallery = document.getElementById('gallery');
  const dots = document.querySelectorAll('#galleryDots .gallery-dot');
  if (!gallery || dots.length === 0) return;
  const idx = Math.round(gallery.scrollLeft / gallery.offsetWidth);
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
}

// Back button / swipe to close
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSheet(); closeDetail(); }
});

// --- Init ---
async function init() {
  await loadData();
  await loadTowns();

  // Try geolocation
  try {
    const pos = await getPosition();
    state.lat = pos.lat;
    state.lon = pos.lon;
    state.gpsLat = pos.lat; state.gpsLon = pos.lon;   // gem rigtig GPS til "Min position"
    const name = await reverseGeocode(pos.lat, pos.lon);
    state.gpsName = name;
    document.getElementById('locationName').textContent = name;
  } catch {
    document.getElementById('locationName').textContent = 'Ingen GPS';
    document.querySelector('.gps-dot').style.background = '#8b949e';
  }

  buildItems();
  render();

  // Hent Flickr-billeder i baggrunden og gen-render
  await loadFlickr();
  buildItems();
  render();
}

// --- Android-tilbageknap: naviger inde i appen, bekræft kun ved forlad fra forsiden ---
function pushBackTrap() { history.pushState({ fsTrap: true }, ''); }

function handleInAppBack() {
  if (state.openDetailId) { closeDetail(); return true; }              // 1. luk åbent billede
  const sheet = document.getElementById('sheetOverlay');
  if (sheet && sheet.classList.contains('open')) { closeSheet(); return true; }   // 2. luk skjul-ark
  const panel = document.getElementById('filtersPanel');
  if (panel && panel.classList.contains('open')) { panel.classList.remove('open'); return true; }  // 3. luk menu
  if (state.view === 'feed') { backToOverview(); return true; }        // 4. feed/landmark -> overblik
  return false;                                                        // ved overblik-roden
}

window.addEventListener('popstate', () => {
  if (handleInAppBack()) { pushBackTrap(); return; }                   // håndteret internt -> gen-arm fælden
  if (confirm('Vil du forlade FotoScout?')) {
    history.back();                                                    // bekræftet -> forlad appen
  } else {
    pushBackTrap();                                                    // bliv i appen
  }
});

pushBackTrap();   // arm fælden ved opstart, så første tilbage-tryk ikke smider dig ud

init();
</script>
