<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FotoScout</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FotoScout">
<meta name="description" content="Personlig foto-planlægger til Vestkysten">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-bright: #ffffff;
    --border: #30363d;
    --pin: #4a7fff;
    --pin-bg: rgba(74,127,255,0.12);
    --cam: #f0a030;
    --cam-bg: rgba(240,160,48,0.12);
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,17,23,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .logo { font-size: 22px; font-weight: 800; }
  .logo span { color: var(--cam); }

  .location-name {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .gps-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3fb950;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .filters::-webkit-scrollbar { display: none; }

  /* Burger-menu */
  .filter-bar { display: flex; }
  .menu-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .menu-btn .burger { font-size: 18px; line-height: 1; }
  .filters-panel {
    display: none;
    margin-top: 10px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .filters-panel.open { display: block; }

  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pill.active { background: var(--cam); color: var(--bg); border-color: var(--cam); }
  .pill.active-loc { background: var(--pin); color: #fff; border-color: var(--pin); }
  .pill.active-insp { background: var(--cam); color: var(--bg); border-color: var(--cam); }

  /* Status */
  .status {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .status .count { color: var(--cam); font-weight: 700; }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 20px;
    gap: 16px;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--cam);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { font-size: 14px; color: var(--text-dim); }

  /* Cards */
  .cards {
    padding: 8px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.15s;
  }

  .card:active { transform: scale(0.98); }

  .card-img {
    position: relative;
    width: 100%;
    height: 200px;
    background: #0a0e14;
    overflow: hidden;
  }

  .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-img .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 48px;
    opacity: 0.15;
  }

  .card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 3px 10px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-badge.loc { background: var(--pin); }
  .card-badge.insp { background: var(--cam); }

  .card-distance {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-bright);
  }

  .card-body { padding: 14px 16px 16px; }

  .card-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 4px;
  }

  .card-location {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-notes {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .card-tag {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }

  .card-tag.loc { background: var(--pin-bg); color: var(--pin); }
  .card-tag.insp { background: var(--cam-bg); color: var(--cam); }

  .card-footer { display: flex; gap: 8px; }

  .card-footer a {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-nav {
    background: var(--pin);
    color: #fff;
  }

  .btn-nav:active { background: #3a6fee; }

  .btn-nav.insp-nav {
    background: var(--cam);
    color: var(--bg);
  }

  .btn-nav.insp-nav:active { background: #e09020; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }

  .empty .icon { font-size: 48px; margin-bottom: 16px; }
  .empty p { font-size: 15px; line-height: 1.6; }
  .empty .sub { font-size: 13px; margin-top: 8px; }

  /* Detail overlay */
  .detail-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 200;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .detail-overlay.open { display: block; }

  .detail-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13,17,23,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail-back {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .detail-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-bright);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .detail-badge {
    padding: 3px 10px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .detail-badge.loc { background: var(--pin); }
  .detail-badge.insp { background: var(--cam); }

  /* Gallery */
  .gallery {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .gallery::-webkit-scrollbar { display: none; }

  .gallery-img {
    flex: 0 0 100%;
    scroll-snap-align: start;
    height: 280px;
    background: #0a0e14;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gallery-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .gallery-placeholder {
    font-size: 64px;
    opacity: 0.15;
  }

  .gallery-counter {
    text-align: center;
    padding: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .gallery-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 8px;
  }

  .gallery-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }

  .gallery-dot.active { background: var(--cam); }

  .detail-body {
    padding: 20px 16px 100px;
  }

  .detail-location {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .detail-dist {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    margin-left: 8px;
  }

  .detail-notes {
    font-size: 15px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .detail-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .detail-tag {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }

  .detail-tag.loc { background: var(--pin-bg); color: var(--pin); }
  .detail-tag.insp { background: var(--cam-bg); color: var(--cam); }

  .detail-nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    color: #fff;
  }

  .detail-nav-btn.loc { background: var(--pin); }
  .detail-nav-btn.insp { background: var(--cam); color: var(--bg); }

  /* Admin link */
  .admin-link {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    text-decoration: none;
    z-index: 99;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  /* Flickr */
  .card-badge.flickr { background: #ff5c9e; }
  .detail-badge.flickr { background: #ff5c9e; }
  .card-tag.flickr, .detail-tag.flickr { background: rgba(255,92,158,0.12); color: #ff7fb0; }
  .detail-nav-btn.flickr { background: #ff5c9e; color: #fff; }
  .pill.flickr-on { background: #ff5c9e; color: #fff; border-color: #ff5c9e; }
  .flickr-credit { font-size: 12px; color: var(--text-dim); margin: -4px 0 14px; }
  .flickr-credit a { color: #ff7fb0; text-decoration: none; font-weight: 600; }
  .card-landmark { font-size: 13px; font-weight: 700; color: #ff7fb0; margin: 2px 0 4px; }
  .detail-landmark { font-size: 16px; font-weight: 700; color: #ff7fb0; margin: 8px 0 4px; }
  /* Fase 1: landmark-overblik */
  .overview { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 24px; }
  .lm-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
  .lm-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .lm-rank { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: #ff5c9e; color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .lm-titles { min-width: 0; }
  .lm-name { font-size: 16px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lm-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .lm-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .lm-strip img { width: 100%; height: 80px; object-fit: cover; border-radius: 10px; cursor: pointer; background: var(--bg); }
  .lm-actions { display: flex; gap: 8px; margin-top: 10px; }
  .lm-btn { flex: 1; text-align: center; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
  .lm-btn.nav { background: #ff5c9e; color: #fff; border-color: #ff5c9e; }
  .back-bar { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer; }
  .town-picker-wrap { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-bottom: 10px; }
  .town-picker-lbl { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .town-picker { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; font-weight: 600; }

  /* Synes om / skjul / gendan */
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .act-btn {
    flex: 1; padding: 8px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .act-btn.like.on { color: #ff5c9e; border-color: rgba(255,92,158,0.45); }
  .act-btn.restore { color: #3fb950; border-color: rgba(63,185,80,0.45); }
  .detail-actions { display: flex; gap: 10px; margin-top: 10px; }
  .detail-act-btn {
    flex: 1; padding: 12px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .detail-act-btn.like.on { color: #ff5c9e; border-color: rgba(255,92,158,0.45); }

  /* Begrundelses-ark */
  .sheet-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 300;
    align-items: flex-end; justify-content: center;
  }
  .sheet-overlay.open { display: flex; }
  .sheet {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    width: 100%; max-width: 520px;
    padding: 16px 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
  }
  .sheet-title { font-size: 15px; font-weight: 700; color: var(--text-bright); padding: 6px 4px 10px; }
  .sheet-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; padding: 14px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-size: 15px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .sheet-btn small { font-size: 12px; font-weight: 400; color: var(--text-dim); }
  .sheet-cancel {
    width: 100%; padding: 13px; border-radius: 12px; margin-top: 4px;
    background: transparent; border: none; color: var(--text-dim);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">Foto<span>Scout</span></div>
    <div class="location-name">
      <span class="gps-dot"></span>
      <span id="locationName">Finder position...</span>
    </div>
  </div>
  <div class="filter-bar">
    <button class="menu-btn" id="menuBtn" aria-label="Filtre">
      <span class="burger">&#9776;</span><span id="activeFilterLabel">Alle</span>
    </button>
  </div>
  <div class="filters-panel" id="filtersPanel">
    <div class="filters" id="filters">
      <button class="pill active" data-filter="all">Alle</button>
    </div>
  </div>
</div>

<div class="status" id="status">Indlæser...</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Finder din position...</div>
  </div>
</div>

<!-- Detail view -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-header">
    <button class="detail-back" onclick="closeDetail()">&#8592;</button>
    <div class="detail-title" id="detailTitle"></div>
    <span class="detail-badge" id="detailBadge"></span>
  </div>
  <div id="detailContent"></div>
</div>

<!-- Begrundelses-ark ved skjul -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-title">Hvorfor skjule billedet?</div>
    <button class="sheet-btn" onclick="confirmHide('quality')"><span>👎 Dårlig kvalitet</span><small>nedprioriterer fotografen</small></button>
    <button class="sheet-btn" onclick="confirmHide('motif')"><span>🚫 Ikke relevant motiv</span><small>nedprioriterer motivet (hvis billedet er tagget)</small></button>
    <button class="sheet-btn" onclick="confirmHide('thisonly')"><span>🙈 Skjul kun denne</span><small>påvirker ikke din smags-profil</small></button>
    <button class="sheet-cancel" onclick="closeSheet()">Annullér</button>
  </div>
</div>

<a href="#" onclick="event.preventDefault();location.reload(true);" class="admin-link" title="Opdatér" style="font-size:24px;color:var(--text-dim);">&#x21bb;</a>

<style>
/* --- Ruteforslag --- */
.route-wrap { padding: 12px 16px 40px; }
.route-intro { color: var(--text-dim); font-size: 13px; line-height: 1.55; margin-bottom: 16px; }
.route-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; cursor: pointer; transition: transform 0.15s; }
.route-card:active { transform: scale(0.98); }
.route-card h3 { font-size: 18px; color: var(--text-bright); margin: 0 0 6px; }
.route-card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0 0 10px; }
.route-meta { display: flex; gap: 14px; font-size: 12px; color: var(--pin); flex-wrap: wrap; }
.route-back { background: none; border: none; color: var(--pin); font-size: 15px; padding: 4px 0 12px; cursor: pointer; }
.route-head h2 { font-size: 20px; color: var(--text-bright); margin: 0 0 4px; }
.route-head p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0 0 14px; }
.route-map-btn { display: block; text-align: center; background: var(--pin); color: #fff; font-weight: 700; padding: 14px; border-radius: var(--radius); text-decoration: none; margin: 0 0 8px; }
.route-map-note { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0 0 20px; }
.route-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
.rt-timeline { position: relative; }
.rt-stop { position: relative; display: flex; gap: 14px; cursor: pointer; }
.rt-rail { position: relative; display: flex; flex-direction: column; align-items: center; width: 34px; flex-shrink: 0; }
.rt-num { width: 34px; height: 34px; border-radius: 50%; background: var(--pin-bg); border: 2px solid var(--pin); color: var(--pin); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; z-index: 1; }
.rt-line { flex: 1; width: 2px; background: var(--border); margin: 2px 0; min-height: 14px; }
.rt-stop:last-child .rt-line { display: none; }
.rt-info { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; transition: transform 0.15s; }
.rt-stop:active .rt-info { transform: scale(0.99); }
.rt-name { font-size: 16px; font-weight: 700; color: var(--text-bright); margin-bottom: 3px; }
.rt-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }

// Indlæs skjulte (id -> begrundelse); migrér gammelt format (kun id'er)
function loadHidden() {
  const m = new Map();
  try {
    for (const e of JSON.parse(localStorage.getItem('fotoscout-hidden') || '[]')) {

const NEAR_THRESHOLD_KM = 15;    // hvor tæt på en by, før Flickr aktiveres

  view: 'overblik',                 // 'overblik' (landmark-grupper) | 'feed' (alle billeder) | 'ruter'
  routeId: null,                    // valgt rute i 'ruter'-view (null = rute-liste)
  _groups: [],                      // seneste landmark-grupper (til klik-handlere)
  manualTown: null,                 // valgt by fra listen (scout hjemmefra) — null = brug GPS
  gpsLat: null, gpsLon: null, gpsName: null,   // den rigtige GPS-position (så man kan skifte tilbage)
  items: []
