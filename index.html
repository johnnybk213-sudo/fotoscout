  const anchorFY = c.anchor === 'base' ? m : c.anchor === 'mid' ? m + fill / 2 : m + fill;
  const bodyFY = anchorFY + c.offY, bodyFX = 0.5 + c.offX;
  const pan = plan.fovV ? ((+c.tilt || 0) / plan.fovV) * H : 0;           // kamerahældning: pan hele scenen ned (op-vip)
  const bx = MX + bodyFX * W, by = MY + (1 - bodyFY) * H + pan;           // body i canvas-koord
  const br = Math.max(2, plan.bodyFrame / 2 * H);        // px/grad er ens i begge akser (4:3-ramme) → rund
  const horizonY = (1 - m) * H, topY = (1 - (m + fill)) * H;
  const hzC = MY + horizonY + pan, topYC = MY + topY + pan, cx = MX + W / 2;   // frame-koord → canvas-koord (+ hældning)
  // Silhuettens bredde i px: samme vinkelskala som højden (4:3-ramme), så
  // px/meter er ens i begge akser → skalér realbredde mod objektets højde.
  const pxPerM = (horizonY - topY) / Math.max(1, c.height || 1);
  const halfW = Math.min(W * 0.46, Math.max(4, (c.width || 8) * pxPerM / 2));
  const isMoon = c.body === 'moon';
  const gid = 'solsky' + (isMoon ? 'm' : 's');
  const silhouette = solSilhouette(c.shape, cx, hzC, topYC, halfW, '#0c1118');
  const sky = isMoon
    ? `<stop offset="0" stop-color="#16223b"/><stop offset="1" stop-color="#2c3e63"/>`
    : `<stop offset="0" stop-color="#2a3a5e"/><stop offset="0.6" stop-color="#e8894a"/><stop offset="1" stop-color="#ffd089"/>`;
  const bodyFill = isMoon ? '#eef2fb' : '#fff2c4';
  const bodyGlow = isMoon ? 'rgba(200,215,255,0.35)' : 'rgba(255,200,110,0.55)';
  // Sol: fyldt skive. Måne: mørk skive + oplyst del tegnet efter fase (terminator-ellipse).
  let bodyShape;
  if (!isMoon) {
    bodyShape = `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}" fill="${bodyFill}"/>`;
  } else {
    const il = SOL.moonIllum(plan.time);
    const f = Math.max(0, Math.min(1, il.fraction));
    const waxing = ((il.phase % 1) + 1) % 1 < 0.5;       // tiltagende = oplyst på højre side (nordlig halvkugle)
    const rx = (br * Math.abs(1 - 2 * f)).toFixed(1);
    const top = `${bx.toFixed(1)},${(by - br).toFixed(1)}`, bot = `${bx.toFixed(1)},${(by + br).toFixed(1)}`;
    const limbSweep = waxing ? 1 : 0;                    // oplyst limbus: højre (tiltagende) / venstre (aftagende)
    const termSweep = waxing ? (f > 0.5 ? 1 : 0) : (f > 0.5 ? 0 : 1);
    const lit = `<path d="M ${top} A ${br.toFixed(1)} ${br.toFixed(1)} 0 0 ${limbSweep} ${bot} A ${rx} ${br.toFixed(1)} 0 0 ${termSweep} ${top} Z" fill="${bodyFill}"/>`;
    bodyShape = `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}" fill="#1c2740"/>${lit}`;
  }
  const dim = 'rgba(6,10,18,0.58)';                      // dæmper margin-området, så rammen popper
  // Havhorisont-reference (0°): kun når højdeforskel rykker den ind i billedet, væk fra objektets fod
  const seaFy = plan.seaFy == null ? m : plan.seaFy;
  const ySeaC = MY + (1 - seaFy) * H + pan;
  const seaLine = (Math.abs(seaFy - m) > 0.002 && ySeaC >= MY && ySeaC <= MY + H)
    ? `<line x1="${MX}" y1="${ySeaC.toFixed(1)}" x2="${MX + W}" y2="${ySeaC.toFixed(1)}" stroke="rgba(120,180,255,0.75)" stroke-width="1" stroke-dasharray="5 4"/><text x="${(MX + 5)}" y="${(ySeaC - 4).toFixed(1)}" fill="rgba(170,205,255,0.95)" font-size="11" font-family="sans-serif">havhorisont 0°</text>`
    : '';
  const outFrame = (bx + br < MX || bx - br > MX + W || by + br < MY || by - br > MY + H);
  const outTag = outFrame ? `<text x="${(MX + W / 2).toFixed(0)}" y="${(MY - 8).toFixed(0)}" text-anchor="middle" fill="#ffd089" font-size="13" font-family="sans-serif">${isMoon ? 'Månen' : 'Solen'} er uden for rammen</text>` : '';
  // Sekundært himmellegeme (det andet af sol/måne): tegnes altid når det er oppe —
  // som skive hvor det står (også i den dæmpede margin), ellers som kant-pil hvis
  // det ligger helt uden for lærredet. Diskret ring + emoji, så det ikke forveksles
  // med det primære motiv.
  let secMarker = '';
  const sec = plan.secondary;
  if (sec && sec.up) {
    const emo = sec.body === 'moon' ? '🌙' : '☀️';
    const sFill = sec.body === 'moon' ? '#dfe6f5' : '#ffe6a0';
    const sRing = sec.body === 'moon' ? 'rgba(200,215,255,0.75)' : 'rgba(255,205,120,0.9)';
    const sx = MX + sec.fx * W, sy = MY + (1 - sec.fy) * H + pan;
    const sr = Math.max(2.5, sec.diam / plan.fovV / 2 * H);
    const pad = 16;
    if (sx >= pad && sx <= CW - pad && sy >= pad && sy <= CH - pad) {
      secMarker = `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${(sr + 3).toFixed(1)}" fill="none" stroke="${sRing}" stroke-width="1.5" stroke-dasharray="3 2"/>`
        + `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${sr.toFixed(1)}" fill="${sFill}" fill-opacity="0.92"/>`
        + `<text x="${sx.toFixed(1)}" y="${(sy - sr - 6).toFixed(1)}" text-anchor="middle" font-size="13" font-family="sans-serif">${emo}</text>`;
    } else {
      const cxp = Math.max(pad, Math.min(CW - pad, sx)), cyp = Math.max(pad, Math.min(CH - pad, sy));
      secMarker = `<circle cx="${cxp.toFixed(1)}" cy="${cyp.toFixed(1)}" r="10" fill="rgba(10,16,28,0.72)" stroke="${sRing}" stroke-width="1.5"/>`
        + `<text x="${cxp.toFixed(1)}" y="${(cyp + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-family="sans-serif">${emo}</text>`;
    }
  }
  return `<svg class="sol-preview" viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Forhåndsvisning af komposition">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">${sky}</linearGradient></defs>
    <rect x="0" y="0" width="${CW}" height="${hzC}" fill="url(#${gid})"/>
    <rect x="0" y="${hzC}" width="${CW}" height="${CH - hzC}" fill="${isMoon ? '#0a1220' : '#243247'}"/>
    <line x1="0" y1="${hzC}" x2="${CW}" y2="${hzC}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    ${seaLine}
    ${silhouette}
    <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${(br + 6).toFixed(1)}" fill="${bodyGlow}"/>
    ${bodyShape}
    <rect x="0" y="0" width="${CW}" height="${MY}" fill="${dim}"/>
    <rect x="0" y="${MY + H}" width="${CW}" height="${CH - MY - H}" fill="${dim}"/>
    <rect x="0" y="${MY}" width="${MX}" height="${H}" fill="${dim}"/>
    <rect x="${MX + W}" y="${MY}" width="${CW - MX - W}" height="${H}" fill="${dim}"/>
    <rect x="${MX}" y="${MY}" width="${W}" height="${H}" fill="none" stroke="#ffffff" stroke-width="2"/>
    ${secMarker}
    ${outTag}
  </svg>`;
}

function renderSol(content, statusEl) {
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = 'Sol & Måne';
  const c = SOL.cfg;

  // Objektkatalog: alle fyr fra ruterne (dedup på navn) + "Andet objekt"
  const stops = [];
  const seen = new Set();
  for (const r of ROUTES) for (const s of (r.stops || [])) {
    if (seen.has(s.name)) continue; seen.add(s.name);
    stops.push({ name: s.name, lat: s.lat, lon: s.lon });
  }
  // Katalog til sol+måne-scanneren: alle fyr + gemte objekter med koordinater
  SOL._catalog = stops.concat(SOL.savedObjects.filter(o => o.lat != null && o.lon != null).map(o => ({ name: o.name, lat: o.lat, lon: o.lon })));
  if (c.date == null) { const n = new Date(); c.date = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; }

  // Afled objekt-position
  let obj;
  if (c.objIdx === 'custom') {
    obj = { name: c.name || 'Eget objekt', lat: c.lat, lon: c.lon, height: +c.height || 30 };
  } else if (typeof c.objIdx === 'string' && c.objIdx.startsWith('saved:')) {
    const so = SOL.savedObjects[+c.objIdx.slice(6)] || stops[0];
    obj = { name: so.name, lat: so.lat, lon: so.lon, height: +c.height || 30 };
  } else {
    const s = stops[c.objIdx] || stops[0];
    obj = { name: s.name, lat: s.lat, lon: s.lon, height: +c.height || 30 };
  }

  // --- Setup: brændvidde + afstand er inputs; objektstørrelse (fill) er resultatet ---
  const dispD = D => D >= 1000 ? (D / 1000).toFixed(1) + ' km' : Math.round(D) + ' m';
  const selFocal = Math.max(SOL.LENS_MIN, Math.min(SOL.LENS_MAX, c.focal == null ? SOL.LENS_MAX : c.focal));
  const fovVsel = 2 * Math.atan(SOL.sensorDims().h / (2 * selFocal)) * SOL.R2D;         // lodret synsfelt (grader)
  // Afstands-skala uafhængig af valgt brændvidde: dækker hele kittet (12 mm-fyld → 200 mm-lille)
  const dMin = Math.round(SOL.distForFocal(obj.height, 1.0, SOL.LENS_MIN));       // objektet fylder rammen ved 12 mm
  const dMax = Math.round(SOL.distForFocal(obj.height, 0.15, SOL.LENS_MAX));      // objektet lille ved 200 mm
  const selDist = c.dist == null
    ? Math.max(dMin, Math.min(dMax, Math.round(SOL.distForFocal(obj.height, 0.6, selFocal))))
    : Math.max(dMin, Math.min(dMax, c.dist));
  const elev = +c.elev || 0;                                                       // objektets fod over dit standpunkt (m)
  const footAltSel = Math.atan(elev / selDist) * SOL.R2D;                          // fodens vinkel over din horisont (grader)
  const objAngVsel = (Math.atan((elev + obj.height) / selDist) - Math.atan(elev / selDist)) * SOL.R2D;
  const effFill = objAngVsel / fovVsel;                                            // objektets andel af billedhøjden (resultat)

  // 🕐 Tidspunkt-lås: hvis tiden er låst, overstyr lodret forskydning + op/nedgang, så
  // himmellegemet placeres på sin FAKTISKE højde kl. lockTime (frem for at tiden løses
  // ud fra en ønsket komposition). Så viser preview + sekundær-markør begge himmellegemer
  // præcis hvor de står på det låste tidspunkt. Genbruger plan() uændret.
  let lockOverride = null, lockInfo = null;
  if (c.lockOn && c.lockTime && obj.lat != null && obj.lon != null) {
    const [lh, lm] = c.lockTime.split(':').map(Number);
    const lockDate = new Date(...c.date.split('-').map((v, i) => i === 1 ? v - 1 : +v), lh || 0, lm || 0);
    const lpos = SOL.position(lockDate, obj.lat, obj.lon, c.body);
    const lnext = SOL.position(new Date(lockDate.getTime() + 60000), obj.lat, obj.lon, c.body);
    const lockedSide = lnext.alt >= lpos.alt ? 'rise' : 'set';                      // stiger → opgang, falder → nedgang
    const neededBodyFY = SOL.BASE_MARGIN + (lpos.alt - footAltSel) / fovVsel;       // frame-fraktion for den faktiske højde
    const anchorFY = c.anchor === 'base' ? SOL.BASE_MARGIN : c.anchor === 'mid' ? SOL.BASE_MARGIN + effFill / 2 : SOL.BASE_MARGIN + effFill;
    lockOverride = { offY: neededBodyFY - anchorFY, side: lockedSide };
    lockInfo = { time: lockDate, alt: lpos.alt, az: lpos.az, up: lpos.alt > (c.body === 'moon' ? 0.125 : -0.833) };
  }

  // Beregn setup én gang + afgør hvilken side (op/nedgang) der FAKTISK har en brugbar
  // hændelse bag objektet i dag. plan() falder tilbage til modsat side når den valgte
  // ikke findes (fx en lav måne der først går ned efter midnat, uden for dagens scan) —
  // så toggle-knappen skal afspejle den reelle side, og vi forklarer skiftet tydeligt.
  const series = SOL.daySeries(c.date, obj.lat, obj.lon, c.body);
  const cEff = { ...c, ...(lockOverride || {}), fill: effFill };
  const previewPlan = SOL.plan(obj, series, selDist, cEff);
  const effSide = lockOverride ? lockOverride.side : ((previewPlan && previewPlan.usedSide) || c.side);
  const sideFellBack = !lockOverride && previewPlan && previewPlan.usedSide && previewPlan.usedSide !== c.side;

  // Auto-terræn status-tekst (Open-Meteo; debounced/cachet; offline → manuel)
  let elevStatus;
  if (!c.autoElev) elevStatus = 'manuel — indtast selv';
  else {
    const s = SOL.elevState;
    elevStatus = s.status === 'loading' ? '⏳ henter terræn…'
      : s.status === 'offline' ? '⚠ offline — indtast ⛰️ manuelt (auto prøver igen ved næste justering)'
      : s.status === 'ok' ? '✓ ' + s.msg
      : 'auto til — justér for at hente';
  }
  if (elev !== 0) elevStatus += ` · foden ${footAltSel >= 0 ? '+' : ''}${footAltSel.toFixed(2)}° ${footAltSel >= 0 ? 'over' : 'under'} din horisont`;

  const objOpts = stops.map((s, i) => `<option value="${i}" ${c.objIdx === i ? 'selected' : ''}>${esc(s.name)}</option>`).join('')
    + SOL.savedObjects.map((o, i) => `<option value="saved:${i}" ${c.objIdx === 'saved:' + i ? 'selected' : ''}>⭐ ${esc(o.name)}</option>`).join('')
    + `<option value="custom" ${c.objIdx === 'custom' ? 'selected' : ''}>➕ Andet objekt…</option>`;
  const isSaved = typeof c.objIdx === 'string' && c.objIdx.startsWith('saved:');
  const shapeOpts = Object.entries(SOL_SHAPES).map(([k, lbl]) =>
    `<option value="${k}" ${c.shape === k ? 'selected' : ''}>${lbl}</option>`).join('');

  const customFields = c.objIdx === 'custom' ? `
    <div class="sol-row">
      <label>Objekt-navn<input type="text" id="sol-name" value="${esc(c.name || '')}" onchange="SOL.on('name',this.value)" placeholder="fx Rubjerg Knude"></label>
    </div>
    <div class="sol-row two">
      <label>Bredde (lat)<input type="text" inputmode="decimal" id="sol-lat" value="${c.lat ?? ''}" onchange="SOL.on('lat',this.value)" placeholder="56.xxxxx (komma el. punktum)"></label>
      <label>Længde (lon)<input type="text" inputmode="decimal" id="sol-lon" value="${c.lon ?? ''}" onchange="SOL.on('lon',this.value)" placeholder="8.xxxxx (komma el. punktum)"></label>
    </div>
    <div class="sol-row"><div class="sol-dim">${((c.name || '').trim() && c.lat != null && c.lon != null)
      ? '⭐ Gemt — objektet vises i listen næste gang'
      : 'Udfyld navn + koordinater, så gemmes objektet automatisk til næste gang'}</div></div>` : '';
  const savedControls = isSaved
    ? `<div class="sol-row"><button type="button" onclick="SOL.deleteObj('${c.objIdx}')" style="align-self:flex-start;background:rgba(255,80,80,0.12);border:1px solid rgba(255,80,80,0.4);color:#ff8080;font-weight:600;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer">🗑 Slet gemt objekt</button></div>`
    : '';

  const anchorName = { base: 'foden', mid: 'midten', top: 'toppen' }[c.anchor];
  const ohX = c.offX / effFill, ohY = c.offY / effFill;   // forskydning i objekt-højder
  const readX = c.offX === 0 ? 'centreret' : `${ohX > 0 ? '+' : ''}${ohX.toFixed(2)} obj.-højder mod ${c.offX > 0 ? 'højre' : 'venstre'}`;
  const readY = c.offY === 0 ? `ved ${anchorName}` : `${ohY > 0 ? '+' : ''}${ohY.toFixed(2)} obj.-højder ${c.offY > 0 ? 'over' : 'under'} ${anchorName}`;

  let inputsHtml = `
    <div class="sol-card">
      <div class="sol-row"><label>Objekt
        <select id="sol-obj" onchange="SOL.on('objIdx',this.value)">${objOpts}</select></label></div>
      ${customFields}
      ${savedControls}
      <div class="sol-row two">
        <label>Form<select id="sol-shape" onchange="SOL.on('shape',this.value)">${shapeOpts}</select></label>
        <label>Dato<input type="date" id="sol-date" value="${c.date}" onchange="SOL.on('date',this.value)"></label>
      </div>
      <div class="sol-row">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" ${c.lockOn ? 'checked' : ''} onchange="SOL.on('lockOn',this.checked)"> 🕐 Lås tidspunkt
          ${c.lockOn ? `<input type="time" value="${c.lockTime || '20:00'}" onchange="SOL.on('lockTime',this.value)" style="margin-left:4px">` : ''}
        </label>
        ${c.lockOn ? `<div class="sol-dim">Begge himmellegemer vises hvor de FAKTISK står kl. ${c.lockTime} — lodret position + op/nedgang styres af tiden. Skru på 🔭 brændvidde for at få begge i rammen.${lockInfo && !lockInfo.up ? ` <b>OBS:</b> ${c.body === 'moon' ? 'månen' : 'solen'} er under horisonten på dette tidspunkt.` : ''}</div>` : ''}
      </div>
      <div class="sol-row two">
        <label>Objektets højde (m)<input type="number" step="1" min="1" id="sol-h" value="${c.height}" onchange="SOL.on('height',this.value)"></label>
        <label>Objektets bredde (m)<input type="number" step="1" min="1" id="sol-w" value="${c.width}" onchange="SOL.on('width',this.value)"></label>
      </div>
      <div class="sol-row">
        <label>⛰️ Fodens højde over dit standpunkt (m) <span class="sol-dim">+ = fyr på klint, − = du står højt</span>
          <input type="number" step="1" id="sol-elev" value="${elev}" onchange="SOL.on('elev',this.value)"></label>
        <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" ${c.autoElev ? 'checked' : ''} onchange="SOL.on('autoElev',this.checked)"> 🔍 Auto (hent terræn via net)</label>
        <div class="sol-dim">${elevStatus}</div>
      </div>
      <div class="sol-row two">
        <div class="sol-toggle">
          <button class="${c.body === 'sun' ? 'on' : ''}" onclick="SOL.on('body','sun')">☀️ Sol</button>
          <button class="${c.body === 'moon' ? 'on' : ''}" onclick="SOL.on('body','moon')">🌙 Måne</button>
        </div>
        <div class="sol-toggle">
          <button class="${effSide === 'rise' ? 'on' : ''}" ${lockOverride ? 'disabled title="styret af låst tidspunkt"' : ''} onclick="SOL.on('side','rise')">↗ Opgang</button>
          <button class="${effSide === 'set' ? 'on' : ''}" ${lockOverride ? 'disabled title="styret af låst tidspunkt"' : ''} onclick="SOL.on('side','set')">↘ Nedgang</button>
        </div>
      </div>
      ${sideFellBack ? (() => {
        const t = previewPlan.time, hhmm = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
        const dir = SOL.compassName(SOL.position(t, obj.lat, obj.lon, c.body).az);
        const bl = c.body === 'moon' ? 'Månen' : 'Solen';
        const want = c.side === 'set' ? 'nedgang' : 'opgang', got = effSide === 'rise' ? 'opgang' : 'nedgang';
        return `<div class="sol-row"><div style="background:rgba(255,190,70,0.12);border:1px solid rgba(255,190,70,0.4);color:#ffcf87;font-size:12.5px;padding:8px 10px;border-radius:8px;line-height:1.45">
          ℹ️ Ingen brugbar <b>${want}</b> bag ${esc(obj.name)} d. ${c.date} — ${bl.toLowerCase()} er kun lavt nok bag objektet ved <b>${got}</b> (kl. ${hhmm}, ${dir}). Viser ${got}.</div></div>`;
      })() : ''}
      <div class="sol-row">
        <label>📷 Sensor-format <span class="sol-dim">(brændvidde tolkes for denne sensor · telefon → vælg Fuldformat + tast basis×zoom)</span></label>
        <div class="sol-toggle">
          <button class="${(c.sensor || 'm43') === 'm43' ? 'on' : ''}" onclick="SOL.on('sensor','m43')">M4/3</button>
          <button class="${(c.sensor || 'm43') === 'apsc' ? 'on' : ''}" onclick="SOL.on('sensor','apsc')">APS-C</button>
          <button class="${(c.sensor || 'm43') === 'ff' ? 'on' : ''}" onclick="SOL.on('sensor','ff')">Fuldformat</button>
        </div>
      </div>
      <div class="sol-row">
        <label>🔭 Brændvidde: <b>${Math.round(selFocal)} mm</b>${SOL.sensorDims().crop !== 1 ? ` <span class="sol-dim">(≈ ${Math.round(selFocal * SOL.sensorDims().crop)} mm fuldformat-ækv)</span>` : ''}
          <input type="range" min="${SOL.LENS_MIN}" max="${SOL.LENS_MAX}" step="1" value="${Math.round(selFocal)}" oninput="SOL.on('focal',this.value)"></label>
      </div>
      <div class="sol-row">
        <label>📏 Afstand (hvor du står): <b>${dispD(selDist)}</b>
          <input type="range" min="${dMin}" max="${dMax}" step="5" value="${selDist}" oninput="SOL.on('dist',this.value)"></label>
      </div>
      <div class="sol-row">
        <div class="sol-dim">→ Objektet fylder <b>${Math.round(effFill * 100)}%</b> af billedhøjden${effFill > 1 ? ' ⚠ (større end rammen — gå længere væk)' : ''}</div>
      </div>
      <div class="sol-row">
        <label>Forskydningens nulpunkt
          <div class="sol-toggle">
            <button class="${c.anchor === 'base' ? 'on' : ''}" onclick="SOL.on('anchor','base')">Fod</button>
            <button class="${c.anchor === 'mid' ? 'on' : ''}" onclick="SOL.on('anchor','mid')">Midte</button>
            <button class="${c.anchor === 'top' ? 'on' : ''}" onclick="SOL.on('anchor','top')">Top</button>
          </div>
        </label>
      </div>
      <div class="sol-row">
        <label>↔ Vandret forskydning: <b>${c.offX > 0 ? '+' : ''}${Math.round(c.offX * 100)}%</b> <span class="sol-dim">(${readX})</span>
          <input type="range" min="-60" max="60" step="5" value="${Math.round(c.offX * 100)}" oninput="SOL.on('offX',this.value)"></label>
      </div>
      <div class="sol-row">
        <label>↕ Lodret forskydning: <b>${lockOverride ? '🔒 styret af tid' : (c.offY > 0 ? '+' : '') + Math.round(c.offY * 100) + '%'}</b> ${lockOverride ? '' : `<span class="sol-dim">(${readY})</span>`}
          <input type="range" min="-60" max="60" step="5" value="${Math.round((lockOverride ? lockOverride.offY : c.offY) * 100)}" ${lockOverride ? 'disabled' : ''} oninput="SOL.on('offY',this.value)"></label>
      </div>
      <div class="sol-row">
        <label>📐 Kamerahældning: <b>${(+c.tilt || 0) > 0 ? '+' : ''}${+c.tilt || 0}°</b> <span class="sol-dim">(+ = vip op, fanger en høj sol/måne — objektets fod ryger ud i bunden)</span>
          <input type="range" min="-30" max="30" step="1" value="${+c.tilt || 0}" oninput="SOL.on('tilt',this.value)"></label>
      </div>
    </div>`;

  // Validér position
  if (obj.lat == null || obj.lon == null || isNaN(obj.lat) || isNaN(obj.lon)) {
    statusEl.innerHTML = 'Sol & Måne';
    SOL.mount(content, `<div class="sol-wrap">${inputsHtml}
      <div class="sol-note">Indtast objektets koordinater for at beregne.</div></div>`);
    return;
  }

  // Beregn
  const { events, peak } = SOL.dayEvents(c.date, obj.lat, obj.lon, c.body);
  const fmt = t => `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
  const bodyLabel = c.body === 'moon' ? 'Månen' : 'Solen';

  let moonHtml = '';
  if (c.body === 'moon') {
    const noon = new Date(...c.date.split('-').map((v, i) => i === 1 ? v - 1 : +v), 12, 0);
    const il = SOL.moonIllum(noon), ph = SOL.phaseLabel(il.phase);
    moonHtml = `<div class="sol-phase">${ph.emoji} <b>${ph.name}</b> · ${Math.round(il.fraction * 100)}% belyst</div>`;
  }

  // Op-/nedgang + kulmination
  const evName = { rise: c.body === 'moon' ? 'Måneopgang' : 'Solopgang', set: c.body === 'moon' ? 'Månenedgang' : 'Solnedgang' };
  let evHtml = events.length
    ? events.map(e => `<tr><td>${evName[e.type]}</td><td>${fmt(e.t)}</td><td>${Math.round(e.az)}° ${SOL.compassName(e.az)}</td><td>${e.alt.toFixed(1)}°</td></tr>`).join('')
    : `<tr><td colspan="4">${bodyLabel} står ikke op/ned dette døgn.</td></tr>`;
  if (peak.t) evHtml += `<tr><td>Kulmination</td><td>${fmt(peak.t)}</td><td>${Math.round(peak.az)}° ${SOL.compassName(peak.az)}</td><td>${peak.alt.toFixed(1)}°</td></tr>`;

  // Tabel: 7 afstande (geometrisk fordelt over skalaen) ved den VALGTE brændvidde.
  // Objektstørrelsen (fill) er nu et resultat af (brændvidde, afstand), ikke et input.
  const fillAt = D => ((Math.atan((elev + obj.height) / D) - Math.atan(elev / D)) * SOL.R2D) / fovVsel;   // objektfyld ved afstand D
  const planAt = D => SOL.plan(obj, series, D, { ...c, ...(lockOverride || {}), fill: fillAt(D) });
  const distSteps = Array.from({ length: 7 }, (_, i) => Math.round(dMin * Math.pow(dMax / dMin, i / 6)));
  const plans = distSteps.map(planAt);
  const selStepIdx = distSteps.reduce((b, D, i) => Math.abs(D - selDist) < Math.abs(distSteps[b] - selDist) ? i : b, 0);

  const rows = plans.map((r, i) => {
    const D = distSteps[i];
    const dcol = `${dispD(D)}${i === selStepIdx ? ' ◀' : ''}`;
    const mark = i === selStepIdx ? ' style="font-weight:600"' : '';
    if (!r.time) return `<tr class="no"${mark}><td>${dcol}</td><td colspan="4">${r.note || '—'}</td></tr>`;
    const cls = r.ok ? 'ok' : 'no';
    return `<tr class="${cls}"${mark}>
      <td>${dcol}</td>
      <td>${Math.round(fillAt(D) * 100)}%</td>
      <td>${fmt(r.time)}</td>
      <td>${Math.round(r.bodyFrame * 100)}%</td>
      <td>${Math.round(r.bodyVsObj * 100)}%${r.note ? ' · ' + r.note : ''}</td></tr>`;
  }).join('');

  // Preview = dit valgte setup: brændvidde (effFill) + afstand. (cEff/previewPlan beregnet ovenfor.)
  const hasShot = previewPlan && previewPlan.time && previewPlan.gp;
  if (hasShot) previewPlan.secondary = SOL.secondary(obj, previewPlan, cEff);
  if (!c.lockOn && hasShot) SOL._lastTime = previewPlan.time;   // husk sidst beregnede tid (bruges når lås slås til)

  // Auto-terræn: hent højde for objekt + beregnet standpunkt (debounced, cachet, offline-sikkert)
  if (c.autoElev && obj.lat != null && obj.lon != null && previewPlan && previewPlan.gp) {
    SOL.scheduleAutoElev(obj.lat, obj.lon, `${(+obj.lat).toFixed(5)},${(+obj.lon).toFixed(5)}`, previewPlan.gp.lat, previewPlan.gp.lon);
  }

  let widthNote = '';
  if (hasShot) {
    const angH = 2 * Math.atan((+c.width || 8) / (2 * previewPlan.D)) * SOL.R2D;  // objektets vinkelbredde (grader)
    const bodyDiam = SOL.position(previewPlan.time, obj.lat, obj.lon, c.body).diam;
    const pct = Math.round(bodyDiam / angH * 100);
    widthNote = `<div class="sol-dim" style="text-align:center;margin-top:2px">Bredde ~${angH.toFixed(2)}° · ${bodyLabel.toLowerCase()} (${bodyDiam.toFixed(2)}°) fylder ${pct}%${pct > 100 ? ' — bredere end objektet' : ' af bredden'}</div>`;
  }

  // Sekundært himmellegeme: vis altid en linje når det er oppe på det beregnede tidspunkt.
  let secHtml = '';
  if (hasShot && previewPlan.secondary && previewPlan.secondary.up) {
    const s = previewPlan.secondary;
    const emo = s.body === 'moon' ? '🌙' : '☀️';
    const nm = s.body === 'moon' ? 'Månen' : 'Solen';
    const hSide = s.dAz >= 0 ? 'til højre' : 'til venstre';
    const hDeg = Math.abs(s.dAz).toFixed(0);
    const cmp = SOL.compassName(s.az);
    let msg;
    if (s.inFrame) {
      msg = `${emo} <b>${nm} er også i rammen</b> — ${hDeg}° ${hSide}, ${s.alt.toFixed(0)}° oppe (${cmp}).`;
    } else if (s.fitsWidest) {
      msg = `${emo} ${nm} er oppe ${hDeg}° ${hSide} (${cmp}, ${s.alt.toFixed(0)}°) — uden for rammen. Zoom til ~${Math.round(s.focalForBoth)} mm for begge.`;
    } else {
      msg = `${emo} ${nm} er oppe (${cmp}, ${s.alt.toFixed(0)}°), ${s.sep.toFixed(0)}° væk — for langt til begge på ét billede (kræver panorama).`;
    }
    if (s.rareCrescent) msg += ` <b>⭐ Sjælden sol + tynd segl</b> (${Math.round(s.moonFrac * 100)}% belyst, ${s.sep.toFixed(0)}° imellem).`;
    secHtml = `<div class="sol-dim" style="text-align:center;margin-top:4px;line-height:1.4">${msg}</div>`;
  } else if (hasShot && previewPlan.secondary && !previewPlan.secondary.up) {
    // Det andet himmellegeme er UNDER horisonten på det beregnede tidspunkt — forklar
    // hvorfor der ikke ses noget (fx en ung segl der allerede er gået ned).
    const s = previewPlan.secondary;
    const emo = s.body === 'moon' ? '🌙' : '☀️';
    const nm = s.body === 'moon' ? 'Månen' : 'Solen';
    const ev = SOL.dayEvents(c.date, obj.lat, obj.lon, s.body).events;
    const setBefore = ev.filter(e => e.type === 'set' && e.t <= previewPlan.time).sort((a, b) => b.t - a.t)[0];
    const riseAfter = ev.filter(e => e.type === 'rise' && e.t >= previewPlan.time).sort((a, b) => a.t - b.t)[0];
    let when = '';
    if (setBefore) when = ` — gik ned kl. ${fmt(setBefore.t)} (${SOL.compassName(setBefore.az)})`;
    else if (riseAfter) when = ` — står først op kl. ${fmt(riseAfter.t)} (${SOL.compassName(riseAfter.az)})`;
    const frac = s.body === 'moon' ? ` ${Math.round(s.moonFrac * 100)}%-segl,` : '';
    secHtml = `<div class="sol-dim" style="text-align:center;margin-top:4px;line-height:1.4">${emo} ${nm} er under horisonten kl. ${fmt(previewPlan.time)}${when} —${frac} ikke synlig i dette billede.</div>`;
  }
  const previewHtml = hasShot ? `<div class="sol-preview-wrap">
      ${solPreview(cEff, previewPlan)}
      <div class="sol-dim" style="text-align:center;margin-top:6px">${Math.round(selFocal)} mm · stå ${dispD(selDist)} væk · objektet ${Math.round(effFill * 100)}% · kl. ${fmt(previewPlan.time)}</div>
      ${widthNote}
      ${secHtml}
    </div>` : `<div class="sol-note">Med ${Math.round(selFocal)} mm på ${dispD(selDist)} når ${bodyLabel.toLowerCase()} ikke den valgte position (${previewPlan && previewPlan.note ? previewPlan.note : 'uden for rækkevidde'}). Prøv en anden afstand, brændvidde, forskydning eller dato/side.</div>`;
  let mapBtn = '';
  if (hasShot) {
    const best = previewPlan;
    mapBtn = `<div class="sol-dim" style="margin:10px 0 4px">Dit setup: <b>${Math.round(selFocal)} mm</b> · stå <b>${dispD(selDist)}</b> mod <b>${SOL.compassName(best.back)}</b> (${Math.round(best.back)}°) for objektet, kl. <b>${fmt(best.time)}</b>.</div>
      <a class="route-map-btn" target="_blank" rel="noopener"
        href="https://www.google.com/maps/dir/?api=1&destination=${best.gp.lat.toFixed(5)},${best.gp.lon.toFixed(5)}&travelmode=driving">
        🚗 Kør til dette standpunkt</a>`;
  }

  // Sol+måne-mulighedsscanner (alle objekter, 60 dage frem — dato-liste)
  const scanBtnLabel = SOL.oppResults ? '🔄 Scan igen' : `🔭 Find sol+måne-muligheder`;
  let oppHtml = `<h3 class="sol-h3">🌗 Sol + måne samtidig</h3>
    <div class="sol-dim" style="margin-bottom:6px">Scanner alle ${SOL._catalog.length} objekter 60 dage frem for tidspunkter hvor sol og måne <b>begge</b> er oppe i en fotograferbar konstellation — <b>tæt</b> (nær nymåne, tele/normal) og <b>bred</b> (begge lavt over horisonten, vidvinkel/panorama). Tidspunkterne gælder reelt hele Danmark; azimut varierer få grader fra spot til spot.</div>
    <button type="button" onclick="SOL.runScan()" style="background:rgba(90,150,255,0.16);border:1px solid rgba(90,150,255,0.45);color:#bcd4ff;font-weight:600;font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer">${scanBtnLabel}</button>`;
  if (SOL.oppResults) {
    if (!SOL.oppResults.length) {
      oppHtml += `<div class="sol-note">Ingen oplagte sol+måne-vinduer de næste 60 dage fra ${c.date}. De tætte muligheder klynger sig om nymåne, de brede om fuldmåne — prøv en anden startdato.</div>`;
    } else {
      const dmy = ds => { const [y, m, d] = ds.split('-'); return `${d}/${m}`; };
      const oppRows = SOL.oppResults.map((o, i) => {
        const badge = o.kind === 'tight' ? '☀️🌙 tæt' : '↔ bred';
        const star = (o.moonFrac > 0.01 && o.moonFrac < 0.18) ? ' ⭐' : '';
        const sel = i === SOL._pickedOpp;
        return `<tr class="${o.kind === 'tight' ? 'ok' : ''}" style="cursor:pointer" title="Klik: vis standpunkt for ${esc(obj.name)} på kortet" onclick="SOL.applyOpportunity(${i})">
          <td>${sel ? '▶ ' : ''}${dmy(o.date)}</td>
          <td>${fmt(o.t)}</td>
          <td>${badge}${star}</td>
          <td>Sol ${Math.round(o.sunAz)}° ${SOL.compassName(o.sunAz)} (${o.sunAlt.toFixed(0)}°)<br>Måne ${Math.round(o.moonAz)}° ${SOL.compassName(o.moonAz)} (${o.moonAlt.toFixed(0)}°)</td>
          <td>${o.sep.toFixed(0)}° · ${o.lens}</td></tr>`;
      }).join('');
      oppHtml += `<table class="sol-table" style="margin-top:8px"><thead><tr><th>Dato</th><th>Tid</th><th>Type</th><th>Retninger</th><th>Afstand</th></tr></thead><tbody>${oppRows}</tbody></table>
        <div class="sol-dim" style="margin-top:4px">${SOL.oppResults.length} vinduer · <b>⭐</b> = tynd månesegl (&lt;18% belyst) tæt på solen. <b>Klik en række</b> → dato + himmellegeme loades i planlæggeren for <b>${esc(obj.name)}</b>, og standpunktet vises på kortet (📍 + orange linje = stå her; farvet stråle = det andet himmellegemes retning).</div>`;
    }
  }

  statusEl.innerHTML = `Sol & Måne · ${esc(obj.name)}`;
  SOL.mount(content, `<div class="sol-wrap">
    ${inputsHtml}
    ${moonHtml}
    <table class="sol-table sol-events"><thead><tr><th>Hændelse</th><th>Tid</th><th>Retning</th><th>Højde</th></tr></thead><tbody>${evHtml}</tbody></table>
    <h3 class="sol-h3">📐 Dit setup</h3>
    ${previewHtml}
    <table class="sol-table"><thead><tr><th>Afstand</th><th>Objekt fylder</th><th>Tid</th><th>${bodyLabel} i billedet</th><th>${bodyLabel} vs. objekt</th></tr></thead><tbody>${rows}</tbody></table>
    ${mapBtn}
    ${oppHtml}
    <div class="sol-note">Skru på <b>🔭 brændvidde</b> + <b>📏 afstand</b> (og ↔/↕ placering) for at afprøve setups — objektstørrelsen er resultatet. Tabellen viser afstande ved din valgte brændvidde: tættere på = objektet fylder mere + ${bodyLabel.toLowerCase()} en lille prik; længere væk = komprimering (${bodyLabel.toLowerCase()} stor). Tiden er hvornår ${bodyLabel.toLowerCase()} rammer positionen (${c.side === 'set' ? 'på vej ned' : 'på vej op'}). ⛰️-feltet retter for objektets fod-højde over dit standpunkt (fx fyr på klint). Bakker der skjuler den lave ${bodyLabel.toLowerCase()} bag objektet indgår ikke endnu.</div>
  </div>`);
  const secUp = hasShot && previewPlan.secondary && previewPlan.secondary.up;
  SOL.updateMap(obj.lat, obj.lon, hasShot ? previewPlan.gp : null, hasShot ? previewPlan.back : null, dMin, dMax,
    secUp ? previewPlan.secondary.az : null, secUp ? previewPlan.secondary.body : null);
}

SOL.on = function (field, val) {
  if (field === 'objIdx') {
    if (val === 'custom') { this.cfg.objIdx = 'custom'; }
    else if (typeof val === 'string' && val.startsWith('saved:')) {
      this.cfg.objIdx = val;
      const so = this.savedObjects[+val.slice(6)];   // indlæs gemte mål i felterne
      if (so) { this.cfg.name = so.name; this.cfg.lat = so.lat; this.cfg.lon = so.lon; this.cfg.height = so.height; this.cfg.width = so.width; }
    }
    else { this.cfg.objIdx = +val; }
  }
  else if (field === 'height' || field === 'width' || field === 'focal' || field === 'dist' || field === 'tilt') { this.cfg[field] = +val; }
  else if (field === 'elev') { this.cfg.elev = +val || 0; this.cfg.autoElev = false; }   // manuel indtastning slår auto fra
  else if (field === 'autoElev') { this.cfg.autoElev = !!val; if (this.cfg.autoElev) this.elevState.appliedKey = null; }   // slå til → tving et frisk hent
  else if (field === 'fill' || field === 'offX' || field === 'offY') { this.cfg[field] = +val / 100; }
  else if (field === 'lockOn') {
    this.cfg.lockOn = !!val;
    if (this.cfg.lockOn && !this.cfg.lockTime) {          // slå til uden tid → start fra nuværende beregnede tidspunkt
      const t = this._lastTime;
      this.cfg.lockTime = t ? `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` : '20:00';
    }
  }
  else if (field === 'lat' || field === 'lon') {
    // Normalisér: dansk komma → punktum, fjern mellemrum. type="text" giver os den rå
    // streng (type="number" ville have strippet kommaet som tusind-separator → skrald-værdi).
    const s = String(val).trim().replace(/\s+/g, '').replace(',', '.');
    const n = parseFloat(s);
    const limit = field === 'lat' ? 90 : 180;   // afvis værdier uden for gyldigt interval
    this.cfg[field] = (s === '' || !isFinite(n) || Math.abs(n) > limit) ? null : n;
  }
  else { this.cfg[field] = val; }   // objIdx=custom, body, side, anchor, date, name
  this.persistCustom();             // gem "Andet objekt" automatisk når navn + koordinater er sat
  render();
};

// ============================================================
// Skyline-planlægger (🏙️) — "vendt om": standpunktet er LÅST (et
// udsigtspunkt), og vi finder HVORNÅR sol/måne står lavt i sigte-
// retningen mod byens skyline. Genbruger SOL's astronomi-motor
// (position/moonIllum/dest/bearing/compassName) + sensor-tabellen.
// ============================================================

  SPOTS: [

    { id: 25, by: 'Svendborg', vp: 'Christiansminde', lat: 55.0612, lon: 10.6358, az: 264, manual: false, hint: '' },
    { id: 27, by: 'Frederikshavn', vp: 'Pikkerbakken', lat: 57.4215, lon: 10.5312, az: 90, manual: true, hint: 'Hævet punkt, men byen ligger mod N (umuligt lavt); sigt Ø mod hav/havn til solopgang.' },

    { id: 38, by: 'Thisted', vp: 'Limfjorden / Christiansgave', lat: 56.9542, lon: 8.6874, az: 77, manual: false, hint: '' },
    { id: 40, by: 'Korsør', vp: 'Halsskov Odde', lat: 55.3341, lon: 11.1294, az: 127, manual: true, hint: 'Mest Storebæltsbroen (bro-motiv); SØ til solopgang.' },
  ],
  cfg: {
    spotId: 1, aimAz: null, days: 365, body: 'both',
    maxAlt: 8, fullOnly: false, sensor: 'ff', focal: 135, picked: null,
  },
  results: null, _map: null,

  spot() { return this.SPOTS.find(s => s.id === this.cfg.spotId) || this.SPOTS[0]; },
  aim() { return this.cfg.aimAz == null ? this.spot().az : this.cfg.aimAz; },
  _dAz(a, b) { return ((a - b + 540) % 360) - 180; },   // signeret az-forskel a−b i [−180,180]

  // Kernen (vendt om ift. objekt-mode): for hver dag finder vi tidspunktet hvor
  // body's AZIMUT krydser sigtet, og aflæser HØJDEN dér. Lav højde (−1..maxAlt) =
  // sol/måne står lavt over/bag skylinen → fotograferbart vindue.
  findWindows(spot, aim, startDate, days, body, maxAlt) {
    const out = [];
    const [y0, m0, d0] = startDate.split('-').map(Number);
    const bodies = body === 'both' ? ['sun', 'moon'] : [body];
    for (let dd = 0; dd < days; dd++) {
      const base = new Date(y0, m0 - 1, d0 + dd);
      const ds = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-${String(base.getDate()).padStart(2, '0')}`;
      for (const b of bodies) {
        let prevD = null, prevT = null;
        for (let min = 0; min <= 1440; min += 10) {
          const t = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, min, 0);
          const p = SOL.position(t, spot.lat, spot.lon, b);
          const dA = this._dAz(p.az, aim);
          if (prevD != null && Math.sign(dA) !== Math.sign(prevD) && Math.abs(dA) + Math.abs(prevD) < 90) {
            const f = Math.abs(prevD) / (Math.abs(prevD) + Math.abs(dA));      // interpolér krydsningen
            const tc = new Date(prevT.getTime() + f * (t - prevT));
            const pc = SOL.position(tc, spot.lat, spot.lon, b);
            if (pc.alt >= -1 && pc.alt <= maxAlt) {
              const nxt = SOL.position(new Date(tc.getTime() + 60000), spot.lat, spot.lon, b);
              const il = b === 'moon' ? SOL.moonIllum(tc) : null;
              out.push({
                date: ds, t: tc, body: b, az: pc.az, alt: pc.alt, diam: pc.diam,
                rising: nxt.alt >= pc.alt, illum: il ? il.fraction : null, phase: il ? il.phase : null,
              });
            }
          }
          prevD = dA; prevT = t;
        }
      }
    }
    return out.sort((a, b) => a.t - b.t);
  },

  scan() {
    const spot = this.spot(), aim = this.aim();
    const n = new Date();
    const start = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
    this.results = this.findWindows(spot, aim, start, this.cfg.days, this.cfg.body, this.cfg.maxAlt);
    this.cfg.picked = this.results.length ? 0 : null;
    render();
  },
  pick(i) { this.cfg.picked = +i; render(); },

  on(field, val) {
    if (field === 'spot') { this.cfg.spotId = +val; this.cfg.aimAz = null; this._fitted = false; this.scan(); return; }
    if (field === 'body' || field === 'maxAlt' || field === 'days') { this.cfg[field] = field === 'body' ? val : +val; this.scan(); return; }
    if (field === 'resetAim') { this.cfg.aimAz = null; this._fitted = false; this.scan(); return; }
    if (field === 'sensor') { this.cfg.sensor = val; render(); return; }
    if (field === 'focal') { this.cfg.focal = +val; render(); return; }
    if (field === 'fullOnly') { this.cfg.fullOnly = !!val; render(); return; }
    this.cfg[field] = val; render();
  },

  // --- Kort (Leaflet, egen instans; standpunkt fast + træk-bar sigte) ---
  initMap() {
    if (typeof L === 'undefined') return;
    if (this._map) { try { this._map.remove(); } catch (e) {} this._map = null; }
    const el = document.getElementById('sky-map');
    if (!el) return;
    const map = L.map(el, { zoomControl: true }).setView([56, 10], 7);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    const standIcon = L.divIcon({ className: 'sky-pin-stand', html: '📍', iconSize: [24, 24], iconAnchor: [12, 22] });
    const aimIcon = L.divIcon({ className: 'sky-pin-aim', html: '🎯', iconSize: [24, 24], iconAnchor: [12, 12] });
    this._stand = L.marker([56, 10], { icon: standIcon, interactive: false }).addTo(map);
    this._aimLine = L.polyline([], { color: '#ff9d3c', weight: 3, dashArray: '6 5', opacity: 0.9 }).addTo(map);
    this._aimHandle = L.marker([56, 10], { icon: aimIcon, draggable: true }).addTo(map);
    this._aimHandle.on('dragstart', () => { this._dragging = true; });
    this._aimHandle.on('drag', () => this.onAimDrag());
    this._aimHandle.on('dragend', () => { this._dragging = false; this.scan(); });
    this._map = map; this._fitted = false;
  },
  updateMap(spot, aim) {
    const note = document.getElementById('sky-map-note');
    if (!this._map) { if (note) note.textContent = typeof L === 'undefined' ? '🗺️ Kort kræver net ved første indlæsning — resten virker offline.' : ''; return; }
    this._dragCtx = { lat: spot.lat, lon: spot.lon, len: this.AIM_LEN };
    this._stand.setLatLng([spot.lat, spot.lon]);
    const tip = SOL.dest(spot.lat, spot.lon, aim, this.AIM_LEN);
    this._aimLine.setLatLngs([[spot.lat, spot.lon], [tip.lat, tip.lon]]);
    if (!this._dragging) this._aimHandle.setLatLng([tip.lat, tip.lon]);
    if (!this._fitted) {
      this._map.setView([spot.lat, spot.lon], 13);
      this._fitted = true;
      setTimeout(() => { if (this._map) this._map.invalidateSize(); }, 0);
    }
    if (note) note.textContent = `🎯 Træk målet for at dreje sigtelinjen mod skylinen. Sigte: ${Math.round(aim)}° ${SOL.compassName(aim)}.`;
  },
  onAimDrag() {
    const ctx = this._dragCtx;
    if (!ctx || !this._aimHandle) return;
    const p = this._aimHandle.getLatLng();
    const brg = SOL.bearing(ctx.lat, ctx.lon, p.lat, p.lng);
    this.cfg.aimAz = Math.round(brg);
    const tip = SOL.dest(ctx.lat, ctx.lon, brg, ctx.len);        // lås målet til fast radius (perle på snor)
    this._aimHandle.setLatLng([tip.lat, tip.lon]);
    this._aimLine.setLatLngs([[ctx.lat, ctx.lon], [tip.lat, tip.lon]]);
    const ro = document.getElementById('sky-aim-readout');
    if (ro) ro.textContent = `${Math.round(brg)}° ${SOL.compassName(brg)}`;
    const note = document.getElementById('sky-map-note');
    if (note) note.textContent = `🎯 Sigte: ${Math.round(brg)}° ${SOL.compassName(brg)} — slip for at scanne.`;
  },
  mount(content, controlsHtml) {
    let ctrl = document.getElementById('sky-controls');
    if (!ctrl) {
      content.innerHTML = `<div class="sol-layout">
        <div id="sky-controls" class="sol-controls"></div>
        <div class="sol-mapwrap"><div id="sky-map"></div><div class="sol-dim sol-map-note" id="sky-map-note"></div></div>
      </div>`;
      ctrl = document.getElementById('sky-controls');
      this.initMap();
    }
    ctrl.innerHTML = controlsHtml;
  },
};

// Generisk by-silhuet: rækker af bygninger + et spir/antenne, deterministisk mønster.
function skyCity(cx, baseY, halfW, maxH, col) {
  const pat = [0.30, 0.55, 0.42, 0.72, 0.50, 0.85, 0.38, 0.62, 0.48, 0.68, 0.34, 0.58, 0.44, 0.78, 0.40];
  const n = pat.length, bw = (halfW * 2) / n, L = x => x.toFixed(1);
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = cx - halfW + i * bw, h = Math.max(3, pat[i] * maxH);
    s += `<rect x="${L(x)}" y="${L(baseY - h)}" width="${L(bw * 0.92)}" height="${L(h)}" fill="${col}"/>`;
    if (i === 5) s += `<rect x="${L(x + bw * 0.42)}" y="${L(baseY - h - maxH * 0.55)}" width="${L(Math.max(1.5, bw * 0.09))}" height="${L(maxH * 0.55)}" fill="${col}"/>`;   // antenne
    if (i === 10) { const sx = x + bw * 0.46; s += `<polygon points="${L(sx - bw * 0.2)},${L(baseY - h)} ${L(sx)},${L(baseY - h - maxH * 0.5)} ${L(sx + bw * 0.2)},${L(baseY - h)}" fill="${col}"/>`; }   // spir
  }
  return s;
}

// Preview: sol/måne lavt over en by-skyline set fra udsigtspunktet, ved det valgte vindue.
function skyPreview(spot, aim, win, cfg) {
  const dims = SOL.SENSORS[cfg.sensor] || SOL.SENSORS.ff;
  const focal = Math.max(SOL.LENS_MIN, Math.min(SOL.LENS_MAX, cfg.focal || 135));
  const fovV = 2 * Math.atan(dims.h / (2 * focal)) * SOL.R2D;
  const fovH = 2 * Math.atan(dims.w / (2 * focal)) * SOL.R2D;
  const W = 400, H = 300, MX = 60, MY = 55, CW = W + 2 * MX, CH = H + 2 * MY;
  const ppdV = H / fovV, ppdH = W / fovH;                     // px pr. grad
  const hzY = MY + (1 - 0.20) * H;                            // horisont (20% fra bunden = vand/forgrund)
  const isMoon = win.body === 'moon';
  const dAz = ((win.az - aim + 540) % 360) - 180;
  const bx = MX + W / 2 + dAz * ppdH;
  const by = hzY - win.alt * ppdV;
  const br = Math.max(1.5, win.diam / 2 * ppdV);
  const bandH = Math.min(H * 0.5, 1.1 * ppdV);               // skylinens vinkelhøjde ~1.1°
  const cx = MX + W / 2;
  const gid = 'skysky' + (isMoon ? 'm' : 's');
  const sky = isMoon
    ? `<stop offset="0" stop-color="#141f38"/><stop offset="1" stop-color="#2a3a5f"/>`
    : `<stop offset="0" stop-color="#2a3a5e"/><stop offset="0.6" stop-color="#e8894a"/><stop offset="1" stop-color="#ffd089"/>`;
  const bodyFill = isMoon ? '#eef2fb' : '#fff2c4';
  const bodyGlow = isMoon ? 'rgba(200,215,255,0.35)' : 'rgba(255,200,110,0.55)';
  let bodyShape;
  if (!isMoon) {
    bodyShape = `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}" fill="${bodyFill}"/>`;
  } else {
    const il = SOL.moonIllum(win.t), f = Math.max(0, Math.min(1, il.fraction));
    const waxing = ((il.phase % 1) + 1) % 1 < 0.5;
    const rx = (br * Math.abs(1 - 2 * f)).toFixed(1);
    const top = `${bx.toFixed(1)},${(by - br).toFixed(1)}`, bot = `${bx.toFixed(1)},${(by + br).toFixed(1)}`;
    const limbSweep = waxing ? 1 : 0, termSweep = waxing ? (f > 0.5 ? 1 : 0) : (f > 0.5 ? 0 : 1);
    const lit = `<path d="M ${top} A ${br.toFixed(1)} ${br.toFixed(1)} 0 0 ${limbSweep} ${bot} A ${rx} ${br.toFixed(1)} 0 0 ${termSweep} ${top} Z" fill="${bodyFill}"/>`;
    bodyShape = `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${br.toFixed(1)}" fill="#1c2740"/>${lit}`;
  }
  // Spejling i vandet (dæmpet, kun når legemet er over horisonten og reflekset er på lærredet)
  let reflection = '';
  const ry = hzY + (hzY - by);
  if (by < hzY && ry - br < CH) {
    reflection = `<ellipse cx="${bx.toFixed(1)}" cy="${ry.toFixed(1)}" rx="${(br * 0.85).toFixed(1)}" ry="${(br * 1.15).toFixed(1)}" fill="${bodyFill}" opacity="0.22"/>`;
  }
  const silhouette = skyCity(cx, hzY, W * 0.5, bandH, '#0b1016');
  const outTop = by - br < MY;
  const outTag = outTop ? `<text x="${(MX + W / 2).toFixed(0)}" y="${(MY - 8).toFixed(0)}" text-anchor="middle" fill="#ffd089" font-size="13" font-family="sans-serif">${isMoon ? 'Månen' : 'Solen'} står højere end rammen (zoom ud / hæv maks-højde)</text>` : '';
  const dim = 'rgba(6,10,18,0.58)';
  return `<svg class="sol-preview" viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Forhåndsvisning af skyline med sol/måne">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">${sky}</linearGradient></defs>
    <rect x="0" y="0" width="${CW}" height="${hzY.toFixed(1)}" fill="url(#${gid})"/>
    <rect x="0" y="${hzY.toFixed(1)}" width="${CW}" height="${(CH - hzY).toFixed(1)}" fill="${isMoon ? '#0a1220' : '#243247'}"/>
    <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${(br + 6).toFixed(1)}" fill="${bodyGlow}"/>
    ${bodyShape}
    <line x1="0" y1="${hzY.toFixed(1)}" x2="${CW}" y2="${hzY.toFixed(1)}" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    ${reflection}
    ${silhouette}
    <rect x="0" y="0" width="${CW}" height="${MY}" fill="${dim}"/>
    <rect x="0" y="${MY + H}" width="${CW}" height="${CH - MY - H}" fill="${dim}"/>
    <rect x="0" y="${MY}" width="${MX}" height="${H}" fill="${dim}"/>
    <rect x="${MX + W}" y="${MY}" width="${CW - MX - W}" height="${H}" fill="${dim}"/>
    <rect x="${MX}" y="${MY}" width="${W}" height="${H}" fill="none" stroke="#ffffff" stroke-width="2"/>
    ${outTag}
  </svg>`;
}

function renderSky(content, statusEl) {
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = 'Skyline';
  const c = SKY.cfg, spot = SKY.spot(), aim = SKY.aim();
  const fmt = t => `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
  const dmy = ds => { const [y, m, d] = ds.split('-'); return `${d}/${m}`; };
  const dims = SOL.SENSORS[c.sensor] || SOL.SENSORS.ff;
  const selFocal = Math.max(SOL.LENS_MIN, Math.min(SOL.LENS_MAX, c.focal || 135));

  const spotOpts = SKY.SPOTS.map(s => `<option value="${s.id}" ${s.id === c.spotId ? 'selected' : ''}>${esc(s.by)} — ${esc(s.vp)}</option>`).join('');
  const hint = spot.manual ? `<div class="sol-dim" style="margin-top:5px">💡 <b>Sigt-tip:</b> ${esc(spot.hint)}</div>` : '';
  const btn = 'background:rgba(90,150,255,0.16);border:1px solid rgba(90,150,255,0.45);color:#bcd4ff;font-weight:600;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer';

  const controls = `
    <div class="sol-card">
      <div class="sol-row"><label>🏙️ Udsigtspunkt
        <select onchange="SKY.on('spot',this.value)">${spotOpts}</select></label>${hint}</div>
      <div class="sol-row">
        <div class="sol-dim">🎯 Sigte mod skyline: <b id="sky-aim-readout">${Math.round(aim)}° ${SOL.compassName(aim)}</b>
          <button type="button" onclick="SKY.on('resetAim')" style="margin-left:8px;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:12px;padding:4px 9px;border-radius:7px;cursor:pointer">↺ nulstil</button></div>
        <div class="sol-dim" style="margin-top:3px">Træk 🎯-målet på kortet for at dreje retningen mod den del af skylinen du vil have i baggrunden.</div>
      </div>
      <div class="sol-row two">
        <div><label style="margin-bottom:5px">Himmellegeme</label>
          <div class="sol-toggle">
            <button class="${c.body === 'both' ? 'on' : ''}" onclick="SKY.on('body','both')">Begge</button>
            <button class="${c.body === 'sun' ? 'on' : ''}" onclick="SKY.on('body','sun')">☀️ Sol</button>
            <button class="${c.body === 'moon' ? 'on' : ''}" onclick="SKY.on('body','moon')">🌙 Måne</button>
          </div></div>
        <label>📐 Maks. højde over horisont: <b>${c.maxAlt}°</b> <span class="sol-dim">(lavere = tættere på skylinen)</span>
          <input type="range" min="2" max="20" step="1" value="${c.maxAlt}" onchange="SKY.on('maxAlt',this.value)"></label>
      </div>
      ${c.body !== 'sun' ? `<div class="sol-row"><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;flex-direction:row"><input type="checkbox" ${c.fullOnly ? 'checked' : ''} onchange="SKY.on('fullOnly',this.checked)"> 🌕 Kun måne nær fuld (&gt;85% belyst)</label></div>` : ''}
      <div class="sol-row">
        <label>📷 Sensor <span class="sol-dim">(til preview-udsnit · telefon → Fuldformat + basis×zoom)</span></label>
        <div class="sol-toggle">
          <button class="${c.sensor === 'm43' ? 'on' : ''}" onclick="SKY.on('sensor','m43')">M4/3</button>
          <button class="${c.sensor === 'apsc' ? 'on' : ''}" onclick="SKY.on('sensor','apsc')">APS-C</button>
          <button class="${c.sensor === 'ff' ? 'on' : ''}" onclick="SKY.on('sensor','ff')">Fuldformat</button>
        </div>
      </div>
      <div class="sol-row"><label>🔭 Brændvidde: <b>${Math.round(selFocal)} mm</b>${dims.crop !== 1 ? ` <span class="sol-dim">(≈ ${Math.round(selFocal * dims.crop)} mm FF-ækv)</span>` : ''}
        <input type="range" min="${SOL.LENS_MIN}" max="${SOL.LENS_MAX}" step="1" value="${Math.round(selFocal)}" oninput="SKY.on('focal',this.value)"></label></div>
    </div>`;

  let resultsHtml;
  if (SKY.results === null) {
    resultsHtml = `<button type="button" onclick="SKY.scan()" style="${btn}">🔭 Find fotograferbare vinduer</button>
      <div class="sol-note">Scanner ${c.days} dage frem for tidspunkter hvor ${c.body === 'sun' ? 'solen' : c.body === 'moon' ? 'månen' : 'sol/måne'} står lavt (under ${c.maxAlt}°) i sigte-retningen mod skylinen.</div>`;
  } else {
    let rows = SKY.results.slice();
    if (c.fullOnly) rows = rows.filter(r => r.body !== 'moon' || (r.illum != null && r.illum > 0.85));
    const pIdx = (c.picked != null && c.picked < rows.length) ? c.picked : (rows.length ? 0 : null);
    const pick = pIdx != null ? rows[pIdx] : null;

    let previewHtml = '';
    if (pick) {
      const ph = pick.body === 'moon' ? SOL.phaseLabel(pick.phase) : null;
      previewHtml = `<div class="sol-preview-wrap">
        ${skyPreview(spot, aim, pick, c)}
        <div class="sol-dim" style="text-align:center;margin-top:6px;line-height:1.5">${dmy(pick.date)} kl. <b>${fmt(pick.t)}</b> · ${pick.body === 'moon' ? '🌙 Måne ' + ph.emoji + ' ' + Math.round(pick.illum * 100) + '%' : '☀️ Sol'} ${pick.rising ? '↗ opgang' : '↘ nedgang'}<br>${Math.round(pick.az)}° ${SOL.compassName(pick.az)} · <b>${pick.alt.toFixed(1)}°</b> over horisont · ${Math.round(selFocal)} mm</div>
        <a class="route-map-btn" style="margin-top:10px" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${spot.lat.toFixed(5)},${spot.lon.toFixed(5)}&travelmode=driving">🚗 Kør til udsigtspunktet</a>
      </div>`;
    }

    let tableHtml;
    if (!rows.length) {
      tableHtml = `<div class="sol-note">Ingen vinduer under ${c.maxAlt}° i sigtet ${Math.round(aim)}° de næste ${c.days} dage. Prøv at <b>dreje sigtet</b> (træk 🎯 på kortet) eller <b>hæv maks-højden</b>. Peger skylinen mod syd, kan lav sol/måne aldrig stå bag — så vend sigtet mod øst (solopgang) eller vest (solnedgang).</div>`;
    } else {
      const trows = rows.map((r, i) => {
        const emo = r.body === 'moon' ? '🌙' : '☀️';
        const dir = r.rising ? '↗' : '↘';
        const ph = r.body === 'moon' ? SOL.phaseLabel(r.phase) : null;
        const star = (r.body === 'moon' && r.illum > 0.9) ? ' ⭐' : '';
        const moonTxt = r.body === 'moon' ? ` ${ph.emoji} ${Math.round(r.illum * 100)}%${star}` : '';
        return `<tr class="${i === pIdx ? 'pick' : ''} ${r.body === 'moon' ? '' : 'ok'}" style="cursor:pointer" onclick="SKY.pick(${i})">
          <td>${i === pIdx ? '▶ ' : ''}${dmy(r.date)}</td>
          <td>${fmt(r.t)}</td>
          <td>${emo}${dir}${moonTxt}</td>
          <td>${Math.round(r.az)}° ${SOL.compassName(r.az)}</td>
          <td>${r.alt.toFixed(1)}°</td></tr>`;
      }).join('');
      tableHtml = `<div class="sky-results"><table class="sol-table"><thead><tr><th>Dato</th><th>Tid</th><th>Legeme</th><th>Retning</th><th>Højde</th></tr></thead><tbody>${trows}</tbody></table></div>
        <div class="sol-dim" style="margin-top:6px">${rows.length} vinduer · <b>⭐</b> = næsten fuld måne. <b>Klik en række</b> → preview. ↗ = på vej op (solopgang-side), ↘ = på vej ned (solnedgang-side).</div>`;
    }
    resultsHtml = `${previewHtml}<h3 class="sol-h3">📅 Fotograferbare vinduer</h3>${tableHtml}
      <button type="button" onclick="SKY.scan()" style="${btn};margin-top:10px">🔄 Scan igen</button>`;
  }

  statusEl.innerHTML = `Skyline · ${esc(spot.by)}`;
  SKY.mount(content, `<div class="sol-wrap">
    ${controls}
    ${resultsHtml}
    <div class="sol-note">Modellen er <b>vendt om</b> ift. Sol &amp; Måne: her står du fast på udsigtspunktet, og appen finder <b>hvornår</b> sol/måne krydser din sigte-retning lavt over skylinen. Solen rammer en fast retning lavt kun i bestemte uger (op/nedgang vandrer over året); månen rammer stort set hele året. Retninger/afstande er kuraterede startgæt — finjustér sigtet på kortet.</div>
  </div>`);
  SKY.updateMap(spot, aim);
}

    let from, to, label;
    if (c.win === 'next4') { from = new Date(now); to = new Date(now.getTime() + 4 * 3600e3); label = 'de næste 4 timer'; }
    else if (c.win === 'morning') { from = mk(5, 0); to = mk(11, 0); label = 'formiddag (05–11)'; }
    else if (c.win === 'evening') { from = mk(16, 0); to = mk(22, 0); label = 'aften (16–22)'; }
    else { const [fh, fm] = c.from.split(':').map(Number), [th, tm] = c.to.split(':').map(Number); from = mk(fh, fm); to = mk(th, tm); label = `${c.from}–${c.to}`; }
    return { from, to, ds, label, isToday: day === 'today', dayLabel: day === 'tomorrow' ? 'i morgen' : 'i dag' };
  },

  // Hvilke steder skal vurderes: radius-filtrér om din position, eller de valgte byer.
  candidatePlaces(origin) {
    if (this.cfg.mode === 'cities') {
      const sel = new Set(this.cfg.cities);
      return this.PLACES.filter(p => sel.has(p.id));
    }
    if (!origin) return [];
    return this.PLACES.filter(p => haversine(origin.lat, origin.lon, p.lat, p.lon) <= this.cfg.radius);
  },

  // Ét batch-kald til Open-Meteo for alle kandidat-punkter (komma-separeret).
  // Returnerer array i samme rækkefølge som `places`.
  async fetchClouds(places) {
    const lats = places.map(p => p.lat.toFixed(4)).join(',');
    const lons = places.map(p => p.lon.toFixed(4)).join(',');
    // best_match: Open-Meteos blend af bedste tilgængelige model pr. punkt. Vigtigt:
    // den giver skydække-OPDELINGEN (lav/mel/høj) — den høj-opløste metno_nordic gør
    // IKKE (kun total), og opdelingen er hele foto-nuancen. Nøglefri + CORS.
    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${lats}&longitude=${lons}`
      + '&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high'
      + '&timezone=Europe%2FCopenhagen&forecast_days=2';
    const res = await fetch(url);
    if (!res.ok) throw new Error('Open-Meteo svarede ' + res.status);
    let data = await res.json();
    if (!Array.isArray(data)) data = [data];   // enkelt punkt → objekt
    return data;
  },

  // Skydække interpoleret til et konkret tidspunkt (lineært mellem to timer).
  cloudAt(h, date) {
    if (!h || !h.time) return null;
    const parse = s => { const [d, t] = s.split('T'); const [y, mo, da] = d.split('-').map(Number); const [hh, mm] = t.split(':').map(Number); return new Date(y, mo - 1, da, hh, mm, 0).getTime(); };
    const target = date.getTime();
    for (let i = 0; i < h.time.length - 1; i++) {
      const t0 = parse(h.time[i]), t1 = parse(h.time[i + 1]);
      if (target >= t0 && target <= t1) {
        const f = t1 === t0 ? 0 : (target - t0) / (t1 - t0);
        const L = (a, b) => a == null ? b : b == null ? a : a + (b - a) * f;
        return {
          low: L(h.cloud_cover_low[i], h.cloud_cover_low[i + 1]),
          mid: L(h.cloud_cover_mid[i], h.cloud_cover_mid[i + 1]),
          high: L(h.cloud_cover_high[i], h.cloud_cover_high[i + 1]),
          total: L(h.cloud_cover[i], h.cloud_cover[i + 1]),
        };
      }
    }
    return null;
  },

  // Ingen sol-event i vinduet → gennemsnit af skydække over hele vinduet.
  // Robust mod null-komponenter (nogle modeller giver kun total).
  avgWindow(h, from, to) {
    const acc = { low: 0, mid: 0, high: 0, total: 0 }, cnt = { low: 0, mid: 0, high: 0, total: 0 };
    for (let t = from.getTime(); t <= to.getTime(); t += 30 * 60e3) {
      const cl = this.cloudAt(h, new Date(t));
      if (!cl) continue;
      for (const k of ['low', 'mid', 'high', 'total']) if (cl[k] != null) { acc[k] += cl[k]; cnt[k]++; }
    }
    if (!cnt.total) return null;
    const avg = k => cnt[k] ? acc[k] / cnt[k] : null;
    return { low: avg('low'), mid: avg('mid'), high: avg('high'), total: avg('total') };
  },

  // Klarheds-score (0-100) + kategori. Med lav/mel/høj-opdeling straffes lave
  // skyer hårdt og mellemskyer moderat, mens lidt cirrus (høje skyer) giver bonus
  // (foto-farve). Mangler opdelingen (kun total tilgængelig) → simpel total-score
  // uden cirrus-skelnen. split=false markerer sidstnævnte, så UI ikke overfortolker.
  clarityScore(cl) {
    const split = cl.low != null && cl.mid != null && cl.high != null;
    if (!split) {
      const tot = cl.total != null ? cl.total : 0;
      const clarity = Math.max(0, Math.min(100, Math.round(100 - tot)));
      const cat = tot < 15 ? 'clear' : tot < 40 ? 'partial' : 'cloudy';
      return { clarity, cat, split: false };
    }
    const low = cl.low, mid = cl.mid, high = cl.high;
    let clarity = 100 - (low * 1.0 + mid * 0.6 + Math.max(0, high - 30) * 0.3);
    if (low < 25 && high >= 10 && high <= 60) clarity += 8;   // cirrus-bonus
    clarity = Math.max(0, Math.min(100, Math.round(clarity)));
    let cat;
    if (low < 15 && mid < 20 && high < 40) cat = 'clear';
    else if (low < 25 && high >= 15 && mid < 40) cat = 'cirrus';
    else if (low < 45 && mid < 55) cat = 'partial';
    else cat = 'cloudy';
    return { clarity, cat, split: true };
  },

  async scan() {
    this.status = 'loading'; this.error = ''; this.results = null; this._fitted = false; render();
    try {
      const origin = this.originPt();
      const places = this.candidatePlaces(origin);
      if (!places.length) {
        this.results = []; this.win = this.windowRange(); this.status = 'done'; render(); return;
      }
      const win = this.windowRange();
      const data = await this.fetchClouds(places);
      const now = new Date();
      const rows = places.map((p, idx) => {
        const h = data[idx] && data[idx].hourly;
        if (!h) return null;
        // (1) Lys-øjeblik: solop/nedgang der falder inde i vinduet (tættest på midten).
        const ev = SOL.dayEvents(win.ds, p.lat, p.lon, 'sun').events;
        const inWin = ev.filter(e => e.t >= win.from && e.t <= win.to);
        let moment = null, evType = null;
        if (inWin.length) {
          const mid = (win.from.getTime() + win.to.getTime()) / 2;
          inWin.sort((a, b) => Math.abs(a.t - mid) - Math.abs(b.t - mid));
          moment = inWin[0].t; evType = inWin[0].type;
        }
        // Skydække ved øjeblikket (±0, interpoleret) — ellers gennemsnit over vinduet.
        const cl = moment ? this.cloudAt(h, moment) : this.avgWindow(h, win.from, win.to);
        if (!cl) return null;
        const sc = this.clarityScore(cl);
        const dist = origin ? haversine(origin.lat, origin.lon, p.lat, p.lon) : null;
        // (3) Kan jeg nå det? — kun i dag + kun hvis øjeblikket ligger frem i tid.
        let reach = null;
        if (moment && win.isToday) {
          const minsUntil = (moment - now) / 60000;
          const driveMin = dist != null ? dist / 70 * 60 : 0;   // ~70 km/t fugleflugt-antagelse
          reach = minsUntil < 0 ? 'past' : (driveMin + 15 <= minsUntil ? 'ok' : (driveMin <= minsUntil ? 'tight' : 'late'));
        }
        // (2) Fri horisont mod solretningen (kendt for kyststeder).
        let horizon = 'unknown';
        if (evType) {
          if (p.open === 'both') horizon = 'ok';
          else if (evType === 'set' && p.open === 'W') horizon = 'ok';
          else if (evType === 'rise' && p.open === 'E') horizon = 'ok';
          else if (p.open) horizon = 'side';
        }
        return { p, dist, moment, evType, cl, cat: sc.cat, clarity: sc.clarity, split: sc.split, reach, horizon };
      }).filter(Boolean);
      // Rang: kategori-prioritet → afstand → klarhed.
      const pri = { clear: 0, cirrus: 1, partial: 2, cloudy: 3 };
      rows.sort((a, b) => (pri[a.cat] - pri[b.cat]) || ((a.dist == null ? 1e9 : a.dist) - (b.dist == null ? 1e9 : b.dist)) || (b.clarity - a.clarity));
      this.results = rows; this.win = win; this.updatedAt = now;
      this.cfg.picked = rows.length ? 0 : null;
      this.status = 'done'; render();
    } catch (e) {
      this.status = 'error'; this.error = String(e && e.message || e); render();
    }
  },

  pick(i) { this.cfg.picked = +i; render(); },

  on(field, val) {
    const c = this.cfg;
    if (field === 'toggleCity') { const id = +val; const i = c.cities.indexOf(id); if (i >= 0) c.cities.splice(i, 1); else c.cities.push(id); render(); return; }
    if (field === 'radius') { c.radius = +val; render(); return; }
    c[field] = val; render();
  },

  initMap() {
    if (typeof L === 'undefined') return;
    if (this._map) { try { this._map.remove(); } catch (e) {} this._map = null; }
    const el = document.getElementById('clear-map');
    if (!el) return;
    const map = L.map(el, { zoomControl: true }).setView([56.2, 10.5], 7);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    this._map = map; this._layer = L.layerGroup().addTo(map); this._fitted = false;
  },
  updateMap() {
    const note = document.getElementById('clear-map-note');
    if (!this._map) { if (note) note.textContent = typeof L === 'undefined' ? '🗺️ Kort kræver net ved første indlæsning.' : ''; return; }
    this._layer.clearLayers(); this._markers = [];
    const o = this.originPt();
    if (o) this._layer.addLayer(L.marker([o.lat, o.lon], { icon: L.divIcon({ className: 'clear-pin-orig', html: '📍', iconSize: [24, 24], iconAnchor: [12, 22] }), interactive: false }));
    const rows = this.results || [];
    const pts = [];
    rows.forEach((r, i) => {
      const info = this.CAT[r.cat];
      const m = L.circleMarker([r.p.lat, r.p.lon], {
        radius: r.cat === 'cloudy' ? 6 : 9, color: '#0b1016', weight: 1,
        fillColor: info.c, fillOpacity: r.cat === 'cloudy' ? 0.5 : 0.9,
      });
      const evTxt = r.moment ? `${this.fmt(r.moment)} · ${r.evType === 'set' ? 'solnedgang' : r.evType === 'rise' ? 'solopgang' : ''}` : '';
      m.bindPopup(`<b>${esc(r.p.name)}</b><br>${info.badge} ${info.label}${evTxt ? '<br>' + evTxt : ''}${r.dist != null ? '<br>' + formatDist(r.dist) : ''}`);
      m.on('click', () => this.pick(i));
      this._layer.addLayer(m); this._markers.push(m);
      pts.push([r.p.lat, r.p.lon]);
    });
    if (o) pts.push([o.lat, o.lon]);
    if (pts.length && !this._fitted) {
      try { this._map.fitBounds(pts, { padding: [30, 30], maxZoom: 11 }); } catch (e) {}
      this._fitted = true;
      setTimeout(() => { if (this._map) this._map.invalidateSize(); }, 0);
    }
    const pk = this.cfg.picked;
    if (pk != null && this._markers[pk]) { const ll = this._markers[pk].getLatLng(); this._map.panTo(ll); this._markers[pk].openPopup(); }
    if (note) note.textContent = `Grønne = klart, gule = delvist, grå = skyet. Klik en prik for detaljer.`;
  },
  mount(content, controlsHtml) {
    let ctrl = document.getElementById('clear-controls');
    if (!ctrl) {
      content.innerHTML = `<div class="sol-layout">
        <div id="clear-controls" class="sol-controls"></div>
        <div class="sol-mapwrap"><div id="clear-map"></div><div class="sol-dim sol-map-note" id="clear-map-note"></div></div>
      </div>`;
      ctrl = document.getElementById('clear-controls');
      this.initMap();
    }
    ctrl.innerHTML = controlsHtml;
  },
};

function renderClear(content, statusEl) {
  const lbl = document.getElementById('activeFilterLabel'); if (lbl) lbl.textContent = 'Skyfri';
  const c = CLEAR.cfg, origin = CLEAR.originPt();
  const btn = 'background:rgba(90,150,255,0.16);border:1px solid rgba(90,150,255,0.45);color:#bcd4ff;font-weight:700;font-size:15px;padding:12px 14px;border-radius:9px;cursor:pointer;width:100%';
  const seg = (field, val, cur, label) => `<button class="${cur === val ? 'on' : ''}" onclick="CLEAR.on('${field}','${val}')">${label}</button>`;

  // --- Søge-område: radius eller valgte byer ---
  let areaHtml;
  if (c.mode === 'radius') {
    const originTxt = origin ? `${state.gpsName || state.manualTown || 'din position'}` : '⚠️ ingen position endnu';
    const n = origin ? CLEAR.PLACES.filter(p => haversine(origin.lat, origin.lon, p.lat, p.lon) <= c.radius).length : 0;
    areaHtml = `<div class="sol-row"><label>📏 Radius (fugleflugt) fra ${esc(originTxt)}: <b>${c.radius} km</b>
      <input type="range" min="25" max="250" step="5" value="${c.radius}" oninput="CLEAR.on('radius',this.value)"></label>
      <div class="sol-dim" style="margin-top:4px">${origin ? n + ' kandidat-steder i radius' : 'Tillad position, eller vælg byer i stedet.'}</div></div>`;
  } else {
    const list = [...CLEAR.PLACES]
      .map(p => ({ p, d: origin ? haversine(origin.lat, origin.lon, p.lat, p.lon) : null }))
      .sort((a, b) => a.d == null ? a.p.name.localeCompare(b.p.name, 'da') : a.d - b.d)
      .map(({ p, d }) => `<label class="cl-check"><input type="checkbox" ${c.cities.includes(p.id) ? 'checked' : ''} onchange="CLEAR.on('toggleCity','${p.id}')"> ${esc(p.name)}${d != null ? `<span class="cl-cdist">${formatDist(d)}</span>` : ''}</label>`).join('');
    areaHtml = `<div class="sol-row"><label>🏙️ Vælg byer (${c.cities.length} valgt)</label>
      <div class="cl-checks">${list}</div></div>`;
  }

  const controls = `
    <div class="sol-card">
      <div class="sol-row"><label style="margin-bottom:5px">Søge-område</label>
        <div class="sol-toggle">${seg('mode', 'radius', c.mode, '📍 Radius')}${seg('mode', 'cities', c.mode, '🏙️ Byer')}</div></div>
      ${areaHtml}
      <div class="sol-row"><label style="margin-bottom:5px">Tidsrum</label>
        <div class="sol-toggle">${seg('win', 'next4', c.win, 'Næste 4t')}${seg('win', 'morning', c.win, 'Formiddag')}${seg('win', 'evening', c.win, 'Aften')}${seg('win', 'custom', c.win, 'Selv')}</div></div>
      ${c.win === 'custom' ? `<div class="sol-row two">
        <label>Fra<input type="time" value="${c.from}" onchange="CLEAR.on('from',this.value)"></label>
        <label>Til<input type="time" value="${c.to}" onchange="CLEAR.on('to',this.value)"></label></div>` : ''}
      ${c.win !== 'next4' ? `<div class="sol-row"><label style="margin-bottom:5px">Dag</label>
        <div class="sol-toggle">${seg('day', 'today', c.day, 'I dag')}${seg('day', 'tomorrow', c.day, 'I morgen')}</div></div>` : ''}
      <div class="sol-row"><button type="button" onclick="CLEAR.scan()" style="${btn}">☁️ Find skyfrit område</button></div>
    </div>`;

  // --- Resultater ---
  let resultsHtml = '';
  if (CLEAR.status === 'loading') {
    resultsHtml = `<div class="sol-note">🛰️ Henter skyprognose fra Open-Meteo…</div>`;
  } else if (CLEAR.status === 'error') {
    resultsHtml = `<div class="sol-note">⚠️ Kunne ikke hente prognose (${esc(CLEAR.error)}). Denne funktion kræver net. <b>Prøv igen.</b></div>`;
  } else if (CLEAR.results && CLEAR.win) {
    const rows = CLEAR.results;
    if (!rows.length) {
      resultsHtml = `<div class="sol-note">${c.mode === 'radius' && !origin ? 'Ingen position fundet — tillad lokation eller skift til by-valg.' : 'Ingen kandidat-steder i søgningen. Øg radius eller vælg byer.'}</div>`;
    } else {
      const upd = CLEAR.updatedAt ? CLEAR.fmt(CLEAR.updatedAt) : '';
      const top = rows.slice(0, 6).map((r, i) => {
        const info = CLEAR.CAT[r.cat];
        const evTxt = r.moment
          ? `${r.evType === 'set' ? '🌇 Solnedgang' : r.evType === 'rise' ? '🌅 Solopgang' : ''} kl. <b>${CLEAR.fmt(r.moment)}</b>`
          : `Vurderet over ${esc(CLEAR.win.label)}`;
        const tags = [];
        tags.push(`<span class="cl-tag">Klarhed ${r.clarity}%</span>`);
        if (r.horizon === 'ok') tags.push(`<span class="cl-tag ok">✓ fri horisont mod solen</span>`);
        else if (r.horizon === 'side') tags.push(`<span class="cl-tag">åben mod modsat side</span>`);
        else if (r.horizon === 'unknown' && r.evType) tags.push(`<span class="cl-tag">horisont ikke vurderet</span>`);
        if (r.reach === 'ok') tags.push(`<span class="cl-tag ok">✓ kan nås</span>`);
        else if (r.reach === 'tight') tags.push(`<span class="cl-tag warn">⚠ stramt</span>`);
        else if (r.reach === 'late') tags.push(`<span class="cl-tag bad">✗ når det ikke</span>`);
        else if (r.reach === 'past') tags.push(`<span class="cl-tag">– allerede forbi</span>`);
        const nav = `https://www.google.com/maps/dir/?api=1&destination=${r.p.lat.toFixed(5)},${r.p.lon.toFixed(5)}&travelmode=driving`;
        return `<div class="cl-card ${i === c.picked ? 'pick' : ''}" onclick="CLEAR.pick(${i})">
          <span class="cl-dot" style="background:${info.c}"></span>
          <div class="cl-body">
            <div class="cl-name">${esc(r.p.name)} ${r.dist != null ? `<span class="sol-dim" style="font-weight:600">· ${formatDist(r.dist)}</span>` : ''}</div>
            <div class="cl-meta">${info.badge} ${info.label} · ${evTxt}<br>${r.split ? `Skyer: lav ${Math.round(r.cl.low)}% · mel ${Math.round(r.cl.mid)}% · høj ${Math.round(r.cl.high)}%` : `Samlet skydække ${Math.round(r.cl.total)}%`}</div>
            <div class="cl-tags">${tags.join('')}</div>
            <a class="route-map-btn" style="margin-top:10px;padding:9px" target="_blank" rel="noopener" href="${nav}" onclick="event.stopPropagation()">🚗 Kør hertil</a>
          </div>
        </div>`;
      }).join('');
      const legend = `<div class="cl-legend">
        <span><i style="background:${CLEAR.CAT.clear.c}"></i>Helt klart</span>
        <span><i style="background:${CLEAR.CAT.cirrus.c}"></i>Klart + cirrus</span>
        <span><i style="background:${CLEAR.CAT.partial.c}"></i>Delvist</span>
        <span><i style="background:${CLEAR.CAT.cloudy.c}"></i>Skyet</span></div>`;
      resultsHtml = `<div class="sol-dim" style="margin:2px 0 10px">${rows.length} steder vurderet · ${esc(CLEAR.win.dayLabel)}, ${esc(CLEAR.win.label)} · opdateret kl. ${upd}</div>
        <h3 class="sol-h3">Nærmeste klare steder</h3>${top}${legend}`;
    }
  } else {
    resultsHtml = `<div class="sol-note">Vælg område + tidsrum og tryk <b>Find skyfrit område</b>. Appen finder solop-/nedgangen i dit tidsrum og viser hvor det er klart dér — rangeret efter afstand.</div>`;
  }

  statusEl.innerHTML = 'Skyfri-finder';
  CLEAR.mount(content, `<div class="sol-wrap">
    ${controls}
    ${resultsHtml}
    <div class="sol-note">Prognose: <b>Open-Meteo</b> (bedste tilgængelige model pr. sted). Skydække vurderes ved selve solop-/nedgangen i dit tidsrum. Lave skyer straffes, mens lidt cirrus giver bonus (farvet himmel). Afstand = fugleflugt; "kan nås" antager ~70 km/t. Pålideligt i dag/i morgen. Kræver net.</div>
  </div>`);
  CLEAR.updateMap();
}

function render() {
  const statusEl = document.getElementById('status');
  const content = document.getElementById('content');
  renderTagFilters();

  // Ruteforslag-view (uafhængigt af items/flickr)
  if (state.view === 'ruter') { renderRuter(content, statusEl); return; }

  // Sol & Måne-planlægger (uafhængigt af items/flickr)
  if (state.view === 'sol') { renderSol(content, statusEl); return; }

  // Skyline-planlægger (uafhængigt af items/flickr)
  if (state.view === 'sky') { renderSky(content, statusEl); return; }

  // Skyfri-finder (uafhængigt af items/flickr)
  if (state.view === 'clear') { renderClear(content, statusEl); return; }

  // Vestkysten "mangler foto" (uafhængigt af items/flickr)
  if (state.view === 'foto') { renderFoto(content, statusEl); return; }

  // Fase 1: landmark-overblik som standard-view (falder tilbage til feed hvis ingen grupper)
  if (state.view === 'overblik' && state.flickrLandmarkMode && state.flickr.length) {
    const groups = buildLandmarkGroups();
    if (groups.length) { renderOverview(content, statusEl, groups); return; }
  }

  const filtered = getFilteredItems();
  const tasteTag = hasTaste() ? ` &middot; <span style="color:#ff7fb0">✨ tilpasset til dig</span>` : '';
  statusEl.innerHTML = `<span class="count">${filtered.length}</span> af ${state.items.length} steder${tasteTag}`;
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = filterLabel();

  if (filtered.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <div class="icon">📷</div>
        <p>Ingen fotospots${state.filter !== 'all' ? ' i dette filter' : ''}</p>
        <p class="sub">Tilføj lokationer og inspiration via Admin (tandhjulet)</p>
      </div>`;
    return;
  }

  const backBar = state.filter.startsWith('lm:')
    ? `<button class="back-bar" onclick="backToOverview()">← Overblik</button>` : '';
  content.innerHTML = backBar + '<div class="cards">' + filtered.map(item => {
    const isLoc = item.type === 'location';
    const isFlickr = item.type === 'flickr';
    const icon = isLoc ? '📍' : isFlickr ? '📷' : '📸';
    const badge = isLoc ? '<span class="card-badge loc">📍 Lokation</span>'
      : isFlickr ? `<span class="card-badge flickr">${item.catLabel ? esc(item.catLabel) : '📷 Flickr'}</span>`
      : '<span class="card-badge insp">📸 Inspiration</span>';
    const distHtml = item.dist !== null ? `<span class="card-distance">${formatDist(item.dist)}</span>` : '';
    const imgHtml = item.photo
      ? `<img src="${item.photo}" alt="${esc(item.name)}" loading="lazy">`
      : `<div class="placeholder">${icon}</div>`;
    const tagCls = isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp';

    const photoCount = item.photos.length;
    const countBadge = photoCount > 1 ? `<span style="position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:12px;font-size:11px;color:#fff;">${photoCount} billeder</span>` : '';
    const inHiddenView = state.filter === 'hidden';
    const liked = state.liked.has(item.id);
    const likeBtn = `<button class="act-btn like ${liked ? 'on' : ''}" onclick="event.stopPropagation();likeItem('${item.id}')">${liked ? '❤️' : '🤍'} Synes om</button>`;
    const hideBtn = inHiddenView
      ? `<button class="act-btn restore" onclick="event.stopPropagation();unhideItem('${item.id}')">↩ Vis igen</button>`
      : `<button class="act-btn" onclick="event.stopPropagation();askHide('${item.id}')">✕ Skjul</button>`;
    const shownTags = isFlickr ? (item.flickrTags || []) : item.tags;

    return `
      <div class="card" onclick="openDetail('${item.id}')" style="cursor:pointer">
        <div class="card-img">
          ${imgHtml}
          ${badge}
          ${distHtml}
          ${countBadge}
        </div>
        <div class="card-body">
          <div class="card-name">${esc(item.name)}</div>
          ${item.landmark ? `<div class="card-landmark">📍 ${esc(item.landmark)}</div>` : ''}
          <div class="card-location">${icon} ${esc(item.subtitle)}</div>
          ${item.notes ? `<div class="card-notes">${esc(item.notes)}</div>` : ''}
          ${shownTags.length ? `<div class="card-tags">${shownTags.slice(0, 6).map(t => `<span class="card-tag ${tagCls}">${esc(t)}</span>`).join('')}${shownTags.length > 6 ? `<span class="card-tag ${tagCls}">+${shownTags.length - 6}</span>` : ''}</div>` : ''}
          <div class="card-actions">${likeBtn}${hideBtn}</div>
        </div>
      </div>`;
  }).join('') + '</div>';
}

  ).join('');
