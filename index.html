<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FotoScout</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FotoScout">
<meta name="description" content="Personlig foto-planlægger til Vestkysten">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-bright: #ffffff;
    --border: #30363d;
    --pin: #4a7fff;
    --pin-bg: rgba(74,127,255,0.12);
    --cam: #f0a030;
    --cam-bg: rgba(240,160,48,0.12);
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,17,23,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .logo { font-size: 22px; font-weight: 800; }
  .logo span { color: var(--cam); }

  .location-name {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .gps-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3fb950;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .filters::-webkit-scrollbar { display: none; }

  /* Burger-menu */
  .filter-bar { display: flex; }
  .menu-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .menu-btn .burger { font-size: 18px; line-height: 1; }
  .filters-panel {
    display: none;
    margin-top: 10px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .filters-panel.open { display: block; }

  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pill.active { background: var(--cam); color: var(--bg); border-color: var(--cam); }
  .pill.active-loc { background: var(--pin); color: #fff; border-color: var(--pin); }
  .pill.active-insp { background: var(--cam); color: var(--bg); border-color: var(--cam); }

  /* Status */
  .status {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-dim);
  }

  .status .count { color: var(--cam); font-weight: 700; }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 20px;
    gap: 16px;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--cam);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { font-size: 14px; color: var(--text-dim); }

  /* Cards */
  .cards {
    padding: 8px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.15s;
  }

  .card:active { transform: scale(0.98); }

  .card-img {
    position: relative;
    width: 100%;
    height: 200px;
    background: #0a0e14;
    overflow: hidden;
  }

  .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-img .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 48px;
    opacity: 0.15;
  }

  .card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 3px 10px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-badge.loc { background: var(--pin); }
  .card-badge.insp { background: var(--cam); }

  .card-distance {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-bright);
  }

  .card-body { padding: 14px 16px 16px; }

  .card-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 4px;
  }

  .card-location {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-notes {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .card-tag {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }

  .card-tag.loc { background: var(--pin-bg); color: var(--pin); }
  .card-tag.insp { background: var(--cam-bg); color: var(--cam); }

  .card-footer { display: flex; gap: 8px; }

  .card-footer a {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-nav {
    background: var(--pin);
    color: #fff;
  }

  .btn-nav:active { background: #3a6fee; }

  .btn-nav.insp-nav {
    background: var(--cam);
    color: var(--bg);
  }

  .btn-nav.insp-nav:active { background: #e09020; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }

  .empty .icon { font-size: 48px; margin-bottom: 16px; }
  .empty p { font-size: 15px; line-height: 1.6; }
  .empty .sub { font-size: 13px; margin-top: 8px; }

  /* Detail overlay */
  .detail-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 200;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .detail-overlay.open { display: block; }

  .detail-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13,17,23,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail-back {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .detail-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-bright);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .detail-badge {
    padding: 3px 10px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .detail-badge.loc { background: var(--pin); }
  .detail-badge.insp { background: var(--cam); }

  /* Gallery */
  .gallery {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .gallery::-webkit-scrollbar { display: none; }

  .gallery-img {
    flex: 0 0 100%;
    scroll-snap-align: start;
    height: 280px;
    background: #0a0e14;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gallery-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .gallery-placeholder {
    font-size: 64px;
    opacity: 0.15;
  }

  .gallery-counter {
    text-align: center;
    padding: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .gallery-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 8px;
  }

  .gallery-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }

  .gallery-dot.active { background: var(--cam); }

  .detail-body {
    padding: 20px 16px 100px;
  }

  .detail-location {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .detail-dist {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    margin-left: 8px;
  }

  .detail-notes {
    font-size: 15px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .detail-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .detail-tag {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }

  .detail-tag.loc { background: var(--pin-bg); color: var(--pin); }
  .detail-tag.insp { background: var(--cam-bg); color: var(--cam); }

  .detail-nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    color: #fff;
  }

  .detail-nav-btn.loc { background: var(--pin); }
  .detail-nav-btn.insp { background: var(--cam); color: var(--bg); }

  /* Admin link */
  .admin-link {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    text-decoration: none;
    z-index: 99;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  /* Flickr */
  .card-badge.flickr { background: #ff5c9e; }
  .detail-badge.flickr { background: #ff5c9e; }
  .card-tag.flickr, .detail-tag.flickr { background: rgba(255,92,158,0.12); color: #ff7fb0; }
  .detail-nav-btn.flickr { background: #ff5c9e; color: #fff; }
  .pill.flickr-on { background: #ff5c9e; color: #fff; border-color: #ff5c9e; }
  .flickr-credit { font-size: 12px; color: var(--text-dim); margin: -4px 0 14px; }
  .flickr-credit a { color: #ff7fb0; text-decoration: none; font-weight: 600; }
  .card-landmark { font-size: 13px; font-weight: 700; color: #ff7fb0; margin: 2px 0 4px; }
  .detail-landmark { font-size: 16px; font-weight: 700; color: #ff7fb0; margin: 8px 0 4px; }
  /* Fase 1: landmark-overblik */
  .overview { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 24px; }
  .lm-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
  .lm-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .lm-rank { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: #ff5c9e; color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .lm-titles { min-width: 0; }
  .lm-name { font-size: 16px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lm-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .lm-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .lm-strip img { width: 100%; height: 80px; object-fit: cover; border-radius: 10px; cursor: pointer; background: var(--bg); }
  .lm-actions { display: flex; gap: 8px; margin-top: 10px; }
  .lm-btn { flex: 1; text-align: center; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
  .lm-btn.nav { background: #ff5c9e; color: #fff; border-color: #ff5c9e; }
  .back-bar { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 12px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer; }
  .town-picker-wrap { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-bottom: 10px; }
  .town-picker-lbl { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .town-picker { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; font-weight: 600; }

  /* Synes om / skjul / gendan */
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .act-btn {
    flex: 1; padding: 8px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .act-btn.like.on { color: #ff5c9e; border-color: rgba(255,92,158,0.45); }
  .act-btn.restore { color: #3fb950; border-color: rgba(63,185,80,0.45); }
  .detail-actions { display: flex; gap: 10px; margin-top: 10px; }
  .detail-act-btn {
    flex: 1; padding: 12px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .detail-act-btn.like.on { color: #ff5c9e; border-color: rgba(255,92,158,0.45); }

  /* Begrundelses-ark */
  .sheet-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 300;
    align-items: flex-end; justify-content: center;
  }
  .sheet-overlay.open { display: flex; }
  .sheet {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    width: 100%; max-width: 520px;
    padding: 16px 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
  }
  .sheet-title { font-size: 15px; font-weight: 700; color: var(--text-bright); padding: 6px 4px 10px; }
  .sheet-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; padding: 14px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-size: 15px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .sheet-btn small { font-size: 12px; font-weight: 400; color: var(--text-dim); }
  .sheet-cancel {
    width: 100%; padding: 13px; border-radius: 12px; margin-top: 4px;
    background: transparent; border: none; color: var(--text-dim);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
.sol-layout { display: flex; gap: 16px; align-items: flex-start; }
.sol-controls { flex: 1 1 55%; min-width: 0; }
.sol-mapwrap { flex: 1 1 45%; position: sticky; top: 12px; }
#sol-map { height: 460px; width: 100%; border-radius: 8px; z-index: 0; background: var(--card); }
.sol-pin-obj, .sol-pin-stand { font-size: 20px; text-align: center; line-height: 1; background: none; border: none; }
.sol-map-note { margin-top: 6px; }
@media (max-width: 860px) {
  .sol-layout { flex-direction: column; }
  .sol-mapwrap { position: static; width: 100%; }
  #sol-map { height: 300px; }
}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<body>

<div class="header">
  <div class="header-top">
    <div class="logo">Foto<span>Scout</span></div>
    <div class="location-name">
      <span class="gps-dot"></span>
      <span id="locationName">Finder position...</span>
    </div>
  </div>
  <div class="filter-bar">
    <button class="menu-btn" id="menuBtn" aria-label="Filtre">
      <span class="burger">&#9776;</span><span id="activeFilterLabel">Alle</span>
    </button>
  </div>
  <div class="filters-panel" id="filtersPanel">
    <div class="filters" id="filters">
      <button class="pill active" data-filter="all">Alle</button>
    </div>
  </div>
</div>

<div class="status" id="status">Indlæser...</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Finder din position...</div>
  </div>
</div>

<!-- Detail view -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-header">
    <button class="detail-back" onclick="closeDetail()">&#8592;</button>
    <div class="detail-title" id="detailTitle"></div>
    <span class="detail-badge" id="detailBadge"></span>
  </div>
  <div id="detailContent"></div>
</div>

<!-- Begrundelses-ark ved skjul -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-title">Hvorfor skjule billedet?</div>
    <button class="sheet-btn" onclick="confirmHide('quality')"><span>👎 Dårlig kvalitet</span><small>nedprioriterer fotografen</small></button>
    <button class="sheet-btn" onclick="confirmHide('motif')"><span>🚫 Ikke relevant motiv</span><small>nedprioriterer motivet (hvis billedet er tagget)</small></button>
    <button class="sheet-btn" onclick="confirmHide('thisonly')"><span>🙈 Skjul kun denne</span><small>påvirker ikke din smags-profil</small></button>
    <button class="sheet-cancel" onclick="closeSheet()">Annullér</button>
  </div>
</div>

<a href="#" onclick="event.preventDefault();location.reload(true);" class="admin-link" title="Opdatér" style="font-size:24px;color:var(--text-dim);">&#x21bb;</a>

<style>
/* --- Ruteforslag --- */
.route-wrap { padding: 12px 16px 40px; }
.route-intro { color: var(--text-dim); font-size: 13px; line-height: 1.55; margin-bottom: 16px; }
.route-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; cursor: pointer; transition: transform 0.15s; }
.route-card:active { transform: scale(0.98); }
.route-card h3 { font-size: 18px; color: var(--text-bright); margin: 0 0 6px; }
.route-card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0 0 10px; }
.route-meta { display: flex; gap: 14px; font-size: 12px; color: var(--pin); flex-wrap: wrap; }
.route-back { background: none; border: none; color: var(--pin); font-size: 15px; padding: 4px 0 12px; cursor: pointer; }
.route-head h2 { font-size: 20px; color: var(--text-bright); margin: 0 0 4px; }
.route-head p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0 0 14px; }
.route-map-btn { display: block; text-align: center; background: var(--pin); color: #fff; font-weight: 700; padding: 14px; border-radius: var(--radius); text-decoration: none; margin: 0 0 8px; }
.route-map-note { font-size: 12px; color: var(--text-dim); text-align: center; margin: 0 0 20px; }
.route-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
.rt-timeline { position: relative; }

// Indlæs skjulte (id -> begrundelse); migrér gammelt format (kun id'er)
function loadHidden() {
  const m = new Map();
  try {
    for (const e of JSON.parse(localStorage.getItem('fotoscout-hidden') || '[]')) {
      if (Array.isArray(e)) m.set(e[0], e[1] || 'thisonly');
      else m.set(e, 'thisonly');
    }
  } catch {}
  return m;
}
const NEAR_THRESHOLD_KM = 15;    // hvor tæt på en by, før Flickr aktiveres
const FLICKR_CACHE_HOURS = 24;   // cache-levetid

const state = {
  lat: null,
  lon: null,

  towns: [],
  flickr: [],
  flickrEnabled: localStorage.getItem('fotoscout-flickr') !== 'off',

  liked: new Set(JSON.parse(localStorage.getItem('fotoscout-liked') || '[]')),

  view: 'overblik',                 // 'overblik' (landmark-grupper) | 'feed' (alle billeder) | 'ruter'

  gpsLat: null, gpsLon: null, gpsName: null,   // den rigtige GPS-position (så man kan skifte tilbage)

  photoShot: new Set(JSON.parse(localStorage.getItem('fotoscout-shot') || '[]')),  // id'er markeret "fotograferet"

  photoMapMode: localStorage.getItem('fotoscout-photomap') === '1'  // foto-view: kort vs liste

// --- Haversine ---
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(km) {
  if (km === null) return '';
  return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Geolocation ---
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Geolocation ikke tilgængelig'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(err),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 300000 }
    );
  });
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=da`);
    const d = await res.json();
    const addr = d.address;
    return addr.city || addr.town || addr.village || addr.municipality || addr.county || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
  } catch {
    return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
  }
}

// --- Load data ---
async function loadData() {
  try {
    const res = await fetch('./data.json?' + Date.now());
    if (res.ok) {
      state.data = await res.json();
    }
  } catch {}

  // Check localStorage for newer data
  const saved = localStorage.getItem('fotoscout-data');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed._modified && parsed.locations) {
        state.data = parsed;
      }
    } catch {}
  }

  // Sikr at begge arrays altid findes
  if (!Array.isArray(state.data.locations)) state.data.locations = [];
  if (!Array.isArray(state.data.inspirations)) state.data.inspirations = [];
}

    }

}

// --- Find nærmeste by inden for grænsen ---
function findNearestTown(lat, lon) {
  let best = null;
  for (const t of state.towns) {
    const d = haversine(lat, lon, t.lat, t.lon);
    if (best === null || d < best.dist) best = { town: t, dist: d };
  }
  return (best && best.dist <= NEAR_THRESHOLD_KM) ? best : null;
}

// --- Hent Flickr-billeder for en by (med 24t cache) ---
async function fetchFlickrPhotos(town) {
  const cacheKey = `flickr-cache-${town.name}-r${FLICKR_RADIUS_KM}-n${FLICKR_POOL}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < FLICKR_CACHE_HOURS * 3600 * 1000) {
      return cached.photos;
    }
  } catch {}

  const params = new URLSearchParams({
    method: 'flickr.photos.search',
    api_key: FLICKR_KEY,
    lat: town.lat, lon: town.lon,
    radius: FLICKR_RADIUS_KM, radius_units: 'km',
    has_geo: 1,
    sort: 'interestingness-desc',
    per_page: FLICKR_POOL,
    extras: 'owner_name,geo,url_q,url_m,url_c,url_l,tags',
    content_type: 1, media: 'photos', safe_search: 1,
    format: 'json', nojsoncallback: 1
  });
  const url = 'https://api.flickr.com/services/rest/?' + params.toString();

  let photos = [];
  try {
    const res = await fetch(url);
    const d = await res.json();
    if (d.stat === 'ok' && d.photos && d.photos.photo) {
      photos = d.photos.photo.map(p => ({
        id: 'flickr-' + p.id,
        title: (p.title || '').trim() || 'Flickr-foto',
        ownername: p.ownername || '',
        owner: p.owner,
        thumb: p.url_c || p.url_m || p.url_q || '',
        large: p.url_l || p.url_c || p.url_m || '',
        lat: p.latitude ? parseFloat(p.latitude) : null,
        lon: p.longitude ? parseFloat(p.longitude) : null,
        page: `https://www.flickr.com/photos/${p.owner}/${p.id}`,
        town: town.name,
        tags: (p.tags || '').split(' ').filter(Boolean).slice(0, 12)
      })).filter(p => p.thumb);
    }
  } catch (e) {
    return [];
  }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), photos })); } catch {}
  return photos;
}

// --- Lag 1: hent landmark-billeder via kategori-søgninger (geo + text=) ---
// Kører én søgning pr. kategori, mærker hvert billede med sin kategori, og fletter

  const fetchCat = async (cat) => {

    });
    try {
      const res = await fetch('https://api.flickr.com/services/rest/?' + params.toString());
      const d = await res.json();
      if (d.stat === 'ok' && d.photos && d.photos.photo) {
        return d.photos.photo.map(p => ({
          id: 'flickr-' + p.id,
          title: (p.title || '').trim() || 'Flickr-foto',
          ownername: p.ownername || '', owner: p.owner,
          thumb: p.url_c || p.url_m || p.url_q || '',
          large: p.url_l || p.url_c || p.url_m || '',
          lat: p.latitude ? parseFloat(p.latitude) : null,
          lon: p.longitude ? parseFloat(p.longitude) : null,
          page: `https://www.flickr.com/photos/${p.owner}/${p.id}`,
          town: town.name,
          tags: (p.tags || '').split(' ').filter(Boolean).slice(0, 12),
          cat: cat.key, catLabel: cat.label
        })).filter(p => p.thumb);
      }
    } catch (e) {}
    return [];
  };

  let photos = [];
  try {
    const results = await Promise.all(FLICKR_CATEGORIES.map(fetchCat));
    const seen = new Set();
    for (const arr of results) for (const p of arr) {
      if (seen.has(p.id)) continue;   // dedup på tværs af kategorier
      seen.add(p.id); photos.push(p);
    }
  } catch (e) { return []; }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), photos })); } catch {}
  return photos;
}

// --- Lag 3: kategorisér et OSM-element ud fra dets tags ---
function osmCat(t) {
  if (t.man_made === 'lighthouse') return 'fyr';
  if (t.military === 'bunker' || t.historic === 'bunker') return 'bunker';
  if (t.amenity === 'place_of_worship' || ['church', 'cathedral', 'chapel'].includes(t.building)) return 'kirke';
  if (t.tourism === 'museum') return 'museum';
  if (t.historic === 'castle' || t.historic === 'fort') return 'slot';
  if (t.leisure === 'marina' || t.harbour) return 'havn';
  if (t.tourism === 'theme_park') return 'forlystelse';
  if (t.historic === 'memorial' || t.historic === 'monument') return 'mindesmaerke';
  if (t.tourism === 'attraction') return 'attraktion';
  return 'andet';
}

// --- Lag 3: hent navngivne landmarks fra OpenStreetMap (Overpass), 30 dages cache ---
async function fetchOsmLandmarks(town) {
  const cacheKey = `osm-lm-${town.name}-r${FLICKR_RADIUS_KM}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < OSM_CACHE_HOURS * 3600 * 1000) return cached.landmarks;
  } catch {}

  const r = FLICKR_RADIUS_KM * 1000, lat = town.lat, lon = town.lon;
  const filters = ['[man_made=lighthouse]', '[military=bunker]', '[historic=bunker]',
    '[amenity=place_of_worship]', '[tourism=museum]', '[historic~"castle|fort|memorial|monument"]',
    '[tourism=attraction]', '[tourism=theme_park]', '[leisure=marina]'];
  const q = `[out:json][timeout:25];(${filters.map(f => `nwr(around:${r},${lat},${lon})${f};`).join('')});out center tags;`;

  let landmarks = [];
  try {
    const res = await fetch(OSM_ENDPOINT + '?data=' + encodeURIComponent(q));
    const d = await res.json();
    const seen = new Set();
    for (const el of (d.elements || [])) {
      const t = el.tags || {};
      const name = t.name || t['name:da'] || t['name:en'];
      if (!name || seen.has(name)) continue;
      const la = el.lat != null ? el.lat : (el.center && el.center.lat);
      const lo = el.lon != null ? el.lon : (el.center && el.center.lon);
      if (la == null || lo == null) continue;
      seen.add(name);
      landmarks.push({ name, lat: la, lon: lo, cat: osmCat(t), notable: !!(t.wikidata || t.wikipedia) });
    }
  } catch (e) { return []; }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), landmarks })); } catch {}
  return landmarks;
}

// --- Lag 3+: søg Flickr direkte på de "notable" OSM-landmark-navne (specifik pulje) ---
// Fanger navngivne attraktioner der IKKE passer i en generisk kategori (fx Legoland inde i landet).
async function fetchFlickrByLandmarks(town, landmarks) {
  const notable = landmarks.filter(l => l.notable).slice(0, NAMED_MAX);
  if (!notable.length) return [];
  const cacheKey = `flickr-named-${town.name}-n${notable.length}`;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && (Date.now() - cached.ts) < FLICKR_CACHE_HOURS * 3600 * 1000) return cached.photos;
  } catch {}

  const fetchOne = async (lm) => {
    const params = new URLSearchParams({
      method: 'flickr.photos.search', api_key: FLICKR_KEY,
      lat: town.lat, lon: town.lon, radius: FLICKR_RADIUS_KM, radius_units: 'km',
      has_geo: 1, text: lm.name, sort: 'interestingness-desc', per_page: NAMED_PER,
      extras: 'owner_name,geo,url_q,url_m,url_c,url_l,tags',
      content_type: 1, media: 'photos', safe_search: 1, format: 'json', nojsoncallback: 1
    });
    try {
      const res = await fetch('https://api.flickr.com/services/rest/?' + params.toString());
      const d = await res.json();
      if (d.stat === 'ok' && d.photos && d.photos.photo) {
        const total = parseInt(d.photos.total) || 0;   // hvor mange geotaggede fotos findes for dette landmark (ikonisk-proxy)
        return d.photos.photo.map(p => ({
          id: 'flickr-' + p.id,
          title: (p.title || '').trim() || 'Flickr-foto',
          ownername: p.ownername || '', owner: p.owner,
          thumb: p.url_c || p.url_m || p.url_q || '',
          large: p.url_l || p.url_c || p.url_m || '',
          lat: p.latitude ? parseFloat(p.latitude) : null,
          lon: p.longitude ? parseFloat(p.longitude) : null,
          page: `https://www.flickr.com/photos/${p.owner}/${p.id}`,
          town: town.name,
          tags: (p.tags || '').split(' ').filter(Boolean).slice(0, 12),
          cat: lm.cat, catLabel: CAT_LABELS[lm.cat] || null, landmark: lm.name, pop: total
        })).filter(p => p.thumb);
      }
    } catch (e) {}
    return [];
  };

  let photos = [];
  try {
    const results = await Promise.all(notable.map(fetchOne));
    const seen = new Set();
    for (const arr of results) for (const p of arr) {
      if (seen.has(p.id)) continue;   // dedup på tværs af landmark-søgninger
      seen.add(p.id); photos.push(p);
    }
  } catch (e) { return []; }

  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), photos })); } catch {}
  return photos;
}

// --- Lag 3: knyt nærmeste navngivne landmark til hvert foto (inden for OSM_SNAP_M) ---
function snapToLandmarks(photos, landmarks) {
  if (!landmarks.length) return photos;
  const maxKm = OSM_SNAP_M / 1000;
  for (const p of photos) {
    if (p.landmark) continue;              // allerede navngivet via navne-søgning — overskriv ikke
    if (p.lat == null || p.lon == null) continue;
    let best = null, bestD = maxKm;
    for (const lm of landmarks) {
      const d = haversine(p.lat, p.lon, lm.lat, lm.lon);
      if (d < bestD) { bestD = d; best = lm; }
    }
    if (best) {
      p.landmark = best.name;
      p.cat = best.cat;                 // OSM-kategorien er mere præcis end tekst-søgningens
      p.catLabel = CAT_LABELS[best.cat] || p.catLabel;
    }
  }
  return photos;
}

// --- Indlæs Flickr for nuværende position ---
async function loadFlickr() {
  state.flickr = [];
  if (!state.flickrEnabled || state.lat === null) return;
  const near = findNearestTown(state.lat, state.lon);
  if (!near) return;  // ikke i nærheden af en vestkyst-by
  const statusEl = document.getElementById('status');
  if (statusEl) statusEl.innerHTML += ` &middot; <span style="color:#ff7fb0">henter Flickr…</span>`;
  if (state.flickrLandmarkMode) {
    const landmarks = await fetchOsmLandmarks(near.town);
    const [generic, named] = await Promise.all([
      fetchFlickrLandmarks(near.town),
      fetchFlickrByLandmarks(near.town, landmarks)
    ]);
    const seen = new Set();
    const merged = [];
    for (const p of named.concat(generic)) {   // navne-søgte (specifikke) først → vinder ved dubletter
      if (seen.has(p.id)) continue;
      seen.add(p.id); merged.push(p);
    }
    state.flickr = snapToLandmarks(merged, landmarks);
  } else {
    state.flickr = await fetchFlickrPhotos(near.town);
  }
}

// --- Smags-profil (huskes i localStorage) ---
function saveTaste() {
  localStorage.setItem('fotoscout-taste', JSON.stringify(state.taste));
  localStorage.setItem('fotoscout-liked', JSON.stringify([...state.liked]));
}
function tasteScore(meta) {
  let s = 0;
  if (meta.owner && state.taste.owners[meta.owner]) s += state.taste.owners[meta.owner];
  for (const t of (meta.tags || [])) if (state.taste.tags[t]) s += state.taste.tags[t];
  return s;
}
function applyTaste(meta, ownerDelta, tagDelta) {
  if (!meta) return;
  if (meta.owner && ownerDelta) {
    state.taste.owners[meta.owner] = (state.taste.owners[meta.owner] || 0) + ownerDelta;
    if (state.taste.owners[meta.owner] === 0) delete state.taste.owners[meta.owner];
  }
  if (tagDelta) for (const t of (meta.tags || [])) {
    state.taste.tags[t] = (state.taste.tags[t] || 0) + tagDelta;
    if (state.taste.tags[t] === 0) delete state.taste.tags[t];
  }
}
function hasTaste() {
  return Object.keys(state.taste.owners).length > 0 || Object.keys(state.taste.tags).length > 0;
}
function flickrToItem(f) {
  let dist = null;
  if (state.lat !== null && f.lat && f.lon) dist = haversine(state.lat, state.lon, f.lat, f.lon);
  return {
    type: 'flickr', id: f.id, name: f.title, subtitle: f.town,
    notes: f.ownername ? 'Foto: ' + f.ownername : '',
    photo: f.thumb, photos: [f.large || f.thumb],
    tags: [], flickrTags: f.tags || [], owner: f.owner, ownername: f.ownername,
    cat: f.cat || null, catLabel: f.catLabel || null, landmark: f.landmark || null, pop: f.pop || 0,
    lat: f.lat, lon: f.lon, dist,
    navTarget: f.landmark ? `${f.landmark}, ${f.town}`
      : ((f.lat && f.lon) ? `${f.lat},${f.lon}` : f.town + ', Danmark'),
    flickrPage: f.page,
    _taste: tasteScore({ owner: f.owner, tags: f.tags || [] }) + (f.landmark ? OSM_LANDMARK_BOOST : 0)
  };
}
function getItemById(id) {
  const it = state.items.find(i => i.id === id);
  if (it) return it;
  const f = state.flickr.find(p => p.id === id);
  return f ? flickrToItem(f) : null;
}
function metaOf(id) {
  const it = getItemById(id);
  return it ? { owner: it.owner, tags: it.flickrTags || it.tags || [] } : null;
}

// --- Build items list ---
function buildItems() {
  const items = [];
  const locations = state.data.locations || [];
  const inspirations = state.data.inspirations || [];

  for (const loc of locations) {
    let dist = null;
    if (state.lat !== null && loc.lat && loc.lon) {
      dist = haversine(state.lat, state.lon, loc.lat, loc.lon);
    }
    items.push({
      type: 'location',
      id: loc.id,
      name: loc.name,
      subtitle: loc.address,
      notes: loc.notes,
      photos: loc.photos || [],
      photo: (loc.photos && loc.photos.length > 0) ? loc.photos[0] : '',
      tags: loc.tags || [],
      lat: loc.lat,
      lon: loc.lon,
      dist,
      navTarget: loc.address
    });
  }

  for (const insp of inspirations) {
    let dist = null;
    if (state.lat !== null && insp.lat && insp.lon) {
      dist = haversine(state.lat, state.lon, insp.lat, insp.lon);
    }
    items.push({
      type: 'inspiration',
      id: insp.id,
      name: insp.title,
      subtitle: insp.area,
      notes: insp.notes,
      photo: insp.photo || '',
      photos: insp.photo ? [insp.photo] : [],
      tags: insp.tags || [],
      lat: insp.lat,
      lon: insp.lon,
      dist,
      navTarget: (insp.lat && insp.lon) ? `${insp.lat},${insp.lon}` : insp.area + ', Danmark'
    });
  }

  // Flickr: byg kandidater, udeluk fravalgte fotografer, vælg de bedste efter smags-profil
  let flickrCands = state.flickr
    .map(flickrToItem)
    .filter(it => (state.taste.owners[it.owner] || 0) > -OWNER_AUTOHIDE)
    .filter(it => !state.hidden.has(it.id));   // skjulte fjernes FOER udvaelgelsen -> naeste fra puljen rykker ind
  flickrCands.sort((a, b) => b._taste - a._taste);
  for (const it of flickrCands.slice(0, FLICKR_COUNT)) items.push(it);

  // Sort: items with distance first (by distance), then items without
  items.sort((a, b) => {
    if (a.dist !== null && b.dist !== null) return a.dist - b.dist;
    if (a.dist !== null) return -1;
    if (b.dist !== null) return 1;
    return 0;
  });

  state.items = items;
}

// --- Skjul / synes om / gendan (huskes i localStorage) ---
function saveHidden() {
  localStorage.setItem('fotoscout-hidden', JSON.stringify([...state.hidden]));
}
function hideItem(id, reason) {
  reason = HIDE_REASONS[reason] ? reason : 'thisonly';
  const meta = metaOf(id);
  if (state.liked.has(id)) { state.liked.delete(id); applyTaste(meta, -LIKE_OWNER, -LIKE_TAG); }  // fjern tidligere like
  if (!state.hidden.has(id)) {
    state.hidden.set(id, reason);
    const r = HIDE_REASONS[reason];
    applyTaste(meta, r.owner, r.tag);            // negativt signal afhængig af begrundelse
  }
  saveHidden(); saveTaste(); closeDetail(); render();
}
function unhideItem(id) {
  if (state.hidden.has(id)) {
    const r = HIDE_REASONS[state.hidden.get(id)] || HIDE_REASONS.thisonly;
    applyTaste(metaOf(id), -r.owner, -r.tag);    // ophæv præcis det der blev trukket fra
    state.hidden.delete(id);
  }
  saveHidden(); saveTaste();
  if (state.filter === 'hidden' && getFilteredItems().length === 0) state.filter = 'all';
  render();
  if (state.openDetailId === id) openDetail(id);
}
function likeItem(id) {
  const meta = metaOf(id);
  if (state.liked.has(id)) {
    state.liked.delete(id); applyTaste(meta, -LIKE_OWNER, -LIKE_TAG);   // slå like fra
  } else {
    if (state.hidden.has(id)) {                                          // ophæv et evt. skjul først
      const r = HIDE_REASONS[state.hidden.get(id)] || HIDE_REASONS.thisonly;
      applyTaste(meta, -r.owner, -r.tag);
      state.hidden.delete(id);
    }
    state.liked.add(id); applyTaste(meta, LIKE_OWNER, LIKE_TAG);         // positivt signal (vægter mere)
  }
  saveHidden(); saveTaste();
  if (state.filter === 'liked' && state.liked.size === 0) state.filter = 'all';
  render();
  if (state.openDetailId === id) openDetail(id);
}
// --- Begrundelses-ark ved skjul (kun Flickr; egne spots skjules direkte) ---
let pendingHideId = null;
function askHide(id) {
  const it = getItemById(id);
  if (!it || it.type !== 'flickr') { hideItem(id, 'thisonly'); return; }
  pendingHideId = id;
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
  pendingHideId = null;
}
function confirmHide(reason) {
  const id = pendingHideId;
  closeSheet();
  if (id) hideItem(id, reason);
}

// --- Filter ---
function specialViewItems(predicate) {
  const out = [], seen = new Set();
  for (const it of state.items) if (predicate(it.id)) { out.push(it); seen.add(it.id); }
  for (const f of state.flickr) if (!seen.has(f.id) && predicate(f.id)) out.push(flickrToItem(f));
  return out;
}
function getFilteredItems() {
  if (state.filter === 'hidden') return specialViewItems(id => state.hidden.has(id));
  if (state.filter === 'liked')  return specialViewItems(id => state.liked.has(id));
  if (state.filter.startsWith('lm:')) {                 // alle billeder for ét landmark (ikke begrænset af FLICKR_COUNT)
    const name = state.filter.slice(3);
    return state.flickr.map(flickrToItem)
      .filter(it => it.landmark === name && !state.hidden.has(it.id))
      .sort((a, b) => b._taste - a._taste);
  }
  let list;
  if (state.filter === 'all') list = state.items;
  else if (state.filter === 'locations') list = state.items.filter(i => i.type === 'location');
  else if (state.filter === 'inspirations') list = state.items.filter(i => i.type === 'inspiration');
  else if (state.filter === 'flickr') list = state.items.filter(i => i.type === 'flickr');
  else list = state.items.filter(i => i.tags.includes(state.filter));  // tag-filter
  return list.filter(i => !state.hidden.has(i.id));
}

// --- Fase 1: gruppér Flickr-billeder pr. navngivet landmark og rangordn efter "fotogen-score" ---
function buildLandmarkGroups() {
  const cands = state.flickr
    .map(flickrToItem)
    .filter(it => (state.taste.owners[it.owner] || 0) > -OWNER_AUTOHIDE)
    .filter(it => !state.hidden.has(it.id))
    .filter(it => it.landmark);            // kun navngivne landmarks hører til i overblikket
  const map = new Map();
  for (const it of cands) {
    let g = map.get(it.landmark);
    if (!g) { g = { name: it.landmark, cat: it.cat, catLabel: it.catLabel, town: it.subtitle, photos: [], pop: 0, dist: null }; map.set(it.landmark, g); }
    g.photos.push(it);
    if (it.pop) g.pop = Math.max(g.pop, it.pop);
    if (it.dist != null) g.dist = (g.dist == null) ? it.dist : Math.min(g.dist, it.dist);
  }
  const groups = [...map.values()];
  for (const g of groups) {
    g.photos.sort((a, b) => b._taste - a._taste);
    g.notable = g.pop > 0;                 // navne-søgte (wikidata-landmarks) har en rigtig foto-total
    g.score = g.notable ? g.pop : g.photos.length;
  }
  // notable først (ikoniske), så efter popularitet, så efter nærhed
  groups.sort((a, b) => {
    if (a.notable !== b.notable) return a.notable ? -1 : 1;
    if (b.score !== a.score) return b.score - a.score;
    return (a.dist == null ? 1e9 : a.dist) - (b.dist == null ? 1e9 : b.dist);
  });
  return groups;
}

function renderOverview(content, statusEl, groups) {
  state._groups = groups;
  const tasteTag = hasTaste() ? ` &middot; <span style="color:#ff7fb0">✨ tilpasset til dig</span>` : '';
  statusEl.innerHTML = `<span class="count">${groups.length}</span> landmarks i nærheden${tasteTag}`;
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = '🧭 Overblik';

  content.innerHTML = '<div class="overview">' + groups.map((g, gi) => {
    const thumbs = g.photos.slice(0, 6).map(p =>
      `<img src="${p.photo}" loading="lazy" alt="${esc(g.name)}" onclick="openDetail('${p.id}')">`).join('');
    const dist = g.dist != null ? formatDist(g.dist) : '';
    const popTxt = g.notable ? `${g.pop.toLocaleString('da-DK')} fotos` : `${g.photos.length} fotos`;
    const meta = [esc(g.catLabel || '📍 Landmark'), popTxt, dist].filter(Boolean).join(' · ');
    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(g.name + ', ' + (g.town || 'Danmark'))}`;
    const imgUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(g.name + ' ' + (g.town || ''))}`;
    return `
      <div class="lm-card">
        <div class="lm-head">
          <span class="lm-rank">${gi + 1}</span>
          <div class="lm-titles">
            <div class="lm-name">${esc(g.name)}</div>
            <div class="lm-meta">${meta}</div>
          </div>
        </div>
        <div class="lm-strip">${thumbs}</div>
        <div class="lm-actions">
          <button class="lm-btn" onclick="showLandmarkIdx(${gi})">Se alle ${g.photos.length}</button>
          <a class="lm-btn" href="${imgUrl}" target="fsimg" rel="noopener">🔍 Google</a>
          <a class="lm-btn nav" href="${navUrl}" target="_blank" rel="noopener">📍 Navigér</a>
        </div>
      </div>`;
  }).join('') + '</div>';
}

function showLandmarkIdx(i) {
  const g = (state._groups || [])[i];
  if (!g) return;
  state.view = 'feed';
  state.filter = 'lm:' + g.name;
  document.getElementById('filtersPanel').classList.remove('open');
  render();
}

function backToOverview() {
  state.view = 'overblik';
  state.filter = 'all';
  render();
}

// --- Vælg by fra listen (scout hjemmefra), eller tilbage til GPS ---
async function selectTown(name) {
  const locEl = document.getElementById('locationName');
  const statusEl = document.getElementById('status');
  if (!name) {                                   // tilbage til "Min position"
    state.manualTown = null;
    if (state.gpsLat != null) {
      state.lat = state.gpsLat; state.lon = state.gpsLon;
      if (locEl) locEl.textContent = state.gpsName || 'Min position';
    } else {
      try {                                       // ingen gemt GPS endnu -> prøv at finde den
        const pos = await getPosition();
        state.lat = pos.lat; state.lon = pos.lon;
        state.gpsLat = pos.lat; state.gpsLon = pos.lon;
        state.gpsName = await reverseGeocode(pos.lat, pos.lon);
        if (locEl) locEl.textContent = state.gpsName;
      } catch { if (locEl) locEl.textContent = 'Ingen GPS'; state.lat = null; }
    }
  } else {                                        // valgt by fra listen
    const t = state.towns.find(x => x.name === name);
    if (!t) return;
    state.manualTown = name;
    state.lat = t.lat; state.lon = t.lon;
    if (locEl) locEl.textContent = name + ' · valgt 🔭';
  }
  document.getElementById('filtersPanel').classList.remove('open');
  state.view = 'overblik'; state.filter = 'all';
  if (statusEl) statusEl.innerHTML = `<span style="color:#ff7fb0">henter…</span>`;
  await loadFlickr();
  buildItems();
  render();
}

// --- Render ---
// ============================================================
// Sol & Måne-planlægger (Lag: astronomi)
// Beregner sol/måne-position (azimut + højde) offline via SunCalc-
// algoritmen (V. Agafonkin, MIT). Finder hvornår sol/måne står bag
// et objekt set fra fotografen, og foreslår standpunkter + brændvidde.
// ============================================================
const SOL = {
  D2R: Math.PI / 180,
  R2D: 180 / Math.PI,
  E: 23.4397 * Math.PI / 180,           // jordaksens hældning
  SENSORS: {                            // sensor-formater (w/h i mm, crop ift. fuldformat)
    m43:  { w: 17.3, h: 13.0, crop: 2.0,  label: 'M4/3' },
    apsc: { w: 23.5, h: 15.6, crop: 1.53, label: 'APS-C' },   // Sony/Nikon/Fuji (Canon=1.6×)
    ff:   { w: 36.0, h: 24.0, crop: 1.0,  label: 'Fuldformat' },
  },
  sensorDims() { return this.SENSORS[this.cfg.sensor] || this.SENSORS.m43; },  // aktiv sensor
  LENS_MIN: 12, LENS_MAX: 200,          // brændvidde-slider (mm som trykt på objektivet; telefon: basis×zoom med Fuldformat valgt)

  cfg: {
    objIdx: 1,          // default: Blåvandshuk (populær til solnedgang)
    lat: null, lon: null, height: 30, name: '',
    shape: 'lighthouse',// silhuet-form: lighthouse|house|bridge|church|box
    width: 8,           // objektets bredde (m) — former silhuetten + bredde-aflæsning
    focal: null,        // valgt brændvidde (mm) via slider; null → default LENS_MAX
    sensor: 'm43',      // sensor-format: m43|apsc|ff — bestemmer synsfeltet for en given brændvidde
    dist: null,         // valgt afstand (m) via slider; null → default (≈60% fyld)
    elev: 0,            // objektets fods højde (m) over fotografens standpunkt (fx fyr på klint)
    autoElev: true,     // hent terrænhøjde automatisk (Open-Meteo) og udregn elev; manuel indtastning slår det fra
    tilt: 0,            // kamerahældning (grader); + = vip op → objekt+sol panorerer ned i rammen (re-aim, ikke tid)
    date: null,         // 'YYYY-MM-DD'
    body: 'sun',        // 'sun' | 'moon'
    side: 'set',        // 'set' (nedgang) | 'rise' (opgang)
    anchor: 'top',      // 'base' | 'mid' | 'top' — hvor forskydningens nulpunkt sidder
    fill: 0.60,         // objektets andel af billedhøjden
    offX: 0, offY: 0,   // forskydning i andel af billedet (−0.4..0.4); + = højre / op
    lockOn: false,      // 🕐 tidspunkt-lås: lås tiden og vis begge himmellegemer hvor de FAKTISK står
    lockTime: null,     // 'HH:MM' — låst klokkeslæt (styrer så lodret position + op/nedgang, ikke omvendt)
  },

  // Brugerens egne "Andet objekt" — persisteret i localStorage, så de kan genbruges.
  OBJ_KEY: 'fotoscout-sol-objects',
  savedObjects: (function () {
    try { return JSON.parse(localStorage.getItem('fotoscout-sol-objects') || '[]'); } catch { return []; }
  })(),
  saveObjects() { try { localStorage.setItem(this.OBJ_KEY, JSON.stringify(this.savedObjects)); } catch {} },
  // Upsert (nøgle = navn, case-insensitivt) af det aktuelle custom-objekt, når det er komplet.
  persistCustom() {
    const c = this.cfg;
    if (c.objIdx !== 'custom') return;
    const name = (c.name || '').trim();
    if (!name || c.lat == null || c.lon == null) return;   // kræver navn + gyldige koordinater
    const rec = { name, lat: c.lat, lon: c.lon, height: +c.height || 30, width: +c.width || 8 };
    const i = this.savedObjects.findIndex(o => o.name.toLowerCase() === name.toLowerCase());
    if (i >= 0) this.savedObjects[i] = rec; else this.savedObjects.push(rec);
    this.saveObjects();
  },
  deleteObj(val) {
    const i = +String(val).slice(6);   // 'saved:N' → N
    if (i >= 0 && i < this.savedObjects.length) {
      this.savedObjects.splice(i, 1);
      this.saveObjects();
      this.cfg.objIdx = 1;             // tilbage til default
    }
    render();
  },

  BASE_MARGIN: 0.05,    // objektets fod sidder 5 % oppe fra billedets bund

  // Inverter komposition: hvilken afstand giver netop brændvidden `focal` for
  // et objekt med `height` (m) der fylder `fill` af billedhøjden?
  distForFocal(height, fill, focal) {
    const fovV = 2 * Math.atan(this.sensorDims().h / (2 * focal)) * this.R2D;   // lodret synsfelt (grader)
    const objAngV = fovV * fill;                                          // objektets ønskede vinkelhøjde
    return height / (2 * Math.tan(objAngV / 2 * this.D2R));               // afstand (m)
  },

  // --- kerneastronomi ---
  _days(date) { return date.valueOf() / 86400000 - 0.5 + 2440588 - 2451545; },
  _ra(l, b) { return Math.atan2(Math.sin(l) * Math.cos(this.E) - Math.tan(b) * Math.sin(this.E), Math.cos(l)); },
  _dec(l, b) { return Math.asin(Math.sin(b) * Math.cos(this.E) + Math.cos(b) * Math.sin(this.E) * Math.sin(l)); },
  _sidereal(d, lw) { return this.D2R * (280.16 + 360.9856235 * d) - lw; },
  _az(H, phi, dec) { return Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)); },
  _alt(H, phi, dec) { return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)); },
  _refract(h) { if (h < 0) h = 0; return 0.0002967 / Math.tan(h + 0.00312536 / (h + 0.08901179)); },

  _sunCoords(d) {
    const M = this.D2R * (357.5291 + 0.98560028 * d);
    const C = this.D2R * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const L = M + C + this.D2R * 102.9372 + Math.PI;
    return { dec: this._dec(L, 0), ra: this._ra(L, 0) };
  },
  _moonCoords(d) {
    const L = this.D2R * (218.316 + 13.176396 * d),
          M = this.D2R * (134.963 + 13.064993 * d),
          F = this.D2R * (93.272 + 13.229350 * d),
          l = L + this.D2R * 6.289 * Math.sin(M),
          b = this.D2R * 5.128 * Math.sin(F),
          dt = 385001 - 20905 * Math.cos(M);        // afstand (km)
    return { ra: this._ra(l, b), dec: this._dec(l, b), dist: dt };
  },

  // Returnér {az, alt} i grader (az: kompas, 0=N, 90=Ø, 180=S, 270=V) + evt. vinkeldiameter
  position(date, lat, lon, body) {
    const lw = this.D2R * -lon, phi = this.D2R * lat, d = this._days(date);
    const c = body === 'moon' ? this._moonCoords(d) : this._sunCoords(d);
    const H = this._sidereal(d, lw) - c.ra;
    let alt = this._alt(H, phi, c.dec);
    alt += this._refract(alt);
    let az = this._az(H, phi, c.dec) + Math.PI;      // fra syd → kompas fra nord
    az = ((az * this.R2D) % 360 + 360) % 360;
    const out = { az, alt: alt * this.R2D };
    out.diam = body === 'moon' ? 2 * Math.atan(1737.4 / c.dist) * this.R2D : 0.533;
    return out;
  },

  moonIllum(date) {
    const d = this._days(date), s = this._sunCoords(d), m = this._moonCoords(d), sd = 149598000;
    const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
    const inc = Math.atan2(sd * Math.sin(phi), m.dist - sd * Math.cos(phi));
    const angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra),
      Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
    return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI };
  },
  phaseLabel(ph) {
    const p = ((ph % 1) + 1) % 1;
    const t = [[0.02, '🌑', 'Nymåne'], [0.24, '🌒', 'Tiltagende måne'], [0.26, '🌓', 'Første kvarter'],
      [0.49, '🌔', 'Tiltagende (gibbous)'], [0.51, '🌕', 'Fuldmåne'], [0.74, '🌖', 'Aftagende (gibbous)'],
      [0.76, '🌗', 'Sidste kvarter'], [0.99, '🌘', 'Aftagende måne'], [1.01, '🌑', 'Nymåne']];
    for (const [lim, emo, name] of t) if (p <= lim) return { emoji: emo, name };
    return { emoji: '🌑', name: 'Nymåne' };
  },

  // Projicér et punkt: fra (lat,lon) i retning brng° over distance d (m) → nyt punkt
  dest(lat, lon, brng, d) {
    const R = 6371000, a = brng * this.D2R, p1 = lat * this.D2R, l1 = lon * this.D2R, dr = d / R;
    const p2 = Math.asin(Math.sin(p1) * Math.cos(dr) + Math.cos(p1) * Math.sin(dr) * Math.cos(a));
    const l2 = l1 + Math.atan2(Math.sin(a) * Math.sin(dr) * Math.cos(p1), Math.cos(dr) - Math.sin(p1) * Math.sin(p2));
    return { lat: p2 * this.R2D, lon: l2 * this.R2D };
  },
  compassName(deg) {
    return ['N', 'NØ', 'Ø', 'SØ', 'S', 'SV', 'V', 'NV'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];
  },

  // Scan et lokalt døgn og find op-/nedgang + kulmination for body
  dayEvents(dateStr, lat, lon, body) {
    const [y, mo, da] = dateStr.split('-').map(Number);
    const thr = body === 'moon' ? 0.125 : -0.833;       // horisont-tærskel (grader)
    let prev = null, events = [], peak = { alt: -99, t: null, az: 0 };
    for (let min = 0; min <= 1440; min++) {
      const t = new Date(y, mo - 1, da, 0, min, 0);
      const p = this.position(t, lat, lon, body);
      if (p.alt > peak.alt) peak = { alt: p.alt, t, az: p.az };
      if (prev) {
        if (prev.alt < thr && p.alt >= thr) events.push({ type: 'rise', t, az: p.az, alt: p.alt });
        if (prev.alt >= thr && p.alt < thr) events.push({ type: 'set', t: prev.t, az: prev.az, alt: prev.alt });
      }
      prev = { alt: p.alt, t, az: p.az };
    }
    return { events, peak };
  },

  // Højde+azimut for hele døgnet (1-min opløsning) — genbruges på tværs af afstande
  daySeries(dateStr, lat, lon, body) {
    const [y, mo, da] = dateStr.split('-').map(Number);
    const s = [];
    for (let m = 0; m <= 1440; m++) {
      const t = new Date(y, mo - 1, da, 0, m, 0);
      const p = this.position(t, lat, lon, body);
      s.push({ t, alt: p.alt, az: p.az });
    }
    return s;
  },
  // Find tidspunkt hvor højden krydser target-højden på ønsket side
  // ('rise' = på vej op, 'set' = på vej ned). Falder tilbage til modsat side.
  findCrossing(series, target, side) {
    let fallback = null;
    for (let i = 1; i < series.length; i++) {
      const a = series[i - 1].alt, b = series[i].alt;
      const up = a < target && b >= target, down = a >= target && b < target;
      if (!up && !down) continue;
      const f = (target - a) / (b - a);
      const hit = {
        t: new Date(series[i - 1].t.getTime() + f * (series[i].t - series[i - 1].t)),
        az: series[i].az, side: up ? 'rise' : 'set',
      };
      if ((side === 'rise' && up) || (side === 'set' && down)) return hit;
      if (!fallback) fallback = hit;
    }
    return fallback;
  },

  // Beregn ét standpunkt for en given afstand + ønsket komposition.
  // c.elev = objektets fods højde (m) over fotografens standpunkt (0 = samme niveau).
  plan(obj, series, D, c) {
    const elev = +c.elev || 0;
    const footAlt = Math.atan(elev / D) * this.R2D;                  // objektets fod over din horisont (grader)
    const objAngV = (Math.atan((elev + obj.height) / D) - Math.atan(elev / D)) * this.R2D;  // objektets vinkelhøjde (grader)
    const fovV = objAngV / c.fill;                                     // lodret synsfelt for ønsket objektstørrelse
    const focal = this.sensorDims().h / (2 * Math.tan(fovV / 2 * this.D2R)); // nødvendig brændvidde (mm)
    const fovH = 2 * Math.atan(this.sensorDims().w / (2 * focal)) * this.R2D;
    const inRange = focal >= this.LENS_MIN && focal <= this.LENS_MAX;
    // ankerpunktets placering i billedet (andel fra bunden) + forskydning
    const anchorFY = c.anchor === 'base' ? this.BASE_MARGIN
      : c.anchor === 'mid' ? this.BASE_MARGIN + c.fill / 2
      : this.BASE_MARGIN + c.fill;
    const bodyFY = anchorFY + c.offY, bodyFX = 0.5 + c.offX;
    const targetAlt = footAlt + fovV * (bodyFY - this.BASE_MARGIN);   // fod ved footAlt (havhorisont = 0°, kan ligge lavere)
    const r = { D, focal, inRange, objAngV, fovV, fovH, footAlt, bodyFY, targetAlt, seaFy: this.BASE_MARGIN - footAlt / fovV, note: '', ok: false };
    if (targetAlt < -0.2) { r.note = 'under horisont'; return r; }
    const cross = this.findCrossing(series, targetAlt, c.side);
    if (!cross) { r.note = 'når ikke højden'; return r; }
    const p = this.position(cross.t, obj.lat, obj.lon, c.body);
    const dAz = (c.offX * fovH) / Math.max(0.3, Math.cos(targetAlt * this.D2R));
    const aObj = ((cross.az - dAz) % 360 + 360) % 360;                // objektets retning fra fotograf
    r.aim = aObj;                                                     // kamera-sigtets azimut (ramme-centrum) — bruges af secondary()
    r.back = (aObj + 180) % 360;                                      // fotografens retning fra objekt
    r.gp = this.dest(obj.lat, obj.lon, r.back, D);
    r.time = cross.t;
    r.bodyVsObj = p.diam / objAngV;
    r.bodyFrame = p.diam / fovV;
    const rY = p.diam / fovV / 2, rX = p.diam / fovH / 2;
    const drawFY = bodyFY - (+c.tilt || 0) / fovV;                    // hældning panorerer den tegnede sol-position
    r.fits = drawFY - rY >= 0 && drawFY + rY <= 1 && bodyFX - rX >= 0 && bodyFX + rX <= 1;
    r.usedSide = cross.side;                                          // hvilken side der FAKTISK blev brugt (kan afvige v. fallback)
    if (cross.side !== c.side) r.note = cross.side === 'rise' ? 'kun v. opgang' : 'kun v. nedgang';
    if (!r.fits) r.note = r.note ? r.note + ' · uden for ramme' : 'uden for ramme';
    r.ok = inRange && r.fits;
    return r;
  },

  // Det ANDET himmellegeme (primær sol → måne, og omvendt) ved standpunktets
  // beregnede tidspunkt: står det op, hvor sidder det ift. rammen (frame-fraktion
  // fx/fy i samme afbildning som primæret tegnes med), hvor langt væk i grader, og
  // er det en sjælden sol+segl-nærkomposition? Returnerer null hvis intet gyldigt
  // standpunkt, ellers { up, ... } så render kan vise en linje selv når det er nede.
  secondary(obj, r, c) {
    if (!r || !r.time || r.aim == null || r.fovH == null) return null;
    const other = c.body === 'moon' ? 'sun' : 'moon';
    const thr = other === 'moon' ? 0.125 : -0.833;        // samme horisont-tærskel som dayEvents/dagsserie
    const p = this.position(r.time, obj.lat, obj.lon, other);
    const prim = this.position(r.time, obj.lat, obj.lon, c.body);
    const up = p.alt > thr;
    // vinkelafstand mellem de to himmellegemer (grader) — via sfærisk cosinusrelation
    const sep = Math.acos(Math.max(-1, Math.min(1,
      Math.sin(p.alt * this.D2R) * Math.sin(prim.alt * this.D2R) +
      Math.cos(p.alt * this.D2R) * Math.cos(prim.alt * this.D2R) *
      Math.cos((p.az - prim.az) * this.D2R)))) * this.R2D;
    // frame-fraktioner: samme afbildning som primæret (az→x via cos-korrektion, alt→y)
    const dAz = ((p.az - r.aim + 540) % 360) - 180;       // signeret az fra sigtet (−180..180); + = til højre
    const fx = 0.5 + (dAz * Math.cos(p.alt * this.D2R)) / r.fovH;
    const fy = r.bodyFY + (p.alt - r.targetAlt) / r.fovV;
    const inFrame = fx >= 0 && fx <= 1 && fy >= 0 && fy <= 1;
    // Nødvendig brændvidde for at få BEGGE i ét billede (vandret) — mod widest lens
    const sd = this.sensorDims();
    const focalForBoth = sep > 0.01 ? sd.w / (2 * Math.tan(sep / 2 * this.D2R)) : this.LENS_MAX;
    const fitsWidest = focalForBoth >= this.LENS_MIN;     // false = for langt fra hinanden selv med vidvinkel → panorama
    // Sjælden nærkomposition: tynd månesegl tæt på solen (sol+segl lavt over havet)
    const moonFrac = this.moonIllum(r.time).fraction;
    const rareCrescent = up && moonFrac > 0.01 && moonFrac < 0.18 && sep < 40;   // synlig tynd segl (ikke præcis nymåne)
    return {
      body: other, up, inFrame, fx, fy, sep,
      az: p.az, alt: p.alt, diam: p.diam,
      dAz, focalForBoth, fitsWidest, moonFrac, rareCrescent,
    };
  },
};

// --- Auto-terræn: hent terrænhøjde for objekt + beregnet standpunkt (Open-Meteo,
// gratis/ingen nøgle/CORS) og udregn elev = fod-højde over standpunktet. Debounced
// (kun efter sidste justering), cachet pr. ~100 m gitter, falder pænt tilbage offline.
SOL.elevCache = {};        // gitter-key → meter (standpunkter)
SOL.objElevCache = {};     // objekt-key → meter (hentes én gang pr. objekt)
SOL.elevState = { status: 'idle', msg: '', objM: null, gpM: null, appliedKey: null };
SOL._elevTimer = null;
SOL.gridKey = function (lat, lon) { return lat.toFixed(3) + ',' + lon.toFixed(3); };   // ~110 m

SOL.fetchElevBatch = async function (points) {
  const lat = points.map(p => (+p.lat).toFixed(5)).join(',');
  const lon = points.map(p => (+p.lon).toFixed(5)).join(',');
  const url = `https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 6000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j || !Array.isArray(j.elevation)) throw new Error('uventet svar');
    return j.elevation;
  } finally { clearTimeout(to); }
};

SOL.scheduleAutoElev = function (objLat, objLon, objKey, gpLat, gpLon) {
  clearTimeout(this._elevTimer);
  this._elevTimer = setTimeout(() => this.runAutoElev(objLat, objLon, objKey, gpLat, gpLon), 900);
};

SOL.runAutoElev = async function (objLat, objLon, objKey, gpLat, gpLon) {
  if (!this.cfg.autoElev || typeof state === 'undefined' || state.view !== 'sol') return;
  const wantKey = objKey + '|' + this.gridKey(gpLat, gpLon);
  if (this.elevState.appliedKey === wantKey) return;                 // allerede anvendt → undgå løkke
  let objM = this.objElevCache[objKey];
  let gpM = this.elevCache[this.gridKey(gpLat, gpLon)];
  if (objM != null && gpM != null) { this.applyElev(objM, gpM, wantKey); return; }   // ren cache-hit, intet net
  this.elevState = { ...this.elevState, status: 'loading', msg: 'henter terræn…' };
  if (state.view === 'sol') render();
  try {
    const need = [];
    if (objM == null) need.push({ lat: objLat, lon: objLon, which: 'obj' });
    if (gpM == null) need.push({ lat: gpLat, lon: gpLon, which: 'gp' });
    const got = await this.fetchElevBatch(need);
    need.forEach((p, i) => {
      if (p.which === 'obj') { objM = got[i]; this.objElevCache[objKey] = objM; }
      else { gpM = got[i]; this.elevCache[this.gridKey(gpLat, gpLon)] = gpM; }
    });
    if (!isFinite(objM) || !isFinite(gpM)) throw new Error('ufuldstændige data');
    this.applyElev(objM, gpM, wantKey);
  } catch (e) {
    this.elevState = { ...this.elevState, status: 'offline', msg: 'offline' };
    if (state.view === 'sol') render();                             // ingen appliedKey → prøver igen ved næste justering
  }
};

SOL.applyElev = function (objM, gpM, key) {
  const dh = Math.round(objM - gpM);
  this.elevState = { status: 'ok', objM, gpM, appliedKey: key,
    msg: `du ${Math.round(gpM)} m · objektets fod ${Math.round(objM)} m` };
  this.cfg.elev = dh;
  if (typeof state !== 'undefined' && state.view === 'sol') render();   // gen-render; appliedKey forhindrer løkke
};

// --- Interaktivt kort (Leaflet): objekt-markør + træk-bar standpunkt-pin langs
// "stå-her-linjen". Træk ind/ud = afstand → opdaterer preview/tabel/terræn live.
SOL.distBetween = function (la1, lo1, la2, lo2) {
  const R = 6371000, d2r = this.D2R;
  const dLa = (la2 - la1) * d2r, dLo = (lo2 - lo1) * d2r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * d2r) * Math.cos(la2 * d2r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
};
SOL.bearing = function (la1, lo1, la2, lo2) {           // initial-pejling (grader, kompas) fra 1 → 2
  const d2r = this.D2R, p1 = la1 * d2r, p2 = la2 * d2r, dLo = (lo2 - lo1) * d2r;
  const y = Math.sin(dLo) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dLo);
  return (Math.atan2(y, x) * this.R2D + 360) % 360;
};

// --- Sol+måne-muligheder: scan objekter N dage frem for tidspunkter hvor BEGGE
// himmellegemer er oppe i en fotograferbar konstellation. To slags: 'tight' (nær
// nymåne — sol + lav/tynd måne tæt sammen, tele/normal) og 'wide' (begge meget
// lavt over horisonten, stor spredning → vidvinkel/panorama, typisk nær fuldmåne).
SOL.oppResults = null;   // seneste scan (null = ikke kørt endnu)
SOL._catalog = [];       // sættes af renderSol: alle objekter (stops + gemte)

SOL.findOpportunities = function (objects, startDate, days) {
  const out = [];
  const sd = this.sensorDims();
  const lensHint = sep => {
    const f = sep > 0.01 ? sd.w / (2 * Math.tan(sep / 2 * this.D2R)) : this.LENS_MAX;
    return f >= this.LENS_MIN ? `~${Math.round(f)} mm` : `panorama ~${Math.round(sep)}°`;
  };
  const sepDeg = (aAlt, aAz, bAlt, bAz) => Math.acos(Math.max(-1, Math.min(1,
    Math.sin(aAlt * this.D2R) * Math.sin(bAlt * this.D2R) +
    Math.cos(aAlt * this.D2R) * Math.cos(bAlt * this.D2R) * Math.cos((aAz - bAz) * this.D2R)))) * this.R2D;
  const [y0, m0, d0] = startDate.split('-').map(Number);
  for (const obj of objects) {
    if (obj.lat == null || obj.lon == null) continue;
    for (let dd = 0; dd < days; dd++) {
      const base = new Date(y0, m0 - 1, d0 + dd);
      const dateStr = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-${String(base.getDate()).padStart(2, '0')}`;
      let tight = null, wide = null;
      for (let min = 0; min <= 1440; min += 10) {
        const t = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, min, 0);
        const s = this.position(t, obj.lat, obj.lon, 'sun');
        if (s.alt < -1) continue;                            // solen skal reelt være oppe
        const mo = this.position(t, obj.lat, obj.lon, 'moon');
        if (mo.alt < 0.125) continue;                        // månen over horisont
        const sep = sepDeg(s.alt, s.az, mo.alt, mo.az);
        if (s.alt <= 25 && mo.alt <= 25 && sep <= 45) {      // A: tæt, begge lavt
          if (!tight || sep < tight.sep) tight = { t, sep, s, mo };
        }
        if (s.alt <= 6 && mo.alt <= 6 && sep >= 60) {        // B: begge meget lavt, stor spredning
          if (!wide || sep > wide.sep) wide = { t, sep, s, mo };
        }
      }
      const push = (kind, w) => out.push({
        obj: obj.name, date: dateStr, t: w.t, kind, sep: w.sep,
        sunAz: w.s.az, sunAlt: w.s.alt, moonAz: w.mo.az, moonAlt: w.mo.alt,
        moonFrac: this.moonIllum(w.t).fraction, lens: lensHint(w.sep),
      });
      if (tight) push('tight', tight);
      if (wide) push('wide', wide);
    }
  }
  return out;
};

// Kør scan over hele kataloget, afduplikér til én række pr. dato+type (alle danske
// spots giver ~samme geometri) og behold den bedste instans. Re-render bagefter.
SOL.runScan = function () {
  const start = this.cfg.date || (function () { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; })();
  const raw = this.findOpportunities(this._catalog || [], start, 60);
  const best = new Map();
  for (const o of raw) {
    const key = o.date + '|' + o.kind;
    const prev = best.get(key);
    const better = o.kind === 'tight' ? (!prev || o.sep < prev.sep) : (!prev || o.sep > prev.sep);
    if (better) best.set(key, o);
  }
  this.oppResults = [...best.values()].sort((a, b) => a.t - b.t);
  this._pickedOpp = null;   // ny scan → ryd tidligere valg
  render();
};

// Klik-bro: load en mulighed ind i planlæggeren (dato + himmellegeme + side), så
// den eksisterende kæde beregner standpunktet og tegner det på kortet. Ved brede
// muligheder (nær fuldmåne) sættes MÅNEN bag objektet (klassisk fuldmåne-opgang);
// er månen usynlig (≈nymåne) bruges solen. plan()'s side-fallback fanger fejlgæt.
SOL.applyOpportunity = function (idx) {
  const o = this.oppResults && this.oppResults[idx];
  if (!o) return;
  this.cfg.date = o.date;
  const body = o.moonFrac >= 0.02 ? 'moon' : 'sun';
  this.cfg.body = body;
  const az = body === 'moon' ? o.moonAz : o.sunAz;
  this.cfg.side = (az < 180) ? 'rise' : 'set';     // østlig himmel = opgang, vestlig = nedgang
  // neutral komposition (centreret) → plan() finder pålideligt standpunktet;
  // brændvidde + afstand beholdes.
  this.cfg.offX = 0; this.cfg.tilt = 0; this.cfg.anchor = 'base';
  // lås tiden til mulighedens tidspunkt → begge himmellegemer vises hvor de faktisk står
  this.cfg.lockOn = true;
  this.cfg.lockTime = `${String(o.t.getHours()).padStart(2, '0')}:${String(o.t.getMinutes()).padStart(2, '0')}`;
  this._pickedOpp = idx;
  this._fitted = false;                            // lad kortet zoome til objekt + nyt standpunkt
  render();
};

SOL.initMap = function () {
  if (typeof L === 'undefined') return;                 // Leaflet ikke indlæst (offline første gang) → spring over
  if (this._map) { try { this._map.remove(); } catch (e) {} this._map = null; }
  const el = document.getElementById('sol-map');
  if (!el) return;
  const map = L.map(el, { zoomControl: true }).setView([56.0, 8.3], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const objIcon = L.divIcon({ className: 'sol-pin-obj', html: '🗼', iconSize: [24, 24], iconAnchor: [12, 20] });
  const standIcon = L.divIcon({ className: 'sol-pin-stand', html: '📍', iconSize: [24, 24], iconAnchor: [12, 22] });
  this._objMarker = L.marker([56, 8.3], { icon: objIcon, interactive: false }).addTo(map);
  this._line = L.polyline([], { color: '#ff9d3c', weight: 3, dashArray: '6 5', opacity: 0.9 }).addTo(map);
  this._secLine = L.polyline([], { color: '#9ec5ff', weight: 2, dashArray: '2 7', opacity: 0.85 }).addTo(map);  // det andet himmellegemes retning
  this._standMarker = L.marker([56, 8.3], { icon: standIcon, draggable: true }).addTo(map);
  this._standMarker.on('dragstart', () => { this._dragging = true; });
  this._standMarker.on('drag', () => this.onPinDrag());
  this._standMarker.on('dragend', () => { this._dragging = false; if (typeof render === 'function') render(); });
  this._map = map;
  this._fitted = false;
};

SOL.updateMap = function (objLat, objLon, gp, back, dMin, dMax, secAz, secBody) {
  this._dragCtx = { objLat, objLon, dMin, dMax, back };
  const note = document.getElementById('sol-map-note');
  if (!this._map) { if (note) note.textContent = typeof L === 'undefined' ? '🗺️ Kort kræver net ved første indlæsning — resten virker offline.' : ''; return; }
  this._objMarker.setLatLng([objLat, objLon]);
  if (back != null) {
    const near = this.dest(objLat, objLon, back, dMin), far = this.dest(objLat, objLon, back, dMax);
    this._line.setLatLngs([[near.lat, near.lon], [far.lat, far.lon]]);
  }
  // Sekundært himmellegeme: stråle FRA objektet mod dets retning på himlen (dér ligger
  // det andet lys). Ved tætte muligheder peger den ~modsat stå-her-linjen (begge bag
  // objektet); ved brede peger den til den anden side (panorama).
  if (this._secLine) {
    if (secAz != null) {
      const tip = this.dest(objLat, objLon, secAz, Math.max(dMax * 1.4, 1500));
      this._secLine.setLatLngs([[objLat, objLon], [tip.lat, tip.lon]]);
      this._secLine.setStyle({ color: secBody === 'moon' ? '#9ec5ff' : '#ffcf7a' });
    } else {
      this._secLine.setLatLngs([]);
    }
  }
  if (gp && !this._dragging) this._standMarker.setLatLng([gp.lat, gp.lon]);
  this._standMarker.setOpacity(gp ? 1 : 0.4);
  if (!this._fitted && gp) {
    this._map.fitBounds([[objLat, objLon], [gp.lat, gp.lon]], { padding: [40, 40], maxZoom: 15 });
    this._fitted = true;
    setTimeout(() => { if (this._map) this._map.invalidateSize(); }, 0);
  }
  if (note) {
    const secTxt = secAz != null ? ` ${secBody === 'moon' ? '🌙 blå' : '☀️ gul'} stråle = ${secBody === 'moon' ? 'månens' : 'solens'} retning (${Math.round(secAz)}° ${this.compassName(secAz)}).` : '';
    note.textContent = '📍 Træk pin\'en ind/ud langs den orange linje for at ændre afstanden.' + secTxt;
  }
};

SOL.onPinDrag = function () {
  const ctx = this._dragCtx;
  if (!ctx || !this._standMarker) return;
  const p = this._standMarker.getLatLng();
  const d = this.distBetween(ctx.objLat, ctx.objLon, p.lat, p.lng);
  let dist = d;
  if (ctx.back != null) {
    // Projicér trækpunktet ind på "stå-her-linjen" (line-lock): kun komposanten langs linjen tæller
    const brg = this.bearing(ctx.objLat, ctx.objLon, p.lat, p.lng);
    dist = d * Math.cos((brg - ctx.back) * this.D2R);
  }
  dist = Math.max(ctx.dMin, Math.min(ctx.dMax, Math.round(dist)));
  this.cfg.dist = dist;
  if (ctx.back != null) {                               // lås pin'en visuelt til linjen (perle på snor)
    const onLine = this.dest(ctx.objLat, ctx.objLon, ctx.back, dist);
    this._standMarker.setLatLng([onLine.lat, onLine.lon]);
  }
  if (this._dragRAF) return;                            // throttle til én render pr. frame (glidende træk)
  this._dragRAF = requestAnimationFrame(() => { this._dragRAF = null; if (typeof render === 'function') render(); });
};

// Monter persistent shell (kontroller + kort side-om-side/under); kortet må IKKE
// ligge i den del der genskrives på hver render, ellers ødelægges Leaflet-instansen.
SOL.mount = function (content, controlsHtml) {
  let ctrl = document.getElementById('sol-controls');
  if (!ctrl) {
    content.innerHTML = `<div class="sol-layout">
      <div id="sol-controls" class="sol-controls"></div>
      <div class="sol-mapwrap"><div id="sol-map"></div><div class="sol-dim sol-map-note" id="sol-map-note"></div></div>
    </div>`;
    ctrl = document.getElementById('sol-controls');
    this.initMap();
  }
  ctrl.innerHTML = controlsHtml;
};

// Objekt-silhuetter: generiske former tegnet mellem grundlinjen (baseY) og
// toppen (topY), med halv bredde hw (px). Alle former er centreret om cx.
const SOL_SHAPES = {
  lighthouse: '🗼 Fyrtårn', house: '🏠 Hus', bridge: '🌉 Bro',
  church: '⛪ Kirke', box: '⬛ Kasse',
};
function solSilhouette(shape, cx, baseY, topY, hw, col) {
  const objH = baseY - topY;
  const L = (x) => x.toFixed(1);
  if (shape === 'house') {
    const wallTopY = topY + objH * 0.42;               // tag = øverste 42 %
    const eave = hw * 1.12;                             // tagudhæng
    return `<rect x="${L(cx - hw)}" y="${L(wallTopY)}" width="${L(hw * 2)}" height="${L(baseY - wallTopY)}" fill="${col}"/>`
      + `<polygon points="${L(cx - eave)},${L(wallTopY)} ${L(cx)},${L(topY)} ${L(cx + eave)},${L(wallTopY)}" fill="${col}"/>`;
  }
  if (shape === 'box') {
    return `<rect x="${L(cx - hw)}" y="${L(topY)}" width="${L(hw * 2)}" height="${L(objH)}" fill="${col}"/>`;
  }
  if (shape === 'bridge') {
    const deckY = topY + objH * 0.55, deckH = Math.max(4, objH * 0.1);
    const pW = Math.max(3, hw * 0.1), pOff = hw * 0.6;
    return `<rect x="${L(cx - hw)}" y="${L(deckY)}" width="${L(hw * 2)}" height="${L(deckH)}" fill="${col}"/>`   // dæk
      + `<rect x="${L(cx - pOff - pW / 2)}" y="${L(topY)}" width="${L(pW)}" height="${L(deckY + deckH - topY)}" fill="${col}"/>` // venstre pylon
      + `<rect x="${L(cx + pOff - pW / 2)}" y="${L(topY)}" width="${L(pW)}" height="${L(deckY + deckH - topY)}" fill="${col}"/>` // højre pylon
      + `<path d="M ${L(cx - pOff)},${L(topY)} Q ${L(cx)},${L(deckY)} ${L(cx + pOff)},${L(topY)}" fill="none" stroke="${col}" stroke-width="2"/>` // kabel
      + `<rect x="${L(cx - pOff - pW / 2)}" y="${L(deckY + deckH)}" width="${L(pW)}" height="${L(baseY - deckY - deckH)}" fill="${col}"/>`   // venstre pille
      + `<rect x="${L(cx + pOff - pW / 2)}" y="${L(deckY + deckH)}" width="${L(pW)}" height="${L(baseY - deckY - deckH)}" fill="${col}"/>`;  // højre pille
  }
  if (shape === 'church') {
    const th = Math.max(6, hw * 0.42);                 // tårnets halve bredde
    const naveTopY = topY + objH * 0.55, naveLeft = cx - th * 0.2, naveRight = cx + hw;
    const spireBaseY = topY + objH * 0.28, towerL = cx - hw, towerR = cx - hw + th * 2, spireX = cx - hw + th;
    return `<rect x="${L(naveLeft)}" y="${L(naveTopY)}" width="${L(naveRight - naveLeft)}" height="${L(baseY - naveTopY)}" fill="${col}"/>` // skib
      + `<polygon points="${L(naveLeft)},${L(naveTopY)} ${L((naveLeft + naveRight) / 2)},${L(naveTopY - objH * 0.12)} ${L(naveRight)},${L(naveTopY)}" fill="${col}"/>` // skibets tag
      + `<rect x="${L(towerL)}" y="${L(spireBaseY)}" width="${L(th * 2)}" height="${L(baseY - spireBaseY)}" fill="${col}"/>` // tårn
      + `<polygon points="${L(towerL)},${L(spireBaseY)} ${L(spireX)},${L(topY)} ${L(towerR)},${L(spireBaseY)}" fill="${col}"/>` // spir
      + `<rect x="${L(spireX - 1)}" y="${L(topY - 9)}" width="2" height="9" fill="${col}"/><rect x="${L(spireX - 3)}" y="${L(topY - 6)}" width="6" height="2" fill="${col}"/>`; // kors
  }
  // lighthouse (default): trapez-tårn + lanterne-hoved
  const th = Math.max(4, hw * 0.55);
  return `<polygon points="${L(cx - hw)},${L(baseY)} ${L(cx - th)},${L(topY + 10)} ${L(cx + th)},${L(topY + 10)} ${L(cx + hw)},${L(baseY)}" fill="${col}"/>`
    + `<rect x="${L(cx - th - 2)}" y="${L(topY + 3)}" width="${L((th + 2) * 2)}" height="8" fill="${col}"/>`
    + `<rect x="${L(cx - th + 2)}" y="${L(topY - 3)}" width="${L((th - 2) * 2)}" height="7" fill="${col}"/>`;
}

// Visuelt preview: 4:3-ramme (sensor-proportion) med horisont, objekt-silhuet
// og sol/måne-prik i korrekt position + relativ størrelse for ét standpunkt.
function solPreview(c, plan) {
  const W = 400, H = 300, m = SOL.BASE_MARGIN, fill = c.fill;
  // Canvas med margin rundt om selve billedrammen, så sol/måne kan tegnes UDEN FOR rammen
  // (scenen fortsætter i den dæmpede margin; den hvide kant markerer kameraets udsnit).
  const MX = 100, MY = 75, CW = W + 2 * MX, CH = H + 2 * MY;
