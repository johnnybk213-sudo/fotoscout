// --- Filter click ---
document.getElementById('filters').addEventListener('click', async e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  if (pill.dataset.action === 'toggle-flickr') {
    state.flickrEnabled = !state.flickrEnabled;
    localStorage.setItem('fotoscout-flickr', state.flickrEnabled ? 'on' : 'off');
    if (state.flickrEnabled) {
      await loadFlickr();
    } else {
      state.flickr = [];
      if (state.filter === 'flickr') state.filter = 'all';
    }
    buildItems();
    render();
    return;
  }
  if (pill.dataset.action === 'toggle-landmark') {
    state.flickrLandmarkMode = !state.flickrLandmarkMode;
    localStorage.setItem('fotoscout-flickr-lm', state.flickrLandmarkMode ? 'on' : 'off');
    await loadFlickr();   // genhent med den nye søgemetode
    buildItems();
    render();
    return;
  }
  if (pill.dataset.action === 'view-ruter') {
    state.view = 'ruter'; state.routeId = null;
    document.getElementById('filtersPanel').classList.remove('open');
    window.scrollTo(0, 0);
    render(); return;
  }
  if (pill.dataset.action === 'view-sol') {
    state.view = 'sol';
    document.getElementById('filtersPanel').classList.remove('open');
    window.scrollTo(0, 0);
    render(); return;
  }
  if (pill.dataset.action === 'view-sky') {
    state.view = 'sky';
    document.getElementById('filtersPanel').classList.remove('open');
    window.scrollTo(0, 0);
    if (!SKY.results) SKY.scan(); else render();
    return;
  }
  if (pill.dataset.action === 'view-clear') {
    state.view = 'clear';
    document.getElementById('filtersPanel').classList.remove('open');
    window.scrollTo(0, 0);
    render();
    return;
  }
  if (pill.dataset.action === 'view-foto') {
    state.view = 'foto';
    document.getElementById('filtersPanel').classList.remove('open');
    window.scrollTo(0, 0);
    if (!state.photoScout.length) await loadPhotoScout();
    render();
    return;
  }
  if (pill.dataset.action === 'view-overblik') {
    state.view = 'overblik'; state.filter = 'all';
    document.getElementById('filtersPanel').classList.remove('open');
    render(); return;
  }
  if (pill.dataset.action === 'view-feed') {
    state.view = 'feed';
    document.getElementById('filtersPanel').classList.remove('open');
    render(); return;
  }
  state.filter = pill.dataset.filter;
  state.view = 'feed';     // ethvert filter-valg vises i feed'et
  document.getElementById('filtersPanel').classList.remove('open');
  render();
});

function effectivePos() {
  if (state.lat != null && state.lon != null) return { lat: state.lat, lon: state.lon };
  if (state.gpsLat != null && state.gpsLon != null) return { lat: state.gpsLat, lon: state.gpsLon };
  return null;
}

// Google Maps-link til hele ruten (op til 9 mellem-waypoints understøttes).
function buildFullRouteUrl(route) {
  const s = route.stops;
  if (s.length < 2) return `https://www.google.com/maps/dir/?api=1&destination=${s[0].lat},${s[0].lon}&travelmode=driving`;
  const origin = `${s[0].lat},${s[0].lon}`;
  const dest = `${s[s.length - 1].lat},${s[s.length - 1].lon}`;
  let mids = s.slice(1, -1);
  if (mids.length > 9) {  // udtynd jævnt men bevar rækkefølgen
    const step = mids.length / 9, picked = [];
    for (let i = 0; i < 9; i++) picked.push(mids[Math.floor(i * step)]);
    mids = picked;
  }
  const wp = mids.map(p => `${p.lat},${p.lon}`).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving` +
    (wp ? `&waypoints=${encodeURIComponent(wp)}` : '');
}

const PS_CAT = {
  naturomraader:  { i: '🌿', l: 'Naturområde', c: '#2e7d32' },
  bunkere:        { i: '🪖', l: 'Bunker',      c: '#6d4c41' },
  museum:         { i: '🏛️', l: 'Museum',      c: '#1565c0' },
  legesteder:     { i: '🛝', l: 'Legeplads',   c: '#f9a825' },
  fyrtaarne:      { i: '🗼', l: 'Fyrtårn',     c: '#c62828' },
  gallerier:      { i: '🖼️', l: 'Galleri',     c: '#6a1b9a' },
  kirker:         { i: '⛪', l: 'Kirke',        c: '#455a64' },
  sevaerdigheder: { i: '📸', l: 'Seværdighed', c: '#00838f' },
  strande:        { i: '🏖️', l: 'Strand',      c: '#fbc02d' }
};
function psCat(c) { return PS_CAT[c] || { i: '📍', l: c || 'Attraktion', c: '#e91e63' }; }

let _photoMap = null;   // Leaflet-instans for foto-kortet (fjernes før re-init)

function setPhotoMapMode(on) {
  state.photoMapMode = on;
  localStorage.setItem('fotoscout-photomap', on ? '1' : '0');
  render();
}

function renderPhotoMap(pts, pos) {
  const el = document.getElementById('photoMap');
  if (!el) return;
  if (typeof L === 'undefined') {
    el.innerHTML = '<div class="empty"><div class="icon">🗺️</div><p>Kort kræver net ved første indlæsning</p><p class="sub">Prøv igen med forbindelse — derefter virker det offline.</p></div>';
    return;
  }
  if (_photoMap) { try { _photoMap.remove(); } catch (e) {} _photoMap = null; }
  const map = L.map(el, { zoomControl: true }).setView([56.2, 8.4], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const bounds = [];
  pts.forEach(p => {
    if (!(p.lat && p.lon)) return;
    const c = psCat(p.primary_category);
    const shot = state.photoShot.has(p.id);
    const color = shot ? '#3fb950' : c.c;
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5)"></div>`,
      iconSize: [18, 18], iconAnchor: [9, 9]
    });
    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving`;
    const thumb = p.thumb ? `<img src="./data/${p.thumb}" alt="" style="width:100%;height:96px;object-fit:cover;border-radius:6px;margin-bottom:6px">` : '';
    L.marker([p.lat, p.lon], { icon }).addTo(map).bindPopup(
      `<div style="min-width:170px">${thumb}<b>${esc(p.title)}</b><br>
       <span style="color:#666;font-size:12px">${c.i} ${c.l}${p.city ? ' · ' + esc(p.city) : ''}</span><br>
       <a href="${navUrl}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-weight:700;color:#1565c0;text-decoration:none">🚗 Kør hertil</a><br>
       <button onclick="togglePhotoShot(${p.id})" style="margin-top:6px;padding:5px 10px;border-radius:6px;border:1px solid #ccc;background:${shot ? '#e8f5e9' : '#fff'};cursor:pointer">${shot ? '✓ Fotograferet' : '📷 Markér fotograferet'}</button></div>`);
    bounds.push([p.lat, p.lon]);
  });
  if (pos) {
    L.circleMarker([pos.lat, pos.lon], { radius: 6, color: '#1e88e5', fillColor: '#42a5f5', fillOpacity: 1, weight: 2 })
      .addTo(map).bindPopup('📍 Din position');
  }
  if (bounds.length) { try { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 }); } catch (e) {} }
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 60);
  _photoMap = map;
}

function togglePhotoShot(id) {
  if (state.photoShot.has(id)) state.photoShot.delete(id);
  else state.photoShot.add(id);
  localStorage.setItem('fotoscout-shot', JSON.stringify([...state.photoShot]));
  render();
}

function setPhotoCat(cat) {
  state.photoCat = cat;
  localStorage.setItem('fotoscout-photocat', cat);
  render();
}

function renderFoto(content, statusEl) {
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = 'Mangler foto';
  const pos = effectivePos();
  const all = state.photoScout.map(p => ({
    ...p,
    dist: (pos && p.lat && p.lon) ? haversine(pos.lat, pos.lon, p.lat, p.lon) : null
  }));

  if (!all.length) {
    statusEl.innerHTML = '';
    content.innerHTML = `<div class="empty"><div class="icon">📷</div><p>Ingen foto-liste indlæst</p>
      <p class="sub">Kør photo_scout_feed.py --fotoscout for at opdatere listen</p></div>`;
    return;
  }

  // Kategori-filter: byg pills med antal tilbage pr. kategori (kun kategorier der findes)
  const cat = state.photoCat || 'all';
  const remainCount = {};
  all.filter(p => !state.photoShot.has(p.id)).forEach(p => {
    remainCount[p.primary_category] = (remainCount[p.primary_category] || 0) + 1;
  });
  const cats = [...new Set(all.map(p => p.primary_category))]
    .sort((a, b) => psCat(a).l.localeCompare(psCat(b).l, 'da'));
  const totalRemain = all.filter(p => !state.photoShot.has(p.id)).length;
  const catPill = (key, label, n, active) =>
    `<button class="pill ${active ? 'active' : ''}" onclick="setPhotoCat('${key}')">${label}${n != null ? ` (${n})` : ''}</button>`;
  const catPills = `<div class="filters" style="padding:0 0 12px;display:flex;flex-wrap:wrap;gap:8px">
    ${catPill('all', '📋 Alle', totalRemain, cat === 'all')}
    ${cats.map(k => catPill(k, `${psCat(k).i} ${psCat(k).l}`, remainCount[k] || 0, cat === k)).join('')}
  </div>`;

  const inCat = p => cat === 'all' || p.primary_category === cat;
  const remaining = all.filter(p => !state.photoShot.has(p.id) && inCat(p));
  const done = all.filter(p => state.photoShot.has(p.id) && inCat(p));
  remaining.sort((a, b) => pos
    ? ((a.dist ?? 1e9) - (b.dist ?? 1e9))
    : ((a.city || '').localeCompare(b.city || '', 'da') || a.title.localeCompare(b.title, 'da')));

  const catLabel = cat === 'all' ? '' : ` · ${psCat(cat).l}`;
  statusEl.innerHTML = `<span class="count">${remaining.length}</span> mangler vores foto${catLabel}${done.length ? ` · ${done.length} taget` : ''}`;

  const card = (p) => {
    const c = psCat(p.primary_category);
    const navUrl = (p.lat && p.lon) ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving` : null;
    const imgUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p.title + ' ' + (p.city || ''))}`;
    const shot = state.photoShot.has(p.id);
    // Venstre: nuværende placeholder-billede (thumbnail), ellers kategori-ikon
    const thumb = p.thumb
      ? `<img src="./data/${p.thumb}" alt="Nuværende billede" loading="lazy" style="width:74px;height:74px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--border)">
         <div style="font-size:9px;text-align:center;color:var(--text-dim);margin-top:3px;letter-spacing:.03em">NU: AI-BILLEDE</div>`
      : `<div style="width:74px;height:74px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--pin-bg);border:1px solid var(--border)">${c.i}</div>`;
    return `<div class="rt-stop">
      <div style="flex:0 0 auto;width:74px">${thumb}</div>
      <div class="rt-info">
        <div class="rt-name">${esc(p.title)}${shot ? ' <span style="color:#3fb950">✓</span>' : ''}</div>
        <div class="rt-sub">${esc(p.city || '')}${p.dist != null ? ` · <span class="rt-dist">📏 ${formatDist(p.dist)}</span>` : ''}</div>
        <div style="font-size:12px;color:var(--text-dim,#8b949e);margin:4px 0 8px">${esc(p.reason)}</div>
        <div class="rt-row" style="flex-wrap:wrap;gap:8px">
          ${navUrl ? `<a class="rt-go" href="${navUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🚗 Kør hertil</a>` : ''}
          <a class="rt-go" style="background:none;border:1px solid var(--border,#30363d);color:inherit" href="${imgUrl}" target="fsimg" rel="noopener" onclick="event.stopPropagation()">🔍 Se stedet</a>
          <button class="rt-go" style="cursor:pointer;background:${shot ? 'rgba(63,185,80,0.15)' : 'none'};border:1px solid ${shot ? '#3fb950' : 'var(--border,#30363d)'};color:${shot ? '#3fb950' : 'inherit'}" onclick="togglePhotoShot(${p.id})">${shot ? '✓ Fotograferet' : '📷 Markér fotograferet'}</button>
          <span class="rt-badge">${c.l}</span>
        </div>
      </div>
    </div>`;
  };

  const doneSection = done.length ? `
    <details style="margin-top:16px">
      <summary style="cursor:pointer;color:var(--text-dim,#8b949e);padding:8px 0">✓ Fotograferet (${done.length})</summary>
      <div class="rt-timeline" style="opacity:.6">${done.map(card).join('')}</div>
    </details>` : '';

  const mapMode = state.photoMapMode;
  const toggleRow = `<div class="filters" style="padding:0 0 10px;display:flex;gap:8px">
    <button class="pill ${!mapMode ? 'active' : ''}" onclick="setPhotoMapMode(false)">📋 Liste</button>
    <button class="pill ${mapMode ? 'active' : ''}" onclick="setPhotoMapMode(true)">🗺️ Kort</button>
  </div>`;

  const listBody = (remaining.length ? `<div class="rt-timeline">${remaining.map(card).join('')}</div>`
      : `<div class="empty"><div class="icon">🎉</div><p>${cat === 'all' ? 'Alle attraktioner er fotograferet!' : 'Ingen tilbage i ' + psCat(cat).l + '!'}</p></div>`) + doneSection;
  const mapBody = `<div id="photoMap" style="height:70vh;min-height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--border)"></div>
    <div style="font-size:12px;color:var(--text-dim);padding:8px 2px">Tryk på en pin for billede + <b>Kør hertil</b>. Grønne pins = allerede fotograferet.</div>`;

  content.innerHTML = `<div class="route-wrap">
    <div class="route-intro">Attraktioner på Vestkysten der stadig viser et <b>Gemini-genereret placeholder-billede</b> — de trænger til <b>dit eget foto</b>. ${pos ? 'Sorteret efter afstand fra din position.' : 'Aktivér GPS for afstand/din-position på kortet.'} Skift mellem liste og kort, og vælg kategori nedenfor.</div>
    ${toggleRow}
    ${catPills}
    ${mapMode ? mapBody : listBody}
  </div>`;

  if (mapMode) renderPhotoMap(remaining.concat(done), pos);
}

function renderRuter(content, statusEl) {
  const lbl = document.getElementById('activeFilterLabel');
  if (lbl) lbl.textContent = 'Ruter';
  const pos = effectivePos();

  // Rute-liste
  if (!state.routeId) {
    statusEl.innerHTML = `<span class="count">${ROUTES.length}</span> ruteforslag`;
    content.innerHTML = `<div class="route-wrap">
      <div class="route-intro">Vælg en rute nedenfor. Tryk på en attraktion for info, og tryk <b>Kør hertil</b> for at sende ruten til Google Maps — den vises på bilens skærm via Android Auto.</div>
      ${ROUTES.map(r => {
        let nearest = null;
        if (pos) nearest = Math.min(...r.stops.map(s => haversine(pos.lat, pos.lon, s.lat, s.lon)));
        return `<div class="route-card" onclick="openRoute('${r.id}')">
          <h3>${esc(r.name)}</h3>
          <p>${esc(r.description)}</p>
          <div class="route-meta">
            <span>🗼 ${r.stops.length} stop</span>
            <span>🧭 ${esc(r.direction)}</span>
            ${nearest != null ? `<span>📏 nærmeste ${formatDist(nearest)}</span>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
    return;
  }

  // Rute-detalje (tidslinje af stop)
  const route = ROUTES.find(r => r.id === state.routeId);
  if (!route) { state.routeId = null; return renderRuter(content, statusEl); }
  statusEl.innerHTML = `<span class="count">${route.stops.length}</span> stop · ${esc(route.direction)}`;

  const stopsHtml = route.stops.map((s, i) => {
    const dist = pos ? haversine(pos.lat, pos.lon, s.lat, s.lon) : null;
    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving`;
    return `<div class="rt-stop" onclick="openRouteStop('${route.id}',${i})">
      <div class="rt-rail"><div class="rt-num">${i + 1}</div><div class="rt-line"></div></div>
      <div class="rt-info">
        <div class="rt-name">${esc(s.name)}</div>
        <div class="rt-sub">${esc(s.town || s.address || '')}${dist != null ? ` · <span class="rt-dist">📏 ${formatDist(dist)}</span>` : ''}</div>
        <div class="rt-row">
          <a class="rt-go" href="${navUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🚗 Kør hertil</a>
          ${s.badge ? `<span class="rt-badge">${esc(s.badge)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `<div class="route-wrap">
    <button class="route-back" onclick="backToRuteList()">← Alle ruter</button>
    <div class="route-head">
      <h2>${esc(route.name)}</h2>
      <p>${esc(route.description)}</p>
    </div>
    <a class="route-map-btn" href="${buildFullRouteUrl(route)}" target="_blank" rel="noopener">🗺️ Åbn hele ruten i Google Maps</a>
    <div class="route-map-note">Viser alle stop på kortet. Til navigation undervejs: vælg ét fyrtårn og tryk “Kør hertil”.</div>
    <div class="route-ends"><span>▲ Syd (start)</span><span>Nord (slut) ▼</span></div>
    <div class="rt-timeline">${stopsHtml}</div>
  </div>`;
}

function openRoute(id) {
  state.routeId = id;
  window.scrollTo(0, 0);
  render();
}
function backToRuteList() {
  state.routeId = null;
  window.scrollTo(0, 0);
  render();
}

// Åbn en attraktion fra en rute i detalje-overlayet (genbruger detail-view).
function openRouteStop(routeId, idx) {
  const route = ROUTES.find(r => r.id === routeId);
  if (!route) return;
  const stop = route.stops[idx];
  if (!stop) return;

  const overlay = document.getElementById('detailOverlay');
  document.getElementById('detailTitle').textContent = stop.name;
  const badgeEl = document.getElementById('detailBadge');
  badgeEl.textContent = '🗼 Fyrtårn';
  badgeEl.className = 'detail-badge loc';

  const pos = effectivePos();
  const dist = pos ? haversine(pos.lat, pos.lon, stop.lat, stop.lon) : null;
  const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lon}&travelmode=driving`;
  const imgUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(stop.name + ' fyr')}`;
  const tags = stop.tags || [];

  document.getElementById('detailContent').innerHTML = `
    <div class="gallery-img"><div class="gallery-placeholder">🗼</div></div>
    <div class="detail-body">
      <div class="detail-location">📍 ${esc(stop.address || stop.town || '')}
        ${dist != null ? `<span class="detail-dist">📏 ${formatDist(dist)}</span>` : ''}
      </div>
      ${stop.info ? `<div class="detail-notes">${esc(stop.info)}</div>` : ''}
      ${tags.length ? `<div class="detail-tags">${tags.map(t => `<span class="detail-tag loc">${esc(t)}</span>`).join('')}</div>` : ''}
      <a href="${navUrl}" target="_blank" rel="noopener" class="detail-nav-btn loc">🚗 Kør hertil</a>
      <a href="${imgUrl}" target="_blank" rel="noopener" class="detail-nav-btn secondary">🔍 Se fotos af stedet</a>
    </div>`;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

// --- Detail view ---
function openDetail(id) {
  const item = getItemById(id);
  if (!item) return;
  state.openDetailId = id;

  const isLoc = item.type === 'location';
  const isFlickr = item.type === 'flickr';
  const overlay = document.getElementById('detailOverlay');
  const titleEl = document.getElementById('detailTitle');
  const badgeEl = document.getElementById('detailBadge');
  const contentEl = document.getElementById('detailContent');

  titleEl.textContent = item.name;
  badgeEl.textContent = isLoc ? '📍 Lokation' : isFlickr ? (item.catLabel || '📷 Flickr') : '📸 Inspiration';
  badgeEl.className = `detail-badge ${isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp'}`;

  // Gallery
  const photos = item.photos.filter(p => p);
  let galleryHtml = '';
  if (photos.length > 0) {
    galleryHtml = `
      <div class="gallery" id="gallery" onscroll="updateGalleryDots()">
        ${photos.map(p => `<div class="gallery-img"><img src="${p}" alt="${esc(item.name)}"></div>`).join('')}
      </div>
      ${photos.length > 1 ? `
        <div class="gallery-dots" id="galleryDots">
          ${photos.map((_, i) => `<div class="gallery-dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
        </div>
      ` : ''}
    `;
  } else {
    galleryHtml = `<div class="gallery-img"><div class="gallery-placeholder">${isLoc ? '📍' : isFlickr ? '📷' : '📸'}</div></div>`;
  }

  const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.navTarget)}`;
  const icon = isLoc ? '📍' : isFlickr ? '📷' : '📸';
  const tagCls = isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp';
  const btnCls = isLoc ? 'loc' : isFlickr ? 'flickr' : 'insp';
  const detailTags = isFlickr ? (item.flickrTags || []) : item.tags;
  const flickrCredit = (isFlickr && item.flickrPage)
    ? `<div class="flickr-credit">📷 ${esc(item.ownername || 'Ukendt fotograf')} · <a href="${item.flickrPage}" target="_blank" rel="noopener">Se på Flickr ↗</a></div>`
    : '';

  contentEl.innerHTML = `
    ${galleryHtml}
    <div class="detail-body">
      <div class="detail-location">
        ${icon} ${esc(item.subtitle)}
        ${item.dist !== null ? `<span class="detail-dist">📏 ${formatDist(item.dist)}</span>` : ''}
      </div>
      ${item.landmark ? `<div class="detail-landmark">📍 ${esc(item.landmark)}</div>` : ''}
      ${flickrCredit}
      ${item.notes ? `<div class="detail-notes">${esc(item.notes)}</div>` : ''}
      ${detailTags.length ? `<div class="detail-tags">${detailTags.map(t => `<span class="detail-tag ${tagCls}">${esc(t)}</span>`).join('')}</div>` : ''}
      <a href="${navUrl}" target="_blank" rel="noopener" class="detail-nav-btn ${btnCls}">📍 Navigér hertil</a>
      ${!isFlickr ? `<a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.name)}" target="fsimg" rel="noopener" class="detail-nav-btn ${btnCls}" style="background:none;border:1px solid var(--border,#dee2e6);color:inherit;">🔍 Se flere billeder på Google</a>` : ''}
      <div class="detail-actions">
        <button class="detail-act-btn like ${state.liked.has(item.id) ? 'on' : ''}" onclick="likeItem('${item.id}')">${state.liked.has(item.id) ? '❤️ Synes om' : '🤍 Synes om'}</button>
        ${state.hidden.has(item.id)
          ? `<button class="detail-act-btn" onclick="unhideItem('${item.id}')">↩ Vis igen</button>`
          : `<button class="detail-act-btn" onclick="askHide('${item.id}')">✕ Skjul</button>`}
      </div>
    </div>
  `;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
  state.openDetailId = null;
}

function updateGalleryDots() {
  const gallery = document.getElementById('gallery');
  const dots = document.querySelectorAll('#galleryDots .gallery-dot');
  if (!gallery || dots.length === 0) return;
  const idx = Math.round(gallery.scrollLeft / gallery.offsetWidth);
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
}

// Back button / swipe to close
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSheet(); closeDetail(); }
});

// --- Init ---
async function init() {
  await loadData();
  await loadTowns();
  await loadPhotoScout();

  // Try geolocation
  try {
    const pos = await getPosition();
    state.lat = pos.lat;
    state.lon = pos.lon;
    state.gpsLat = pos.lat; state.gpsLon = pos.lon;   // gem rigtig GPS til "Min position"
    const name = await reverseGeocode(pos.lat, pos.lon);
    state.gpsName = name;
    document.getElementById('locationName').textContent = name;
  } catch {
    document.getElementById('locationName').textContent = 'Ingen GPS';
    document.querySelector('.gps-dot').style.background = '#8b949e';
  }

  buildItems();
  render();

  // Hent Flickr-billeder i baggrunden og gen-render
  await loadFlickr();
  buildItems();
  render();
}

// --- Android-tilbageknap: naviger inde i appen, bekræft kun ved forlad fra forsiden ---
function pushBackTrap() { history.pushState({ fsTrap: true }, ''); }

function handleInAppBack() {
  if (state.openDetailId) { closeDetail(); return true; }              // 1. luk åbent billede
  const sheet = document.getElementById('sheetOverlay');
  if (sheet && sheet.classList.contains('open')) { closeSheet(); return true; }   // 2. luk skjul-ark
  const panel = document.getElementById('filtersPanel');
  if (panel && panel.classList.contains('open')) { panel.classList.remove('open'); return true; }  // 3. luk menu
  if (state.view === 'foto') { state.view = 'overblik'; render(); return true; }   // 4a. foto-liste -> overblik
  if (state.view === 'feed') { backToOverview(); return true; }        // 4. feed/landmark -> overblik
  return false;                                                        // ved overblik-roden
}

window.addEventListener('popstate', () => {
  if (handleInAppBack()) { pushBackTrap(); return; }                   // håndteret internt -> gen-arm fælden
  if (confirm('Vil du forlade FotoScout?')) {
    history.back();                                                    // bekræftet -> forlad appen
  } else {
    pushBackTrap();                                                    // bliv i appen
  }
});

pushBackTrap();   // arm fælden ved opstart, så første tilbage-tryk ikke smider dig ud

init();
</script>
</body>
</html>
